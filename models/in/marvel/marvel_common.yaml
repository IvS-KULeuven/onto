  ########################################################################################################################
  # GigECamera
  ########################################################################################################################

  !STATEMACHINE GigECamera:
      variables_input:
          state                           : { type: beckhoff_vision.ETcVnCameraState            , comment: "Camera state" }
          source                          : { type: GigECameraSources                           , comment: "Camera source" }
      variables_output:
          # general
          frameCounter                    : { type: t_uint32                                    , comment: "Number of frames taken"}
          # parameters
          acquisitionFrameRate            : { type: t_double                                    , comment: "Acquisition frame rate in Hz"}
          exposureTime                    : { type: t_double                                    , comment: "Exposure time in s"}
          gainSelector                    : { type: t_uint32                                    , comment: "Gain selector"}
          gain                            : { type: t_double                                    , comment: "Gain (unitless)"}
          width                           : { type: t_uint32                                    , comment: "Width of the frame, in pixels"}
          height                          : { type: t_uint32                                    , comment: "Height of the frame, in pixels"}
          offsetX                         : { type: t_uint32                                    , comment: "Offset of the frame in X direction, in pixels"}
          offsetY                         : { type: t_uint32                                    , comment: "Offset of the frame in Y direction, in pixels"}
          binningSelector                 : { type: t_uint32                                    , comment: "Binning engine (sensor or FPGA)"}
          binningHorizontal               : { type: t_uint32                                    , comment: "Horizontal binning"}
          binningVertical                 : { type: t_uint32                                    , comment: "Vertical binning"}
          triggerMode                     : { type: t_uint32                                    , comment: "Trigger mode"}
          triggerSelector                 : { type: t_uint32                                    , comment: "Trigger selector"}
      stat:
          health                          : { type: marvel_common.HealthStatus }
          busy                            : { type: marvel_common.BusyStatus }
      proc:
          open                            : { type: marvel_common.Process                       , comment: "Open the camera" }
          close                           : { type: marvel_common.Process                       , comment: "Close the camera" }
          startAcquiring                  : { type: marvel_common.Process                       , comment: "Start acquiring frames" }
          stopAcquiring                   : { type: marvel_common.Process                       , comment: "Stop acquiring frames" }
          reset                           : { type: marvel_common.Process                       , comment: "Reset any errors" }
          setParam                        : { type: GigECameraSetParamProcess                   , comment: "Set a param value" }
          trigger                         : { type: marvel_common.Process                       , comment: "Send a software trigger" }
          pulseTrigger                    : { type: GigECameraPulseTrigger                      , comment: "Send 2 software triggers, with a given duration in between" }
      calls:
          reset:
              isEnabled                   : !BOOL TRUE
          open:
              isEnabled                   : !OR [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIAL ], 
                                                  !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIALIZED ] ]
          close:
              isEnabled                   : !NOT [ !OR [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIAL ], 
                                                         !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIALIZED ] ] ]
          startAcquiring:
              isEnabled                   : !OR [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIAL ], 
                                                  !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIALIZED ], 
                                                  !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_OPENED ] ]
          stopAcquiring:
              isEnabled                   : !NOT [ !OR [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIAL ], 
                                                         !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIALIZED ] ] ]
          setParam:
              isEnabled                   : !BOOL TRUE
          trigger:
              isEnabled                   : !BOOL TRUE
          pulseTrigger:
              isEnabled                   : !BOOL TRUE
          # stat
          health:
              superState                  : !NOT [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIAL ] ]
              isGood                      : !NOT [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_ERROR ] ]
              hasWarning                  : !BOOL FALSE
          busy:
              superState                  : !NOT [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIAL ] ]
              isBusy                      : !OR [ !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_INITIALIZING ],
                                                  !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_OPENING ],
                                                  !EQ [ state, beckhoff_vision.ETcVnCameraState.TCVN_CS_CLOSING ]
                                                ]

