      htVesSideE:    { type: HeaterConfig, comment: "Config for heater Vessel Side SE" }
      htVesSideW:    { type: HeaterConfig, comment: "Config for heater Vessel Side SW" }
 
      htVesLidN:     { type: HeaterConfig, comment: "Config for heater Vessel Lid N" }
