  ###################################
  ### state machine bench control ###
  ###################################
  !STATEMACHINE BenchControl:
    variables_output:
      avgTemp       : { type: t_double, comment: "Average temperature of the bench in kelvin" }
      maxDeviation : { type: t_double                                               , comment: "Maximum deviation of the temperature sensors in kelvin" }
      avgDeviation : { type: t_double                                               , comment: "Average deviation of the temperature sensors in kelvin" }
      totalPower       : { type: t_double              , comment: "Total power of all heaters in percentage" }
      avgPower           : { type: t_double              , comment: "Average power of the heaters in percentage" }

    parts:
      #sensors
      tCentre:        { type: TempMeasurement, comment: "Bench centre",             arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tCentreTH10k:   { type: TempMeasurement, comment: "Bench centre TH10k",       arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tCollBench:     { type: TempMeasurement, comment: "Collimator bench",          arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tEchelleCryo:   { type: TempMeasurement, comment: "Echelle cryo",             arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tCamCryo:       { type: TempMeasurement, comment: "Camera cryo",              arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tColl:          { type: TempMeasurement, comment: "Collimator",               arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tPrism:         { type: TempMeasurement, comment: "Prism",                    arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tEchelle:       { type: TempMeasurement, comment: "Echelle",                  arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tCam:           { type: TempMeasurement, comment: "Camera",                   arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tInOptics:      { type: TempMeasurement, comment: "In-optics",                arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

      #heaters
      htCollBench:     { type: HeaterControl, comment: "Heater control for collimator bench",  arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig } } }
      htEchelleCryo:   { type: HeaterControl, comment: "Heater control for echelle cryo",      arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig } } }
      htCamCryo:       { type: HeaterControl, comment: "Heater control for camera cryo",       arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig } } }
      htEchellePrism:  { type: HeaterControl, comment: "Heater control for echelle/prism",     arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig } } }
      
    references:
      config_ref              : { type: BenchConfig                              , comment: "Active configuration of the bench" }
      sharedConfig_ref        : { type: ThermoSharedConfig                        , comment: "Shared config for the thermo system" }
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
      operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }

    stat:
      init                        : { type: marvel_common.InitializationStatus }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the bench healthy?" }
      control           : { type: TempControlStatus                   , comment: "Actual state of the bench" }
      busy            : { type: marvel_common.BusyStatus           , comment: "Is the bench busy with a procedure?" }  

    proc:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
      start                       : { type: marvel_common.Process                     , comment: "Start warming up" }
      stop                        : { type: marvel_common.Process                     , comment: "Stop heating" }
      reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   
      lock                        : { type: marvel_common.Process                     , comment: "Lock the bench control (e.g. when the bench is opened)" }
      unlock                      : { type: marvel_common.Process                     , comment: "Unlock the bench control (e.g. when the bench is closed)" }

    calls:
    ###proc's###
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ,
                                      !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ]
    ###parts###
        #sensors
        tCentre:        { config_ref: config_ref.tCentre, sharedConfig_ref: config_ref.shared.sensors }
        tCentreTH10k:   { config_ref: config_ref.tCentreTH10k, sharedConfig_ref: config_ref.shared.sensors }
        tCollBench:     { config_ref: config_ref.tCollBench, sharedConfig_ref: config_ref.shared.sensors }
        tEchelleCryo:   { config_ref: config_ref.tEchelleCryo, sharedConfig_ref: config_ref.shared.sensors }
        tCamCryo:       { config_ref: config_ref.tCamCryo, sharedConfig_ref: config_ref.shared.sensors }
        tColl:          { config_ref: config_ref.tColl, sharedConfig_ref: config_ref.shared.sensors }
        tPrism:         { config_ref: config_ref.tPrism, sharedConfig_ref: config_ref.shared.sensors }
        tEchelle:       { config_ref: config_ref.tEchelle, sharedConfig_ref: config_ref.shared.sensors }
        tCam:           { config_ref: config_ref.tCam, sharedConfig_ref: config_ref.shared.sensors }
        tInOptics:      { config_ref: config_ref.tInOptics, sharedConfig_ref: config_ref.shared.sensors }

        #heaters
        htCollBench:     { config_ref: config_ref.htCollBench, sharedConfig_ref: config_ref.shared.heaters }
        htEchelleCryo:   { config_ref: config_ref.htEchelleCryo, sharedConfig_ref: config_ref.shared.heaters }
        htCamCryo:       { config_ref: config_ref.htCamCryo, sharedConfig_ref: config_ref.shared.heaters }
        htEchellePrism:  { config_ref: config_ref.htEchellePrism, sharedConfig_ref: config_ref.shared.heaters }

