########################################################################################################################
#                                                                                                                      #
# Model containing the spectro temperature control unit software design                                              #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:

!LIBRARY marvel_thermoVac:

########################################################################################################################
# stuses
########################################################################################################################
  !ENUMERATION TempControlStates:
     items: [idle, warming_up, unstable, controlled ]

  !STATUS TempControlStatus:
      variables_input:
          isControlled: { type: t_bool, comment: "True if the vessel is in controlled state" }
          isActive: { type: t_bool, comment: "True if the vessel is active (not idle)" }
          isWarmingUp: { type: t_bool, comment: "True if the vessel is warming up" }
      states:
          idle:
              expr: !NOT [isActive]
              comment: "idle"
          warming_up:
              expr: !AND [ isActive, isWarmingUp ]
              comment: "warming_up"
          unstable:
              expr: !AND [ isActive, !NOT [isWarmingUp] , !NOT [isControlled] ]
              comment: "unstable (not idle and not warming up)"
          controlled:
              expr: !AND [ isActive, !NOT [isWarmingUp] , isControlled ]
              comment: "controlling"




########################################################################################################################
# configs
########################################################################################################################

  ### common configs ##########################################

  ### single heater config ####
  !CONFIG HeaterConfig:
    items:
      enabled : { type: t_bool, comment: "True if the heater is enabled", initial: !BOOL TRUE }
      maxPower : { type: t_double, comment: "Maximum power of the heater", initial: !DOUBLE 100.0 }
      Kp : { type: t_double, comment: proportional gain }
      Tn : { type: t_double, comment: integral gain (in seconds) }
      Tv : { type: t_double, comment: derivative gain D-T1 (in seconds) }
      Td : { type: t_double, comment: derivative damping time D-T1 (in seconds) }
      
  ### single temperature sensor config (small variation of version found in marvel_common) ###
  !CONFIG MeasurementConfig2:
    items:
      enabled:
          type: t_bool
          comment: "Is the quantity being measured? (Can be false e.g. if the sensor is deliberately not connected (yet).)"
          initial: !BOOL TRUE
      gain:
          type: t_double
          comment: "Gain to be applied to the measured value (default: 1 = no gain)"
          initial: !DOUBLE 1.0
      offset:
          type: t_double
          comment: "Offset to be added to the measured value (default: 0 = no offset)"


  ### simulation config ###
  !CONFIG SimulationConfig:
    items:
      ambient: { type: t_double, comment: starting temp of sensors}
      heating: {type: t_double, comment: heating gain/factor (0-1)}
      cooling: {type: t_double, comment: cooling factor (0-1)}
      noise: {type: t_double, comment: factor (0-1) multiplied with random number (0-1) to create noise in the simulated temperature}



  ##### shared configs ##############################################################

  ### shared config for heaters ### (COMMON)
  !CONFIG SharedHeaterConfig:
    items:
            hihiDeviation               : { type: t_double, comment: "max dev from setpoint" }
            hiDeviation              : { type: t_double  , comment: "warning dev from setpoint" }
            maxPower                  : { type: t_double, comment: "Maximum total power of all heaters in percentage", initial: !DOUBLE 100.0 }
            simulation                 : {type: SimulationConfig}

  ### shared config for the outer room###
  !CONFIG OuterRoomSharedConfig:
    items:
      sensors              : { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Alarm config for the temperature sensors in the outer room" }
  
  ### shared config for the inner room###
  !CONFIG InnerRoomSharedConfig:
    items:
      sensors              : { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Alarm config for the temperature sensors in the inner room" }

  ### shared config for the vessel ###
  !CONFIG VesselSharedConfig:
    items:
      sensors              : { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Alarm config for the temperature sensors in the vessel" }
      heaters: { type: SharedHeaterConfig, comment: "Shared config for the heaters in the vessel" }

  ### shared config for the shield ###
  !CONFIG ShieldSharedConfig:
    items:
      sensors              : { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Alarm config for the temperature sensors in the shield" }
  
  ### shared config for the bench ###
  !CONFIG BenchSharedConfig:
    items:
      sensors              : { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Alarm config for the temperature sensors in the bench" }

  ### shared config for the cryo ###
  !CONFIG CryoSharedConfig:
    items:
      sensors              : { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Alarm config for the temperature sensors in the cryo" }
      heaters:             { type: SharedHeaterConfig, comment: "Shared config for the heaters in the cryo" }

  ### shared config for all thermo parts ###
  !CONFIG ThermoSharedConfig:
    items:
      bool : { type: t_bool, comment : "place holder, shared config currently not used"}
          


  ### main configs ########################################################

  ### outer room config ###
  #########################
  !CONFIG OuterRoomConfig:
    items:
      shared              : { type: OuterRoomSharedConfig, comment: "Shared config for the outer room" }

  ### inner room config ###
  #########################
  !CONFIG InnerRoomConfig:
    items:
      tpT1:          { type: MeasurementConfig2, comment: "Config for temp sensor T1" }
      tpT2:          { type: MeasurementConfig2, comment: "Config for temp sensor T2" }
      tpT3:          { type: MeasurementConfig2, comment: "Config for temp sensor T3" }
      tpT4:          { type: MeasurementConfig2, comment: "Config for temp sensor T4" }
      shared              : { type: InnerRoomSharedConfig, comment: "Shared config for the inner room" }

  ###### vessel config ######
  ###########################
  !CONFIG VesselConfig:
    items:
      isSimulated : {type: t_bool, comment: "True if the vessel temperature control is in simulation mode"}
      setPointTarget             : { type: t_double  , comment: "set point temperature in kelvin" }
      rampVPos                   : { type: t_double  , comment: "velocity of temperature change in K/s while ramping up" }
      rampVNeg                   : { type: t_double  , comment: "velocity of temperature change in K/s while ramping down" }
      rampStart                  : { type: t_double  , comment: "temperature in kelvin at which the ramp starts (e.g. to avoid overshoot)" }
      hihiDeviation               : { type: t_double, comment: "max dev from setpoint for the vessel" }
      hiDeviation              : { type: t_double  , comment: "warning dev from setpoint for the vessel" }

      shared              : { type: VesselSharedConfig, comment: "Shared config for the vessel" }

      #sensors
      tpLegNE:       { type: MeasurementConfig2, comment: "Config for Leg NE" }
      tpLegNW:       { type: MeasurementConfig2, comment: "Config for Leg NW" }
      tpLegSE:       { type: MeasurementConfig2, comment: "Config for Leg SE" }
      tpLegSW:       { type: MeasurementConfig2, comment: "Config for Leg SW" }

      tpLegTopNE:    { type: MeasurementConfig2, comment: "Config for Leg Top NE" }
      tpLegTopNW:    { type: MeasurementConfig2, comment: "Config for Leg Top NW" }
      tpLegTopSE:    { type: MeasurementConfig2, comment: "Config for Leg Top SE" }
      tpLegTopSW:    { type: MeasurementConfig2, comment: "Config for Leg Top SW" }

      tpVesBotNE:    { type: MeasurementConfig2, comment: "Config for Vessel Bottom NE" }
      tpVesBotNW:    { type: MeasurementConfig2, comment: "Config for Vessel Bottom NW" }
      tpVesBotSE:    { type: MeasurementConfig2, comment: "Config for Vessel Bottom SE" }
      tpVesBotSW:    { type: MeasurementConfig2, comment: "Config for Vessel Bottom SW" }

      tpCentre:      { type: MeasurementConfig2, comment: "Config for Centre" }
      tpCentreTH10K: { type: MeasurementConfig2, comment: "Config for Centre TH10K" }

      tpVesSideN:    { type: MeasurementConfig2, comment: "Config for Vessel Side N" }
      tpVesSideS:    { type: MeasurementConfig2, comment: "Config for Vessel Side S" }
      tpVesSideE:    { type: MeasurementConfig2, comment: "Config for Vessel Side E" }
      tpVesSideW:    { type: MeasurementConfig2, comment: "Config for Vessel Side W" }

      tpVesLidN:     { type: MeasurementConfig2, comment: "Config for Vessel Lid N" }
      tpVesLidS:     { type: MeasurementConfig2, comment: "Config for Vessel Lid S" }

      #heaters
      htLegNE:       { type: HeaterConfig, comment: "Config for heater Leg NE" }
      htLegNW:       { type: HeaterConfig, comment: "Config for heater Leg NW" }
      htLegSE:       { type: HeaterConfig, comment: "Config for heater Leg SE" }
      htLegSW:       { type: HeaterConfig, comment: "Config for heater Leg  SW" }

      htLegTopNE:    { type: HeaterConfig, comment: "Config for heater Leg Top NE" }
      htLegTopNW:    { type: HeaterConfig, comment: "Config for heater Leg Top NW" }
      htLegTopSE:    { type: HeaterConfig, comment: "Config for heater  Leg Top SE" }
      htLegTopSW:    { type: HeaterConfig, comment: "Config for heater  Leg Top SW" }

      htVesBotNE:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom NE" }
      htVesBotNW:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom NW" }
      htVesBotSE:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom SE" }
      htVesBotSW:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom SW" }

      htVesSideN:    { type: HeaterConfig, comment: "Config for heater Vessel Side NE" }
      htVesSideS:    { type: HeaterConfig, comment: "Config for heater Vessel Side NW" }
      htVesSideE:    { type: HeaterConfig, comment: "Config for heater Vessel Side SE" }
      htVesSideW:    { type: HeaterConfig, comment: "Config for heater Vessel Side SW" }

      htVesLidN:     { type: HeaterConfig, comment: "Config for heater Vessel Lid N" }
      htVesLidS:     { type: HeaterConfig, comment: "Config for heater Vessel Lid S" }


  ### shield config ###
  #####################
  !CONFIG ShieldConfig:
    items:
      shared              : { type: ShieldSharedConfig, comment: "Shared config for the shield" }
  
  ### bench config ###
  ####################
  !CONFIG BenchConfig:
    items:
      shared              : { type: BenchSharedConfig, comment: "Shared config for the bench" }
  
  ### cryo config ###
  ###################
  !CONFIG CryoConfig:
    items:
      shared              : { type: CryoSharedConfig, comment: "Shared config for the cryo" }
      tpCryoRear:    { type: MeasurementConfig2, comment: "config for sensor cryo rear (outside)" }
      htCryoRear:    { type: HeaterConfig, comment: "config for heater cryo rear (outside)" }

  ###### thermo config ######
  ###########################
  !CONFIG ThermoConfig:
    items:
      outerRoom: { type: OuterRoomConfig, comment: "Config for the outer room" }
      innerRoom: { type: InnerRoomConfig, comment: "Config for the inner room" }
      vessel: { type: VesselConfig, comment: "Config for the vessel" }
      shield: { type: ShieldConfig, comment: "Config for the shield" }
      bench: { type: BenchConfig, comment: "Config for the bench" }
      cryo: { type: CryoConfig, comment: "Config for the cryo" }
      shared: { type: ThermoSharedConfig, comment: "Shared config for the thermo system" }
      
      
      

########################################################################################################################
# state machine's 
########################################################################################################################

### COMMON state machines ###############################################

### state machine single temp measurement ###
  !STATEMACHINE TempMeasurement:
    variables_hidden:
        rawValue        : { type: t_float              , comment: "Measured raw value"                                        , address: "%I*" }
        conversionFactor: { type: t_double             , comment: "rawValue * conversionFactor = temperature.degrees.value"  }

    variables_output:
        actual          : { type: t_double          , comment: "Actual value" }
        average         : { type: t_double          , comment: "Moving average value" }
        error           : { type: t_bool         , comment: "true if there is an error" }

    variables_input:
      isSimulated : {type: t_bool}
      simulatedVal: {type: t_double}

    references:
        config_ref          : { type: MeasurementConfig2, comment: "Reference to the config (alarms in degrees celsius)" }
        sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig, comment: "Reference to the alarm config for the sensor" }


    stat:
        enabled         : { type: marvel_common.EnabledStatus        , comment: "Is the measurement enabled?" }
        health          : { type: marvel_common.HealthStatus         , comment: "Is the measurement OK?" }
        alarm           : { type: marvel_common.HiHiLoLoAlarmStatus  , comment: "Alarm status"}

    calls:
        enabled:
            superState   : !BOOL TRUE
            isEnabled    : config_ref.enabled

        health:
            superState   : !EQ [ stat.enabled, marvel_common.EnabledStatus.enabled ]
            isGood       : !NOT [ !OR [
                                       !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.hiHi ],
                                       !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.loLo ],
                                       error
                                     ] ]
            hasWarning   : !OR [
                                !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.hi ],
                                !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.lo ]
                               ]


### state machine single heater ###
  !STATEMACHINE HeaterControl:
    variables_output:
        power                   : { type: t_double, comment: "Current power of the heater in percentage" } 
        active                  : { type: t_bool, comment: "True if the heater is active" }
        deviation               : { type: t_double, comment: "Current error between set point and associated temperature" }
        isControlled            : { type: t_bool, comment: "True if the heater is in controlled state" }
        simTemp                  : { type: t_double, comment: "Simulated temperature for testing the heater control" }
        
    variables_input:     
        setPoint                : { type: t_double, comment: "Current set point of the heater in kelvin" }
        temp                : { type: t_double, comment: "Associated temperature of the heater in kelvin" }
        isSimulated : {type: t_bool}


    references:
        config_ref                  : { type: HeaterConfig    , comment: "Reference to the heater config" }
        sharedConfig_ref            : { type: SharedHeaterConfig, comment: "Reference to the shared heater config" }

    stat:
      init                        : { type: marvel_common.InitializationStatus }
      enabled         : { type: marvel_common.EnabledStatus        , comment: "Is the heater enabled?" }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the heater healthy?" }
    proc:
      initialize      : { type: marvel_common.Process                     , comment: "Initialize the heater" }
      reset           : { type: marvel_common.Process                     , comment: "Reset the heater" }

    calls:
        enabled:
          superState   : !BOOL TRUE
          isEnabled    : config_ref.enabled
      #proc
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ] ] 

        reset:
          isEnabled    : !BOOL TRUE


### main state machines ##########################################################    

  ################################
  ### state machine outer room ###
  ################################
  !STATEMACHINE OuterRoomControl:
    variables_output:
      avgTemp       : { type: t_double, comment: "Average temperature of the outer room in kelvin" }
      maxDeviation : { type: t_double                                               , comment: "Maximum deviation of the temperature sensors in kelvin" }
      avgDeviation : { type: t_double                                               , comment: "Average deviation of the temperature sensors in kelvin" }
      totalPower       : { type: t_double              , comment: "Total power of all heaters in percentage" }
      avgPower           : { type: t_double              , comment: "Average power of the heaters in percentage" }
    
    references:
      config_ref              : { type: OuterRoomConfig                              , comment: "Active configuration of the outer room" }
      sharedConfig_ref        : { type: ThermoSharedConfig                        , comment: "Shared config for the thermo system" }
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
      operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }

    stat:
      init                        : { type: marvel_common.InitializationStatus }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the outer room healthy?" }
      control           : { type: TempControlStatus                   , comment: "Actual state of the outer room" }
      busy            : { type: marvel_common.BusyStatus           , comment: "Is the outer room busy with a procedure?" }

    proc:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
      start                       : { type: marvel_common.Process                     , comment: "Start warming up" }
      stop                        : { type: marvel_common.Process                     , comment: "Stop heating" }
      reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   
      lock                        : { type: marvel_common.Process                     , comment: "Lock the outer room control (e.g. when the outer room is opened)" }
      unlock                      : { type: marvel_common.Process                     , comment: "Unlock the outer room control (e.g. when the outer room is closed)" }

    calls:
    ###proc's###
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ,
                                      !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ] 

  ################################
  ### state machine inner room ###
  ################################
  !STATEMACHINE InnerRoomControl:
    variables_output:
      avgTemp       : { type: t_double, comment: "Average temperature of the inner room in kelvin" }
      maxDeviation : { type: t_double                                               , comment: "Maximum deviation of the temperature sensors in kelvin" }
      avgDeviation : { type: t_double                                               , comment: "Average deviation of the temperature sensors in kelvin" }
      totalPower       : { type: t_double              , comment: "Total power of all heaters in percentage" }
      avgPower           : { type: t_double              , comment: "Average power of the heaters in percentage" }

    parts:
      tpT1:          { type: TempMeasurement, comment: "1st temp sensor",           arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpT2:          { type: TempMeasurement, comment: "2nd temp sensor",           arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpT3:          { type: TempMeasurement, comment: "3rd temp sensor",           arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpT4:          { type: TempMeasurement, comment: "4th temp sensor",           arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

    references:
      config_ref              : { type: InnerRoomConfig                              , comment: "Active configuration of the inner room" }
      sharedConfig_ref        : { type: ThermoSharedConfig                        , comment: "Shared config for the thermo system" }
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
      operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }

    stat:
      init                        : { type: marvel_common.InitializationStatus }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the vessel healthy?" }
      control           : { type: TempControlStatus                   , comment: "Actual state of the vessel" }
      busy            : { type: marvel_common.BusyStatus           , comment: "Is the vessel busy with a procedure?" }

    proc:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
      start                       : { type: marvel_common.Process                     , comment: "Start warming up" }
      stop                        : { type: marvel_common.Process                     , comment: "Stop heating" }
      reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   
      lock                        : { type: marvel_common.Process                     , comment: "Lock the vessel control (e.g. when the vessel is opened)" }
      unlock                      : { type: marvel_common.Process                     , comment: "Unlock the vessel control (e.g. when the vessel is closed)" }

    calls:
    ###proc's###
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ,
                                      !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ] 
    ###parts###
        tpT1          :  { config_ref : config_ref.tpT1, sharedConfig_ref : config_ref.shared.sensors }
        tpT2          :  { config_ref : config_ref.tpT2, sharedConfig_ref : config_ref.shared.sensors }
        tpT3          :  { config_ref : config_ref.tpT3, sharedConfig_ref : config_ref.shared.sensors }
        tpT4          :  { config_ref : config_ref.tpT4, sharedConfig_ref : config_ref.shared.sensors }


####################################
### state machine vessel control ###
####################################
  !STATEMACHINE VesselControl:
    variables_output:
      avgTemp       : { type: t_double                                              , comment: "Average temperature of the vessel in kelvin" }
      maxDeviation : { type: t_double                                               , comment: "Maximum deviation of the temperature sensors in kelvin" }
      avgDeviation : { type: t_double                                               , comment: "Average deviation of the temperature sensors in kelvin" }
      totalPower       : { type: t_double              , comment: "Total power of all heaters in percentage" }
      avgPower           : { type: t_double              , comment: "Average power of the heaters in percentage" }

      tStatBottomPwr        :    { type: t_bool, comment: "Thermostat switch vessel bottom power ", address: "%Q*" } 
      tStatCryoRearPwr     :    { type: t_bool, comment: "Thermostat switch cryo rear power ", address: "%Q*" }
      tStatLidPwr       :    { type: t_bool, comment: "Thermostat switch lid top power ", address: "%Q*" }
     

    variables_input:
      tStatBottomOk              :    { type: t_bool, comment: "State of the thermostat switch at the vessel bottom", address: "%I*" }
      tStatCryoRearOk             :    { type: t_bool, comment: "State of the thermostat switch at the cryo rear", address: "%I*" }
      tStatLidOk                 :    { type: t_bool, comment: "State of the thermostat switch at the lid top", address: "%I*" }


    parts:
      #sensors
      tpLegNE:       { type: TempMeasurement, comment: "Leg NE",                    arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpLegNW:       { type: TempMeasurement, comment: "Leg NW",                    arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpLegSE:       { type: TempMeasurement, comment: "Leg SE",                    arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpLegSW:       { type: TempMeasurement, comment: "Leg SW",                    arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

      tpLegTopNE:    { type: TempMeasurement, comment: "Leg Top NE",                arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpLegTopNW:    { type: TempMeasurement, comment: "Leg Top NW",                arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpLegTopSE:    { type: TempMeasurement, comment: "Leg Top SE",                arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpLegTopSW:    { type: TempMeasurement, comment: "Leg Top SW",                arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

      tpVesBotNE:    { type: TempMeasurement, comment: "Vessel Bottom NE",          arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesBotNW:    { type: TempMeasurement, comment: "Vessel Bottom NW",          arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesBotSE:    { type: TempMeasurement, comment: "Vessel Bottom SE",          arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesBotSW:    { type: TempMeasurement, comment: "Vessel Bottom SW",          arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

      tpCentre:      { type: TempMeasurement, comment: "Centre",                    arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpCentreTH10K: { type: TempMeasurement, comment: "Centre TH10K",              arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

      tpVesSideN:    { type: TempMeasurement, comment: "Vessel Side N",             arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesSideS:    { type: TempMeasurement, comment: "Vessel Side S",             arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesSideE:    { type: TempMeasurement, comment: "Vessel Side E",             arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesSideW:    { type: TempMeasurement, comment: "Vessel Side W",             arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }

      tpVesLidN:     { type: TempMeasurement, comment: "Vessel Lid N",              arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }
      tpVesLidS:     { type: TempMeasurement, comment: "Vessel Lid S",              arguments: { config_ref: { type: MeasurementConfig2 }, sharedConfig_ref: { type: marvel_common.HiHiLoLoAlarmConfig } } }


      #heaters
