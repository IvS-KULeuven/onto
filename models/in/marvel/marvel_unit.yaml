########################################################################################################################
#                                                                                                                      #
# Model containing the unit-level software design of the Marvel TCS.                                                   #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_dome.yaml:
!IMPORT models/in/marvel/marvel_telescope.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_unit:


  ########################################################################################################################
  # UnitConfig
  ########################################################################################################################
  !CONFIG UnitConfig:
      items:
        dome:       { type: marvel_dome.DomeConfig              , comment: "Dome config of a Marvel unit", expand: false }
        telescope:  { type: marvel_telescope.TelescopeConfig    , comment: "Telescope config of a Marvel unit", expand: false }
        longitude:  { type: t_double                            , comment: "Unit location: longitude [degrees, positive = E, negative = W]" }
        latitude:   { type: t_double                            , comment: "Unit location: latitude [degrees, positive = N, negative = S]" }
        height:     { type: t_float                             , comment: "Unit location: height above sea-level [m]" }


  ########################################################################################################################
  # Unit
  ########################################################################################################################
  !STATEMACHINE Unit:
      variables:
          number                    : { type: t_uint8                           , comment: "Number of the unit (1-4)" }
          editableConfig            : { type: UnitConfig                        , comment: "Editable configuration of the unit" , expand: false }
      variables_read_only:
          config                    : { type: UnitConfig                        , comment: "Active configuration of the unit" }
          targetAlpha               : { type: marvel_common.AngularPosition       , comment: "The target alpha coordinate (Right Ascention)" , expand: false}
          targetDelta               : { type: marvel_common.AngularPosition       , comment: "The target delta coordinate (Declination)" , expand: false }
      references:
        operator_ref                : { type: marvel_common.OperatorStatus        , comment: "Reference to the operator (observer/tech)"}
        activity_ref                : { type: marvel_common.ActivityStatus        , comment: "Shared activity status"}
        services_ref                : { type: marvel_services.Services          , comment: "Shared services", expand: false}
      parts:
          dome:
              type : marvel_dome.Dome
              comment: "The dome"
              expand: false
              arguments:
                  operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                  activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                  services_ref              : { type: marvel_services.Services              , expand: false }
                  config_ref                : { type: marvel_dome.DomeConfig                , expand: false }
                  telescopeAzi              : { type: marvel_common.AngularPosition         , expand: false }
              attributes:
                  # isTracking              : { type: t_bool }
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
                  proc:
                      attributes:
                        syncWithAxes:
                            attributes:
                                isEnabled : { type: t_bool }
                        stop:
                            attributes:
                                isEnabled : { type: t_bool }
          telescope:
              type : marvel_telescope.Telescope
              comment: "The telescope"
              expand: false
              arguments:
                  operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
                  activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                  config_ref              : { type: marvel_telescope.TelescopeConfig    , expand: false }
                  longitude_ref           : { type: t_double }
                  latitude_ref            : { type: t_double }
              attributes:
                  # isTracking              : { type: t_bool }
                  actAzi                  : { type: marvel_common.AngularPosition         , expand: false }
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
                  proc:
                      attributes:
                        slewToCoordinates:
                            attributes:
                                isEnabled : { type: t_bool }
                        abortSlew:
                            attributes:
                                isEnabled : { type: t_bool }
          configManager:
              comment                     : "The config manager (to load/save/activate configuration data)"
              type                        : marvel_common.ConfigManager
      stat:
          init                       : { type: marvel_common.InitializationStatus }
          health                      : { type: marvel_common.HealthStatus }
          busy                        : { type: marvel_common.BusyStatus }
      proc:
          initialize                  : { type: marvel_common.Process                     , comment: "Start initializing the unit" }   
          point                       : { type: marvel_common.PointAlphaDeltaProcess    , comment: "Point the telescope and dome"}     
          stop                        : { type: marvel_common.Process                     , comment: "Stop the rotation movement and/or tracking" }
      calls:
          initialize:
              isEnabled           : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.initializing ] ]
          point:
              isEnabled           : !AND [ parts.telescope.proc.slewToCoordinates.isEnabled,
                                           parts.dome.proc.syncWithAxes.isEnabled ]
          stop:
              isEnabled           : !OR  [ parts.telescope.proc.abortSlew.isEnabled,
                                           parts.dome.proc.stop.isEnabled ]
          dome:
              operator_ref        : operator_ref
              activity_ref        : activity_ref
              services_ref        : services_ref
              config_ref          : config.dome
              telescopeAzi_ref    : parts.telescope.actAzi
          telescope:
              operator_ref        : operator_ref
              activity_ref        : activity_ref
              config_ref          : config.telescope
              longitude_ref       : config.longitude
              latitude_ref        : config.latitude
          configManager:
             isEnabled            : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]
          health:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isGood              : !MTCS_SUMMARIZE_GOOD [ parts.dome, parts.telescope, parts.configManager ]
              hasWarning          : !MTCS_SUMMARIZE_WARN [ parts.dome, parts.telescope, parts.configManager ]
          busy:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isBusy              : !MTCS_SUMMARIZE_BUSY [ parts.dome, parts.telescope, parts.configManager ]

