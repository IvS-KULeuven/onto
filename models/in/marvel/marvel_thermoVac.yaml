      htSideSE:      { type: HeaterControl, comment: "Heater control for shield side SE",    arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig }, operator_ref: { type: marvel_common.OperatorStatus } } }
