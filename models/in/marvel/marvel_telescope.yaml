########################################################################################################################
#                                                                                                                      #
# Model of the Telescope software.                                                                                     #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_telescope:
  
  
  ########################################################################################################################
  # TelescopeKnownPositionConfig
  ########################################################################################################################
  !CONFIG TelescopeKnownPositionConfig:
      items:
          name:
              type: t_string
              len: 16
              comment: "The name of the position (e.g. 'PARK')"
          allowObserver:
              type: t_bool
              comment: "Can an observer switch to this position?"
          azi:
              type: t_double
              comment: "Azimuth in degrees"
          ele:
              type: t_double
              comment: "Elevation in degrees"
          rot:
              type: t_double
              comment: "Nasmyth rotation in degrees"
          doAzi:
              type: t_bool
              comment: "Change the azimuth axis to the 'azi' position"
          doEle:
              type: t_bool
              comment: "Change the elevation axis to the 'ele' position"
          doRot:
              type: t_bool
              comment: "Change the nasmyth rotation axis to the 'rot' position"
  
  
  ########################################################################################################################
  # TelescopeKnownPositionsConfig
  ########################################################################################################################
  !CONFIG TelescopeKnownPositionsConfig:
      items:
          position0     : { type: TelescopeKnownPositionConfig, comment : "Known position 0"   , expand: false }
          position1     : { type: TelescopeKnownPositionConfig, comment : "Known position 1"   , expand: false }
          position2     : { type: TelescopeKnownPositionConfig, comment : "Known position 2"   , expand: false }
          position3     : { type: TelescopeKnownPositionConfig, comment : "Known position 3"   , expand: false }
          position4     : { type: TelescopeKnownPositionConfig, comment : "Known position 4"   , expand: false }
  
  
  ########################################################################################################################
  # TelescopeConfig
  ########################################################################################################################
  
  !CONFIG TelescopeConfig:
      items:
          simulated                   : { type: t_bool                    , comment: "TRUE if the telescope is simulated, FALSE if not"}
          alpacaTelHost               : { type: t_string, len: 16         , comment: "ASA TEL alpaca server IP address or hostname" }  # XXX.XXX.XXX.XXX
          alpacaTelPort               : { type: t_uint16                  , comment: "ASA TEL alpaca server port number" }
          alpacaAccHost               : { type: t_string, len: 16         , comment: "ASA ACC alpaca server IP address or hostname" }
          alpacaAccPort               : { type: t_uint16                  , comment: "ASA ACC alpaca server port number" }
          alpacaLoopTime              : { type: t_uint16                  , comment: "Alpaca loop time in ms" }
          slewingTimeout              : { type: t_uint16                  , comment: "Slewing timeout in s during pointing (both alpha/delta and azi/ele)" }
          knownPositions              : { type: TelescopeKnownPositionsConfig  , comment: "Known (predefined) positions (e.g. could be Park, Cover, Park winter, Mirror washing, ...)", expand: false }
          knownPositionToleranceAzi   : { type: t_double                  , comment: "Tolerance (in degrees) to determine if the telescope is at a known position in azi direction" }
          knownPositionToleranceEle   : { type: t_double                  , comment: "Tolerance (in degrees) to determine if the telescope is at a known position in ele direction" }
          knownPositionToleranceRot   : { type: t_double                  , comment: "Tolerance (in degrees) to determine if the telescope is at a known position in rot direction" }
          initSelectNasmythPort       : { type: t_bool                    , comment: "TRUE to always select a Nasmyth port during initialization"}
          initSelectNasmythPortNumber : { type: t_uint16                  , comment: "Number of the nasmyth port to select during initialization"}
          initPower                   : { type: t_bool                    , comment: "TRUE if the power should be on or off at the end of the initialization"}
          initWaitForAsa              : { type: t_uint16                  , comment: "Seconds to wait for the connection to the ASA PC during initialization"}
          nasmythSelectionTime        : { type: t_uint16                  , comment: "Time in seconds to wait for M3 to switch positions (because no status can be retrieved from ASA)" }
          nasmythPort1Name            : { type: t_string, len: 20         , comment: "Name of Nasmyth port 1" }
          nasmythPort2Name            : { type: t_string, len: 20         , comment: "Name of Nasmyth port 2" }


  ########################################################################################################################
  # TelescopeSlewToAziEleProcess
  ########################################################################################################################
  !PROCESS TelescopeSlewToAziEleProcess:
      extends: marvel_common.BaseProcess
      arguments:
          azimuth               : { type: t_double                            , comment: "Azimuth, in degrees" }
          elevation             : { type: t_double                            , comment: "Elevation, in degrees" }


  ########################################################################################################################
  # TelescopePulseGuideProcess
  ########################################################################################################################
  !PROCESS TelescopePulseGuideProcess:
      extends: marvel_common.BaseProcess
      arguments:
          direction               : { type: t_int32                            , comment: "Direction" }
          duration                : { type: t_int32                            , comment: "Duration" }

  ########################################################################################################################
  # TelescopeSetRateProcess
  ########################################################################################################################
  !PROCESS TelescopeSetRateProcess:
      extends: marvel_common.BaseProcess
      arguments:
          rate                   : { type: t_double                            , comment: "Rate (e.g. guide rate)" }
  

  ########################################################################################################################
  # TelescopeSetTrackingProcess
  ########################################################################################################################
  !PROCESS TelescopeSetTrackingProcess:
      extends: marvel_common.BaseProcess
      arguments:
          tracking              : { type: t_bool                              , comment: "Switch tracking on (TRUE) or off (FALSE)" }
  

  ########################################################################################################################
  # TelescopeSelectNasmythPortProcess
  ########################################################################################################################
  !PROCESS TelescopeSelectNasmythPortProcess:
      extends: marvel_common.BaseProcess
      arguments:
          port                : { type: t_uint16                              , comment: "Port to switch to" }
  
  
  ########################################################################################################################
  # TelescopeMoveKnownPositionProcess
  ########################################################################################################################
  !PROCESS TelescopeMoveKnownPositionProcess:
      extends: marvel_common.BaseProcess
      arguments:
          name        : { type: t_string, len: 16                             , comment: "Name of the position to move to"}
  

  ########################################################################################################################
  # TelescopeMoveProcess
  ########################################################################################################################
  !PROCESS TelescopeMoveProcess:
      extends: marvel_common.BaseProcess
      arguments:
          position               : { type: t_double                            , comment: "New position" }

  ##########################################################################
  # TelescopeNasmythPort
  ##########################################################################
  
  !ENUMERATION TelescopeNasmythPort:
    comment: "The telescope Nasmyth port"
    type: t_byte
    items: [
      UNKNOWN,
      CHANGING,
      POS_1,
      POS_2
    ]

  ########################################################################################################################
  # Telescope
  ########################################################################################################################
  
  !STATEMACHINE Telescope:
      references:
          operator_ref                    : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }
          activity_ref                    : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
          services_ref                    : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
          config_ref                      : { type: TelescopeConfig                           , comment: "Active configuration of the telescope" }
      variables_output:
          isTelConnected                  : { type: t_bool                                  , comment: "True if the TEL server is connected" }
          isAccConnected                  : { type: t_bool                                  , comment: "True if the ACC server is connected" }
          isSlewing                       : { type: t_bool                                  , comment: "True if the telescope is slewing" }
          isTracking                      : { type: t_bool                                  , comment: "True if the telescope is tracking" }
          isPulseGuiding                  : { type: t_bool                                  , comment: "True if the telescope is pulse guiding" }
          # actual position
          actAlpha                        : { type: marvel_common.AngularPosition             , comment: "The actual alpha coordinate (Right Ascention)" , expand: false}
          actDelta                        : { type: marvel_common.AngularPosition             , comment: "The actual delta coordinate (Declination)" , expand: false }
          actAzi                          : { type: marvel_common.AngularPosition             , comment: "The actual azimuth" , expand: false}
          actEle                          : { type: marvel_common.AngularPosition             , comment: "The actual elevation" , expand: false }
          actNasmythPort                  : { type: TelescopeNasmythPort                      , comment: "Actual Nasmyth port" }
          actNasmythPortName              : { type: t_string, len: 20                         , comment: "Actual Nasmyth port name" }
          targetAlpha                     : { type: marvel_common.AngularPosition             , comment: "The target alpha coordinate (Right Ascention)" , expand: false}
          targetDelta                     : { type: marvel_common.AngularPosition             , comment: "The target delta coordinate (Declination)" , expand: false }
          isAtKnownPosition               : { type: t_bool                                  , comment: "True if the telescope is at a known position" }
          actualKnownPositionName         : { type: t_string, len: 16                       , comment: "Name of the known position if isAtKnownPosition is True" }
      stat:
          init                            : { type: marvel_common.InitializationStatus }
          health                          : { type: marvel_common.HealthStatus }
          busy                            : { type: marvel_common.BusyStatus }
          operating                       : { type: marvel_common.OperatingStatus }
          powered                         : { type: marvel_common.PoweredStatus }
      proc:
          initialize                      : { type: marvel_common.Process                         , comment: "Start initializing" }
          lock                            : { type: marvel_common.Process                         , comment: "Lock the cover" }
          unlock                          : { type: marvel_common.Process                         , comment: "Unlock the cover" }
          changeOperatingState            : { type: marvel_common.ChangeOperatingStateProcess     , comment: "Change the operating state (e.g. AUTO, MANUAL, ...)" }
          slewToCoordinates               : { type: marvel_common.PointAlphaDeltaProcess          , comment: "Slew to the given equatorial coordinates" }
          slewToAziEle                    : { type: TelescopeSlewToAziEleProcess                  , comment: "Slew to the given horizontal coordinates" }
          syncToCoordinates               : { type: marvel_common.PointAlphaDeltaProcess          , comment: "Sync to the given equatorial coordinates" }
          syncToAziEle                    : { type: TelescopeSlewToAziEleProcess                  , comment: "Sync to the given horizontal coordinates" }
          syncToTarget                    : { type: marvel_common.Process                         , comment: "Sync to the given target" }
          selectNasmythPort               : { type: TelescopeSelectNasmythPortProcess             , comment: "Select a nasmyth port" }
          abortSlew                       : { type: marvel_common.Process                         , comment: "Stop the slewing" }
          reset                           : { type: marvel_common.Process                         , comment: "Reset any errors" }
          powerOn                         : { type: marvel_common.Process                         , comment: "Power on the axes" }
          powerOff                        : { type: marvel_common.Process                         , comment: "Power off the axes" }
          moveKnownPosition               : { type: TelescopeMoveKnownPositionProcess             , comment: "Move the telescope to the given known position" }
          setTracking                     : { type: TelescopeSetTrackingProcess                   , comment: "Power on the axes" }
          moveM2                          : { type: TelescopeMoveProcess                          , comment: "Move M2 to the given position in mm"}
          openCover                       : { type: marvel_common.Process                         , comment: "Open the telescope cover" }
          closeCover                      : { type: marvel_common.Process                         , comment: "Close the telescope cover" }
          pulseGuide                      : { type: TelescopePulseGuideProcess                    , comment: "Pulse guide" }
          guideRateAlpha                  : { type: TelescopeSetRateProcess                       , comment: "Guide right ascention rate" }
          guideRateDelta                  : { type: TelescopeSetRateProcess                       , comment: "Guide declination rate" }
      calls:
          # proc
          initialize:
              isEnabled                   : !AND [ !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ],
                                                   !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                                         !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                                         !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ] ]
          lock:
              isEnabled                   : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]
          unlock:
              isEnabled                   : !AND [ !EQ [ operator_ref, marvel_common.OperatorStatus.tech ],
                                                   !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
          changeOperatingState:
              isEnabled                   : !AND [ !EQ [ stat.busy, marvel_common.BusyStatus.idle], 
                                                   !EQ [ stat.init, marvel_common.InitializationStatus.initialized], 
                                                   !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ]
          reset:
              isEnabled                   : !AND [ !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ]
          slewToCoordinates:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.powered, marvel_common.PoweredStatus.enabled ] ]
          slewToAziEle:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.powered, marvel_common.PoweredStatus.enabled ] ]
          syncToCoordinates:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.powered, marvel_common.PoweredStatus.enabled ] ]
          syncToAziEle:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.powered, marvel_common.PoweredStatus.enabled ] ]
          syncToTarget:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.powered, marvel_common.PoweredStatus.enabled ] ]
          abortSlew:
              isEnabled                   : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
          selectNasmythPort:
              isEnabled                   : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
          powerOn:
              isEnabled                   : !AND [  !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked] ],
                                                    !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                    !EQ [ proc.powerOn.stat.busy, marvel_common.BusyStatus.idle] ]
          powerOff:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.powerOff.stat.busy, marvel_common.BusyStatus.idle] ]
          moveKnownPosition:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ stat.busy, marvel_common.BusyStatus.idle],
                                                   !EQ [ stat.powered, marvel_common.PoweredStatus.enabled ] ]
          setTracking:
              isEnabled                   : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
          openCover:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.openCover.stat.busy, marvel_common.BusyStatus.idle] ]
          closeCover:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.closeCover.stat.busy, marvel_common.BusyStatus.idle] ]
          moveM2:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.moveM2.stat.busy, marvel_common.BusyStatus.idle] ]
          pulseGuide:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.pulseGuide.stat.busy, marvel_common.BusyStatus.idle] ]
          guideRateAlpha:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.guideRateAlpha.stat.busy, marvel_common.BusyStatus.idle] ]
          guideRateDelta:
              isEnabled                   : !AND [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ proc.guideRateDelta.stat.busy, marvel_common.BusyStatus.idle] ]
          # stat
          health:
              superState                  : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown] ]
              isGood                      : !AND [  !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed] ],
                                                    isTelConnected,
                                                    isAccConnected,
                                                    !MTCS_SUMMARIZE_GOOD [
                                                       proc.initialize,
                                                       proc.changeOperatingState,
                                                       proc.slewToCoordinates,
                                                       proc.slewToAziEle,
                                                       proc.abortSlew,
                                                       proc.powerOn,
                                                       proc.powerOff,
                                                       proc.moveKnownPosition,
                                                       proc.setTracking,
                                                       proc.moveM2,
                                                       proc.openCover,
                                                       proc.closeCover ]
                                            ]
              hasWarning                  : !MTCS_SUMMARIZE_WARN [
                                                       proc.initialize,
                                                       proc.changeOperatingState,
                                                       proc.slewToCoordinates,
                                                       proc.slewToAziEle,
                                                       proc.abortSlew,
                                                       proc.powerOn,
                                                       proc.powerOff,
                                                       proc.moveKnownPosition,
                                                       proc.setTracking,
                                                       proc.moveM2,
                                                       proc.openCover,
                                                       proc.closeCover ]
          busy:
              superState                  : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown] ]
              isBusy                      : !MTCS_SUMMARIZE_BUSY [
                                                       proc.initialize,
                                                       proc.changeOperatingState,
                                                       proc.slewToCoordinates,
                                                       proc.slewToAziEle,
                                                       proc.abortSlew,
                                                       proc.powerOn,
                                                       proc.powerOff,
                                                       proc.moveKnownPosition,
                                                       proc.setTracking,
                                                       proc.moveM2,
                                                       proc.openCover,
                                                       proc.closeCover ]
        #   operating:
        #       superState                  : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
  
  