########################################################################################################################
#                                                                                                                      #
# Model containing the upper-level software design of the Marvel TCS.                                                  #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:


!IMPORT models/in/marvel/marvel_unit.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel:


#   ########################################################################################################################
#   # MarvelConfig
#   ########################################################################################################################
#   !CONFIG MarvelConfig:
#       items:


  ########################################################################################################################
  # MarvelPointProcess
  ########################################################################################################################
  !PROCESS MarvelPointProcess:
      extends: marvel_common.BaseProcess
      arguments:
          alpha               : { type: t_double                            , comment: "Right ascention, in hours" }
          delta               : { type: t_double                            , comment: "Declination, in degrees" }
          u1                  : { type: t_bool                              , comment: "True to point Unit 1" }
          u2                  : { type: t_bool                              , comment: "True to point Unit 2" }
          u3                  : { type: t_bool                              , comment: "True to point Unit 3" }
          u4                  : { type: t_bool                              , comment: "True to point Unit 4" }
  

  ########################################################################################################################
  # MarvelMultiUnitProcess
  ########################################################################################################################
  !PROCESS MarvelMultiUnitProcess:
      extends: marvel_common.BaseProcess
      arguments:
          u1                  : { type: t_bool                              , comment: "True to use Unit 1" }
          u2                  : { type: t_bool                              , comment: "True to use Unit 2" }
          u3                  : { type: t_bool                              , comment: "True to use Unit 3" }
          u4                  : { type: t_bool                              , comment: "True to use Unit 4" }
  

  ########################################################################################################################
  # Marvel
  ########################################################################################################################
  !STATEMACHINE Marvel:
      # variables:
          # editableConfig              : { type: MTCSConfig                  , comment: "Editable configuration of the MTCS" , expand: false }
          # remoteOperationEnable       : { type: t_bool                      , comment: "True to Remote operation enabled" }
          # mocsObservationStatus       : { type: t_bool                      , comment: "True to notify that there is an observation running" }
          # remoteConnectionStatus      : { type: t_bool                      , comment: "True to notify that there is a remote connection" }
          # remoteconnectionPortStatus  : { type: t_bool                      , comment: "True to notify that there is a connection port established" }
          
      variables_read_only:
          noOfFailedOperatorChanges   : { type: t_uint16                    , comment: "How many times has a wrong password been entered?"}
      #    config                      : { type: MTCSConfig                  , comment: "Active configuration of the ServicesTiming subsystem" }
      parts:
          u1:
              type : marvel_unit.Unit
              comment: "Unit 1"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: marvel_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: marvel_common.ActivityStatus          , expand: false }
                  services                : { type: marvel_services.Services            , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: marvel_common.ApertureStatus }
                                        processes:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  statuses:
                      attributes:
                          healthStatus    : { type: marvel_common.HealthStatus }
                          busyStatus      : { type: marvel_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u2:
              type : marvel_unit.Unit
              comment: "Unit 2"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: marvel_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: marvel_common.ActivityStatus          , expand: false }
                  services                : { type: marvel_services.Services            , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: marvel_common.ApertureStatus }
                                        processes:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  statuses:
                      attributes:
                          healthStatus    : { type: marvel_common.HealthStatus }
                          busyStatus      : { type: marvel_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u3:
              type : marvel_unit.Unit
              comment: "Unit 3"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: marvel_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: marvel_common.ActivityStatus          , expand: false }
                  services                : { type: marvel_services.Services            , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: marvel_common.ApertureStatus }
                                        processes:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  statuses:
                      attributes:
                          healthStatus    : { type: marvel_common.HealthStatus }
                          busyStatus      : { type: marvel_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u4:
              type : marvel_unit.Unit
              comment: "Unit 4"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: marvel_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: marvel_common.ActivityStatus          , expand: false }
                  services                : { type: marvel_services.Services            , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: marvel_common.ApertureStatus }
                                        processes:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } } 
                  statuses:
                      attributes:
                          healthStatus    : { type: marvel_common.HealthStatus }
                          busyStatus      : { type: marvel_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          services:
              type : marvel_services.Services
              comment: "Services"
              expand: false
              arguments:
                  operatorStatus          : { type: marvel_common.OperatorStatus, expand: false }
              attributes:
                  statuses:
                      attributes:
                          healthStatus    : { type: marvel_common.HealthStatus }
                          busyStatus      : { type: marvel_common.BusyStatus }
        #   configManager:
        #       comment                     : "The config manager (to load/save/activate configuration data)"
        #       type                        : marvel_common.ConfigManager
      statuses:
          initializationStatus        : { type: marvel_common.InitializationStatus }
          healthStatus                : { type: marvel_common.HealthStatus }
          busyStatus                  : { type: marvel_common.BusyStatus }
          operatorStatus              : { type: marvel_common.OperatorStatus }
          passwordHealthStatus        : { type: marvel_common.HealthStatus }
          activityStatus              : { type: marvel_common.ActivityStatus }
      processes:
          initialize                  : { type: marvel_common.Process                         , comment: "Start initializing the whole MTCS" }      
          lock                        : { type: marvel_common.Process                         , comment: "Lock the whole MTCS" }
          unlock                      : { type: marvel_common.Process                         , comment: "Unlock the whole MTCS" }
          changeOperator              : { type: marvel_common.ChangeOperatorStateProcess      , comment: "Change the operator (e.g. OBSERVER, TECH, ...)" }
          verifyPassword              : { type: marvel_common.ChangeOperatorStateProcess      , comment: "Only verify the operator password" }
          wakeUp                      : { type: marvel_common.Process                         , comment: "Wake up the whole Marvel TCS" }
          goToSleep                   : { type: marvel_common.Process                         , comment: "Let the whole Marvel TCS go to sleep" }
          emergencyClose              : { type: marvel_common.Process                         , comment: "Close all domes asap" }
          point                       : { type: MarvelPointProcess                          , comment: "Point multiple units at once"}
          openDomes                   : { type: MarvelMultiUnitProcess                      , comment: "Open the dome of multiple units at once"}
          closeDomes                  : { type: MarvelMultiUnitProcess                      , comment: "Close the dome of multiple units at once"}
          stopDomes                   : { type: MarvelMultiUnitProcess                      , comment: "Stop the dome of multiple units at once"}
      calls:
          initialize:
              isEnabled           : !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initializing ] ]
          lock:
              isEnabled           : !AND [ !EQ [ statuses.operatorStatus, marvel_common.OperatorStatus.tech ],
                                           !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ] ]
          unlock:
              isEnabled           : !AND [ !EQ [ statuses.operatorStatus, marvel_common.OperatorStatus.tech ], 
                                           !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ]
          changeOperator:
              isEnabled           : !BOOL TRUE
          verifyPassword:
              isEnabled           : !BOOL TRUE
          wakeUp:
              isEnabled           : !BOOL TRUE
          goToSleep:
              isEnabled           : !BOOL TRUE # !OR [ statuses.activityStatus.awake, statuses.healthStatus.bad ]
          point:
              isEnabled           : !OR [ parts.u1.processes.point.isEnabled,
                                          parts.u2.processes.point.isEnabled,
                                          parts.u3.processes.point.isEnabled,
                                          parts.u4.processes.point.isEnabled ]
          openDomes:
              isEnabled           : !OR [ parts.u1.parts.dome.parts.shutter.processes.open.isEnabled,
                                          parts.u2.parts.dome.parts.shutter.processes.open.isEnabled,
                                          parts.u3.parts.dome.parts.shutter.processes.open.isEnabled,
                                          parts.u4.parts.dome.parts.shutter.processes.open.isEnabled ]
          closeDomes:
              isEnabled           : !OR [ parts.u1.parts.dome.parts.shutter.processes.close.isEnabled,
                                          parts.u2.parts.dome.parts.shutter.processes.close.isEnabled,
                                          parts.u3.parts.dome.parts.shutter.processes.close.isEnabled,
                                          parts.u4.parts.dome.parts.shutter.processes.close.isEnabled ]
          stopDomes:
              isEnabled           : !OR [ parts.u1.parts.dome.parts.shutter.processes.stop.isEnabled,
                                          parts.u2.parts.dome.parts.shutter.processes.stop.isEnabled,
                                          parts.u3.parts.dome.parts.shutter.processes.stop.isEnabled,
                                          parts.u4.parts.dome.parts.shutter.processes.stop.isEnabled ]
          services:
              operatorStatus      : statuses.operatorStatus
          u1:
              number              : !UINT8 1
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
              services            : parts.services
          u2:
              number              : !UINT8 2
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
              services            : parts.services
          u3:
              number              : !UINT8 3
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
              services            : parts.services
          u4:
              number              : !UINT8 4
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
              services            : parts.services
          configManager:
             isEnabled            : !EQ [ statuses.operatorStatus, marvel_common.OperatorStatus.tech ]
          emergencyClose:
              isEnabled           : !NOT [ !AND [ !EQ [ parts.u1.parts.dome.parts.shutter.statuses.apertureStatus, marvel_common.ApertureStatus.closed ],
                                                  !EQ [ parts.u1.parts.dome.parts.shutter.statuses.apertureStatus, marvel_common.ApertureStatus.closed ] ,
                                                  !EQ [ parts.u1.parts.dome.parts.shutter.statuses.apertureStatus, marvel_common.ApertureStatus.closed ] ,
                                                  !EQ [ parts.u1.parts.dome.parts.shutter.statuses.apertureStatus, marvel_common.ApertureStatus.closed ] ] ]
          healthStatus:
              superState          : !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.shutdown ] ]
              isGood              : !MTCS_SUMMARIZE_GOOD [ parts.u1, parts.u2, parts.u3, parts.u4, parts.services ]
              hasWarning          : !MTCS_SUMMARIZE_WARN [ parts.u1, parts.u2, parts.u3, parts.u4, parts.services ]
          busyStatus:
              superState          : !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.shutdown ] ]
              isBusy              : !MTCS_SUMMARIZE_BUSY [ parts.u1, parts.u2, parts.u3, parts.u4, parts.services ]
