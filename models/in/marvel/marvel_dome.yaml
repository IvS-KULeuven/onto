##########################################################################
#                                                                        #
# Model of the dome software.                                           #
#                                                                        #
##########################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:
!IMPORT models/in/marvel/marvel_shutterplc.yaml:


##########################################################################
# Define the containing PLC library
##########################################################################

!LIBRARY marvel_dome:


  ##########################################################################
  # DomeShutterOpeningStatus
  ##########################################################################
  !STATUS DomeShutterOpeningStatus:
    variables:
        shutterValue:
            type: marvel_shutterplc.DomeShutterMotionStates
            comment: "Enum from mini PLC"
    states:
        standstill:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.STANDSTILL ]
            comment: "Standstill"
        opening:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.OPENING ]
            comment: "Opening"
        closing:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.CLOSING ]
            comment: "Closing"
        stopping:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.STOPPING ]
            comment: "Stopping"
        timeoutError:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.TIMEOUT_ERROR ]
            comment: "Timeout error"
        retryOpening:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.RETRY_OPENING ]
            comment: "Retry opening"
        retryClosing:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.RETRY_CLOSING ]
            comment: "Retry closing"
        unknownDriveLogicError:
            expr: !EQ [ shutterValue, marvel_shutterplc.DomeShutterMotionStates.UNKNOWN_DRIVE_LOGIC_ERROR ]
            comment: "Drive logic (edge based or dead-man switch) was not configured yet"



  ##########################################################################
  # DomeConfig
  ##########################################################################
  
  !CONFIG DomeConfig:
    items:
      shutter                 : { comment: "The config of the shutter mechanism" }
      rotation                : { comment: "The config of the rotation system" }
      # light                   : { comment: "The config of the light in the dome" }
      maxTrackingDistance     : { comment: "The maximum distance between telescope and dome while tracking",  type: t_double }
      trackingLoopTime        : { type: t_double, comment: "Loop time, in seconds, of the tracking." }
      knownPositions          : { comment: "The known positions of the dome" }
      knownPositionTolerance  : { type: t_double  , comment: "Tolerance (in degrees) to determine if the dome is at a known position" }
  
   
  ########################################################################################################################
  # DomeKnownPositionConfig
  ########################################################################################################################
  !CONFIG DomeKnownPositionConfig:
      items:
          name:
              type: t_string
              comment: "The name of the position (e.g. 'PARK')"
          position:
              type: t_double
              comment: "Azimuth in degrees"
  
  
  ########################################################################################################################
  # DomeKnownPositionsConfig
  ########################################################################################################################
  !CONFIG DomeKnownPositionsConfig:
      typeOf: DomeConfig.knownPositions
      items:
          position0     : { type: DomeKnownPositionConfig, comment : "Known position 0"   , expand: false }
          position1     : { type: DomeKnownPositionConfig, comment : "Known position 1"   , expand: false }
          position2     : { type: DomeKnownPositionConfig, comment : "Known position 2"   , expand: false }
          position3     : { type: DomeKnownPositionConfig, comment : "Known position 3"   , expand: false }
          position4     : { type: DomeKnownPositionConfig, comment : "Known position 4"   , expand: false }
          position5     : { type: DomeKnownPositionConfig, comment : "Known position 5"   , expand: false }
          position6     : { type: DomeKnownPositionConfig, comment : "Known position 6"   , expand: false }
          position7     : { type: DomeKnownPositionConfig, comment : "Known position 7"   , expand: false }
          position8     : { type: DomeKnownPositionConfig, comment : "Known position 8"   , expand: false }
          position9     : { type: DomeKnownPositionConfig, comment : "Known position 9"   , expand: false }
  
  
  
  ##########################################################################
  # DomeShutterConfig
  ##########################################################################
  
  !CONFIG DomeShutterConfig:
    typeOf: DomeConfig.shutter
    items:
      remotePlcAmsId           : { type: t_string                       , comment: "AMS ID of the shutter PLC" }
      remotePlcTimeoutSeconds  : { type: t_double                       , comment: "The timeout of a single ADS command."}
      simulated                : { type: t_bool,  initial: !BOOL "TRUE" , comment: "TRUE if the shutter is simulated, FALSE if not"}
      openingTimeoutSeconds    : { type: t_double                       , comment: "The opening timeout."}
      closingTimeoutSeconds    : { type: t_double                       , comment: "The closing timeout."}
      humidityLimit            : { type: t_double                       , comment: "The auto closing humidity limit in % (sent to Shutter PLC during initialization)" }
      driveLogic               : { type: marvel_shutterplc.DomeShutterDriveLogic          , comment: "The logic of the shutter motor drives (sent to Shutter PLC during initialization)" }
      heartBeatTimeout         : { type: t_int16                        , comment: "The maximum heartbeat timeout allowed in seconds (sent to Shutter PLC during initialization)" }
  
  ##########################################################################
  # DomeRotationConfig
  ##########################################################################
  
  !CONFIG DomeRotationConfig:
    typeOf: DomeConfig.rotation
    items:
      maxMovingVelocity             : { type: t_double, comment: "Maximum velocity when moving absolute or relative, in degrees per second" }
      maxMasterSlaveLag             : { type: t_double, comment: "Below this lag value (in degrees), the lag is considered not an error" }
      homePosition                  : { type: t_double, comment: "Azimuth position of the home sensor, in degrees" }
      simulated                     : { type: t_bool  , comment: "TRUE if the rotation is simulated, FALSE if not"}
  
  
  
  # ##########################################################################
  # # DomeLightConfig
  # ##########################################################################
  
  # !CONFIG DomeLightConfig:
  #   typeOf: DomeConfig.light
  #   items:
  #     timeDomeLightOn             : { type: t_double, comment: "Time to keep the light on, in seconds" }
  #     enableDomeLight             : { type: t_bool  , comment: "True for enabling the control of the light" }
  

  ########################################################################################################################
  # DomeMoveKnownPositionProcess
  ########################################################################################################################
  !PROCESS DomeMoveKnownPositionProcess:
      extends: marvel_common.BaseProcess
      arguments:
          name        : { type: t_string  , comment: "Name of the position to move to"}
  

  ########################################################################################################################
  # DomeMoveProcess
  ########################################################################################################################
  !PROCESS DomeMoveProcess:
      extends: marvel_common.BaseProcess
      arguments:
          position     : { type: t_double, comment: "New absolute or relative position value in degrees" }
  


  ########################################################################################################################
  # Dome
  ########################################################################################################################
  
  !STATEMACHINE Dome:
    references:
      operatorStatus              : { type: marvel_common.OperatorStatus        , comment: "Reference to the operator (observer/tech)"}
      activityStatus              : { type: marvel_common.ActivityStatus        , comment: "Shared activity status"}
      services                    : { type: marvel_services.Services          , comment: "Shared services", expand: false}
      config                      : { type: DomeConfig                        , comment: "Active configuration of the cover" }
      telescopeAzi                : { type: marvel_common.AngularPosition       , comment: "Azimuth target position of the telescope Axes"}
    variables_read_only:
      isTrackingTelescope         : { type: t_bool                            , comment: "True if the dome is tracking the telescope" }
      isAtKnownPosition           : { type: t_bool                            , comment: "True if the dome is at a known position" }
      actualKnownPositionName     : { type: t_string                          , comment: "Name of the known position if isAtKnownPosition is True" }
      telescopeDistance           : { type: marvel_common.AngularPosition       , comment: "Distance to the telescope azi"}
    parts:
      shutter:
        comment                   : "Shutter mechanism"
        arguments:
          initializationStatus    : { comment: "Dome initialization status (initialized/initializing/...)" }
          operatorStatus          : { comment: "marvel operator (observer/tech)" }
          operatingStatus         : { comment: "Dome operating status (manual/auto)" }
          activityStatus          : { comment: "Shared activity status"}
          config                  : { comment: "The shutter config" }
          services                : { comment: "Shared services"}
        attributes:
          statuses:
            attributes:
              healthStatus        : { type: marvel_common.HealthStatus }
              busyStatus          : { type: marvel_common.BusyStatus }
      rotation:
        comment                   : "Rotation mechanism"
        arguments:
          initializationStatus    : { comment: "Dome initialization status (initialized/initializing/...)"}
          operatorStatus          : { comment: "marvel operator (observer/tech)"}
          operatingStatus         : { comment: "Dome operating status (manual/auto)"}
          config                  : { comment: "The rotation config"}
        attributes:
          statuses:
            attributes:
              healthStatus        : { type: marvel_common.HealthStatus }
              busyStatus          : { type: marvel_common.BusyStatus }
      # light:
      #   comment                   : "Light in dome"
      #   arguments:
      #     initializationStatus    : { comment: "Dome initialization status (initialized/initializing/...)" }
      #     operatorStatus          : { comment: "marvel operator (observer/tech)" }
      #     operatingStatus         : { comment: "Dome operating status (manual/auto)" }
      #     activityStatus          : { comment: "Shared activity status"}
      #     config                  : { comment: "The light config" }
      #     isDomeLightON           : { comment: "True if the light inside the dome is ON" }
      #   attributes:
      #     statuses:
      #       attributes:
      #         healthStatus        : { type: marvel_common.HealthStatus }
      #         busyStatus          : { type: marvel_common.BusyStatus }      
      # io:
      #   comment                   : "EtherCAT devices"
      #   attributes:
      #     statuses:
      #       attributes:
      #         healthStatus        : { type: marvel_common.HealthStatus }
    statuses:
      initializationStatus        : { type: marvel_common.InitializationStatus }
      healthStatus                : { type: marvel_common.HealthStatus }
      busyStatus                  : { type: marvel_common.BusyStatus }
      operatingStatus             : { type: marvel_common.OperatingStatus }
    processes:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
      changeOperatingState        : { type: marvel_common.ChangeOperatingStateProcess , comment: "Change the operating state (e.g. AUTO, MANUAL, ...)" }
      lock                        : { type: marvel_common.Process                     , comment: "Lock the cover" }
      unlock                      : { type: marvel_common.Process                     , comment: "Unlock the cover" }
      reset                       : { type: marvel_common.Process                     , comment: "Reset any errors" }
      syncWithAxes                : { type: marvel_common.Process                     , comment: "Synchronize the dome once with the axes" }
      startTrackingTelescope      : { type: marvel_common.Process                     , comment: "Start tracking the telescope azimuth" }
      stopTrackingTelescope       : { type: marvel_common.Process                     , comment: "Stop tracking the telescope" }
      moveAbsolute                : { type: DomeMoveProcess                         , comment: "Move absolute" }
      stop                        : { type: marvel_common.Process                     , comment: "Stop the rotation movement and/or tracking" }
      moveKnownPosition           : { type: DomeMoveKnownPositionProcess            , comment: "Move the dome to the given known position" }
    calls:
      # processes
      initialize:
        isEnabled                 : !AND [ !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ],
                                           !OR [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.shutdown ],
                                                 !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initializingFailed ],
                                                 !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ] ] ]
      lock:
        isEnabled                 : !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ]
      unlock:
        isEnabled                 : !AND [ !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ],
                                           !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ]
      changeOperatingState:
        isEnabled                 : !BOOL FALSE # we currently don't use AUTO/MANUAL
      reset:
        isEnabled                 : !AND [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ],
                                           !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ] ]
      stop:
        isEnabled                 : !OR [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.busy ], isTrackingTelescope,  !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ] ]
      moveAbsolute:
        isEnabled                 : !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ]
      startTrackingTelescope:
        isEnabled                 : !NOT [isTrackingTelescope]
      stopTrackingTelescope:
        isEnabled                 : isTrackingTelescope
      moveKnownPosition:
          isEnabled               : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                           !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ] ]
      syncWithAxes:
          isEnabled               : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                           !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ] ]
      # parts
      shutter:
        initializationStatus      : statuses.initializationStatus
        operatorStatus            : operatorStatus
        operatingStatus           : statuses.operatingStatus
        activityStatus            : activityStatus
        config                    : config.shutter
        services                  : services
      rotation:
        initializationStatus      : statuses.initializationStatus
        operatorStatus            : operatorStatus
        operatingStatus           : statuses.operatingStatus
        config                    : config.rotation
      # light:
      #   initializationStatus      : statuses.initializationStatus
      #   operatorStatus            : operatorStatus
      #   operatingStatus           : statuses.operatingStatus
      #   activityStatus            : activityStatus
      #   config                    : config.light
      # statuses
      operatingStatus:
        superState                : !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ]
      healthStatus:
        superState                : !BOOL True
        isGood                    : !MTCS_SUMMARIZE_GOOD [ parts.shutter,
                                                           parts.rotation,
                                                           # parts.light,
                                                           # parts.io 
                                                           processes.reset,
                                                           processes.initialize,
                                                           processes.syncWithAxes,
                                                           processes.startTrackingTelescope,
                                                           processes.stopTrackingTelescope,
                                                           processes.stop,
                                                           processes.moveKnownPosition ]
  
        hasWarning                : !MTCS_SUMMARIZE_WARN [ parts.shutter,
                                                           parts.rotation,
                                                           # parts.light,
                                                           # parts.io
                                                           processes.reset,
                                                           processes.initialize,
                                                           processes.syncWithAxes,
                                                           processes.startTrackingTelescope,
                                                           processes.stopTrackingTelescope,
                                                           processes.stop,
                                                           processes.moveKnownPosition ]
      busyStatus:
        superState                : !BOOL TRUE
        isBusy                    : !MTCS_SUMMARIZE_BUSY [ parts.shutter,
                                                           parts.rotation,
                                                           processes.reset,
                                                           processes.initialize,
                                                           processes.syncWithAxes,
                                                           processes.startTrackingTelescope,
                                                           processes.stopTrackingTelescope,
                                                           processes.stop,
                                                           processes.moveKnownPosition ]
  

  ########################################################################################################################
  # DomeShutterSendProcess
  ########################################################################################################################
  !PROCESS DomeShutterSendProcess:
      extends: marvel_common.BaseProcess
      arguments:
          command     : { type: marvel_shutterplc.DomeShutterCommands , comment: "Command to send" }
          arg         : { type: t_int16                               , comment: "The int16 argument belonging to the command (optional)" }
  

  
  ########################################################################################################################
  # DomeShutter
  ########################################################################################################################
  
  !STATEMACHINE DomeShutter:
    typeOf: DomeParts.shutter
    variables_read_only:
      isSimulated             : { type: t_bool                            , comment: "True if the shutter is being simulated" }
      isConnected             : { type: t_bool                            , comment: "True if the shutter PLC is connected" }
    variables:
      # ADS 
      dataRead                : { type: marvel_shutterplc.DomeShutterDataRead,  comment: "The data read from the shutter PLC via Bluetooth" }
      dataWrite               : { type: marvel_shutterplc.DomeShutterDataWrite, comment: "The data written to the shutter PLC via Bluetooth" }
      # ADS read
      adsReadError            : { type: t_bool                            , comment: "True if the ADS Read communication to the shutter PLC is in error" }
      adsReadErrorId          : { type: t_uint32                          , comment: "The error id if adsReadError is true" }
      # ADS write
      adsWriteError            : { type: t_bool                            , comment: "True if the ADS Read communication to the shutter PLC is in error" }
      adsWriteErrorId          : { type: t_uint32                          , comment: "The error id if adsReadError is true" }
      # temperature sensor
      temperature              : { type: marvel_common.Temperature           , comment: "The measured temperature" }
      temperatureHealthStatus  : { type: marvel_common.HealthStatus          , comment: "The temperature sensor health" }
      temperatureActualStatus  : { type: t_string                          , comment: "The temperature sensor status as a string" }
      # humidity sensor
      humidity                 : { type: marvel_common.Fraction              , comment: "The measured humidity" }
      humidityHealthStatus     : { type: marvel_common.HealthStatus          , comment: "The humidity sensor health" }
      humidityActualStatus     : { type: t_string                          , comment: "The humidity sensor status as a string" }
      humidityLimit            : { type: marvel_common.Fraction              , comment: "The humidity limit" }
    references:
      initializationStatus    : { type: marvel_common.InitializationStatus    , comment: "Dome initialization status (initialized/initializing/...)"}
      operatorStatus          : { type: marvel_common.OperatorStatus          , comment: "marvel operator (observer/tech)"}
      operatingStatus         : { type: marvel_common.OperatingStatus         , comment: "Dome operating status (manual/auto)"}
      activityStatus          : { type: marvel_common.ActivityStatus          , comment: "Shared activity status"}
      config                  : { type: DomeShutterConfig                   , comment: "The shutter config"}
      services                : { type: marvel_services.Services            , comment: "Shared services", expand: false}
    statuses:
      apertureStatus          : { type: marvel_common.ApertureStatus          , comment: "Combined aperture status (i.e. of both panels)" }
      motionStatus            : { type: DomeShutterOpeningStatus            , comment: "Motion status" }
      healthStatus            : { type: marvel_common.HealthStatus            , comment: "Health status" }
      busyStatus              : { type: marvel_common.BusyStatus              , comment: "Busy status"  }
    processes:
      open                    : { type: marvel_common.Process                 , comment: "Open both panels" }
      close                   : { type: marvel_common.Process                 , comment: "Close both panels" }
      stop                    : { type: marvel_common.Process                 , comment: "Stop the panels" }
      send                    : { type: DomeShutterSendProcess              , comment: "Send a raw command" }
    calls:
      # processes
      stop:
        isEnabled             : !EQ [ statuses.busyStatus, marvel_common.BusyStatus.busy ]
      open:
        isEnabled             : !AND [ !EQ [statuses.healthStatus, marvel_common.HealthStatus.good], 
                                       !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ], 
                                       !OR [ !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ], 
                                             !AND [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ], 
                                                    !EQ [ initializationStatus, marvel_common.InitializationStatus.initialized ], 
                                                    !OR [ !EQ [ activityStatus, marvel_common.ActivityStatus.awake ], 
                                                          !EQ [ activityStatus, marvel_common.ActivityStatus.moving ] ] ] ] ]
      close:
        isEnabled             : !OR [ !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ],
                                      !AND [ !NOT [ !EQ [ initializationStatus, marvel_common.InitializationStatus.locked ] ], 
                                             !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ], 
                                             !EQ [ initializationStatus, marvel_common.InitializationStatus.initialized ] ] ]
      send:
        isEnabled             : !OR [ !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ], isConnected ]
      # statuses
      apertureStatus:
        superState            : !NOT [ !OR [ !EQ [ dataRead.apertureState, marvel_shutterplc.DomeShutterApertureStates.UNKNOWN ], 
                                             !EQ [ dataRead.apertureState, marvel_shutterplc.DomeShutterApertureStates.INVALID ] ] ]
        isOpen                : !EQ [ dataRead.apertureState, marvel_shutterplc.DomeShutterApertureStates.FULLY_OPEN ]
        isClosed              : !EQ [ dataRead.apertureState, marvel_shutterplc.DomeShutterApertureStates.FULLY_CLOSED ]
      motionStatus:
        superState            : !BOOL TRUE
        shutterValue          : dataRead.motionState
      healthStatus:
        superState            : !NOT [ statuses.initializationStatus.shutdown ]
        isGood                : !AND [ 
                                      isConnected,
                                      !MTCS_SUMMARIZE_GOOD [ processes.open,
                                                             processes.close,
                                                             processes.stop] ]
        hasWarning            : !OR [ 
                                      !MTCS_SUMMARIZE_WARN [ processes.open,
                                                             processes.close,
                                                             processes.stop ],
                                      !AND [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ], statuses.apertureStatus.partiallyOpen ]
                                      #,
                                      #!NOT [ automaticOperation ] 
                                      ]
      busyStatus:
        superState            : !NOT [ statuses.initializationStatus.shutdown ]
        isBusy                : !MTCS_SUMMARIZE_BUSY [ processes.open,
                                                       processes.close,
                                                       processes.stop ]

  ########################################################################################################################
  # DomeRotation
  ########################################################################################################################
  
  !STATEMACHINE DomeRotation:
    typeOf: DomeParts.rotation
    variables_read_only:
      isSimulated                 : { type: t_bool                              , comment: "True if the rotation is being simulated" }
      targetPos                   : { type: marvel_common.AngularPosition         , comment: "Target azimuth"}
      targetDistance              : { type: marvel_common.AngularPosition         , comment: "Distance to the setpoint"}
      actPos                      : { type: marvel_common.AngularPosition         , comment: "The actual position (same as parts.masterAxis!)", expand: false }
      actVelo                     : { type: marvel_common.AngularVelocity         , comment: "The actual velocity (same as parts.masterAxis!)", expand: false }
    references:
      initializationStatus        : { type: marvel_common.InitializationStatus    , comment: "Reference to the marvel initialization status"}
      operatorStatus              : { type: marvel_common.OperatorStatus          , comment: "Reference to the marvel operator status"}
      operatingStatus             : { type: marvel_common.OperatingStatus         , comment: "Reference to the Dome operating status"}
      config                      : { type: DomeRotationConfig                  , comment: "Reference to the rotation config"}
    parts:
      motorAxis                   : { type: marvel_common.AngularAxis             , comment: "Motor axis" }
      encoderAxis                 : { type: marvel_common.AngularAxis             , comment: "Encoder axis" }
    statuses:
      healthStatus                : { type: marvel_common.HealthStatus            , comment: "Health status"}
      busyStatus                  : { type: marvel_common.BusyStatus              , comment: "Busy status" }
    processes:
      reset                       : { type: marvel_common.Process                 , comment: "Reset errors" }
      stop                        : { type: marvel_common.Process                 , comment: "Stop the rotation" }
      moveAbsolute                : { type: DomeMoveProcess                     , comment: "Move absolute" }
    calls:
      reset:
        isEnabled                 : !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ]
      stop:
        isEnabled                 : !OR [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.busy ], !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ] ]
      moveAbsolute:
        isEnabled                 : !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle ]
      # parts
      motorAxis:
        isEnabled                 : !AND [ !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ], !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ] ]
      encoderAxis:
        isEnabled                 : !AND [ !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ], !EQ [ operatorStatus, marvel_common.OperatorStatus.tech ] ]
      # statuses
      healthStatus:
        superState                : !BOOL TRUE
        isGood                    : !MTCS_SUMMARIZE_GOOD [ parts.motorAxis,
                                                           parts.encoderAxis,
                                                           processes.moveAbsolute,
                                                           processes.reset,
                                                           processes.stop
                                                         ]
        hasWarning            : !MTCS_SUMMARIZE_WARN [ parts.motorAxis,
                                                       parts.encoderAxis,
                                                       processes.moveAbsolute,
                                                       processes.reset,
                                                       processes.stop ]
      busyStatus:
        superState            : !BOOL TRUE
        isBusy                : !MTCS_SUMMARIZE_BUSY [ parts.motorAxis,
                                                       parts.encoderAxis,
                                                       processes.moveAbsolute,
                                                       processes.reset,
                                                       processes.stop ]
  
  
  
