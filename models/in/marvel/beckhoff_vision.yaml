!LIBRARY beckhoff_vision:

  ########################################################################################################################
  # ETcVnCameraState
  ########################################################################################################################
  !ENUMERATION ETcVnCameraState:
    items:
        - TCVN_CS_ERROR
        - TCVN_CS_INITIAL
        - TCVN_CS_INITIALIZING
        - TCVN_CS_INITIALIZED
        - TCVN_CS_OPENING
        - TCVN_CS_OPENED
        - TCVN_CS_STARTACQUISITION
        - TCVN_CS_ACQUIRING
        - TCVN_CS_STOPACQUISITION
        - TCVN_CS_RESETTINGFEATURES
        - TCVN_CS_TRIGGERING
        - TCVN_CS_CLOSING