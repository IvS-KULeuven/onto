########################################################################################################################
#                                                                                                                      #
# Model containing the upper-level software design of the Marvel TCS.                                                  #
#                                                                                                                      #
########################################################################################################################


!IMPORT models/in/marvel/marvel_unit.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel:


#   ########################################################################################################################
#   # MTCSConfig
#   ########################################################################################################################
#   !CONFIG MTCSConfig:
#       items:


  ########################################################################################################################
  # MarvelPointProcess
  ########################################################################################################################
  !PROCESS MarvelPointProcess:
      extends: mtcs_common.BaseProcess
      arguments:
          alpha               : { type: t_double                            , comment: "Right ascention, in hours" }
          delta               : { type: t_double                            , comment: "Declination, in degrees" }
          u1                  : { type: t_bool                              , comment: "True to point Unit 1" }
          u2                  : { type: t_bool                              , comment: "True to point Unit 2" }
          u3                  : { type: t_bool                              , comment: "True to point Unit 3" }
          u4                  : { type: t_bool                              , comment: "True to point Unit 4" }
  

  ########################################################################################################################
  # Marvel
  ########################################################################################################################
  !STATEMACHINE Marvel:
      # variables:
          # editableConfig              : { type: MTCSConfig                  , comment: "Editable configuration of the MTCS" , expand: false }
          # remoteOperationEnable       : { type: t_bool                      , comment: "True to Remote operation enabled" }
          # mocsObservationStatus       : { type: t_bool                      , comment: "True to notify that there is an observation running" }
          # remoteConnectionStatus      : { type: t_bool                      , comment: "True to notify that there is a remote connection" }
          # remoteconnectionPortStatus  : { type: t_bool                      , comment: "True to notify that there is a connection port established" }
          
      variables_read_only:
          noOfFailedOperatorChanges   : { type: t_uint16                    , comment: "How many times has a wrong password been entered?"}
      #    config                      : { type: MTCSConfig                  , comment: "Active configuration of the ServicesTiming subsystem" }
      parts:
          u1:
              type : marvel_unit.Unit
              comment: "Unit 1"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: mtcs_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: mtcs_common.ActivityStatus          , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: mtcs_common.ApertureStatus }
                  statuses:
                      attributes:
                          healthStatus    : { type: mtcs_common.HealthStatus }
                          busyStatus      : { type: mtcs_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u2:
              type : marvel_unit.Unit
              comment: "Unit 2"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: mtcs_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: mtcs_common.ActivityStatus          , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: mtcs_common.ApertureStatus }
                  statuses:
                      attributes:
                          healthStatus    : { type: mtcs_common.HealthStatus }
                          busyStatus      : { type: mtcs_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u3:
              type : marvel_unit.Unit
              comment: "Unit 3"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: mtcs_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: mtcs_common.ActivityStatus          , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: mtcs_common.ApertureStatus }
                  statuses:
                      attributes:
                          healthStatus    : { type: mtcs_common.HealthStatus }
                          busyStatus      : { type: mtcs_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u4:
              type : marvel_unit.Unit
              comment: "Unit 4"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operatorStatus          : { type: mtcs_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: mtcs_common.ActivityStatus          , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        statuses:
                                            attributes:
                                                apertureStatus: { type: mtcs_common.ApertureStatus }
                  statuses:
                      attributes:
                          healthStatus    : { type: mtcs_common.HealthStatus }
                          busyStatus      : { type: mtcs_common.BusyStatus }
                  processes:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
        #   configManager:
        #       comment                     : "The config manager (to load/save/activate configuration data)"
        #       type                        : mtcs_common.ConfigManager
      statuses:
          initializationStatus        : { type: mtcs_common.InitializationStatus }
          healthStatus                : { type: mtcs_common.HealthStatus }
          busyStatus                  : { type: mtcs_common.BusyStatus }
          operatorStatus              : { type: mtcs_common.OperatorStatus }
          passwordHealthStatus        : { type: mtcs_common.HealthStatus }
          activityStatus              : { type: mtcs_common.ActivityStatus }
      processes:
          initialize                  : { type: mtcs_common.Process                         , comment: "Start initializing the whole MTCS" }      
          lock                        : { type: mtcs_common.Process                         , comment: "Lock the whole MTCS" }
          unlock                      : { type: mtcs_common.Process                         , comment: "Unlock the whole MTCS" }
          changeOperator              : { type: mtcs_common.ChangeOperatorStateProcess      , comment: "Change the operator (e.g. OBSERVER, TECH, ...)" }
          verifyPassword              : { type: mtcs_common.ChangeOperatorStateProcess      , comment: "Only verify the operator password" }
          wakeUp                      : { type: mtcs_common.Process                         , comment: "Wake up the whole Marvel TCS" }
          goToSleep                   : { type: mtcs_common.Process                         , comment: "Let the whole Marvel TCS go to sleep" }
          emergencyClose              : { type: mtcs_common.Process                         , comment: "Close all domes asap" }
          point                       : { type: MarvelPointProcess                          , comment: "Point multiple units at once"}
      calls:
          initialize:
              isEnabled           : !NOT [ statuses.initializationStatus.initializing ]
          lock:
              isEnabled           : !AND [ statuses.operatorStatus.tech, statuses.initializationStatus.initialized ]
          unlock:
              isEnabled           : !AND [ statuses.operatorStatus.tech, statuses.initializationStatus.locked ]
          changeOperator:
              isEnabled           : !BOOL TRUE
          verifyPassword:
              isEnabled           : !BOOL TRUE
          wakeUp:
              isEnabled           : !BOOL TRUE
          goToSleep:
              isEnabled           : !BOOL TRUE # !OR [ statuses.activityStatus.awake, statuses.healthStatus.bad ]
          point:
              isEnabled           : !OR [ parts.u1.processes.point.isEnabled,
                                          parts.u2.processes.point.isEnabled,
                                          parts.u3.processes.point.isEnabled,
                                          parts.u4.processes.point.isEnabled ]
          u1:
              number              : !UINT8 1
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
          u2:
              number              : !UINT8 2
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
          u3:
              number              : !UINT8 3
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
          u4:
              number              : !UINT8 4
              operatorStatus      : statuses.operatorStatus
              activityStatus      : statuses.activityStatus
          configManager:
             isEnabled            : statuses.operatorStatus.tech
          emergencyClose:
              isEnabled           : !NOT [ !AND [ parts.u1.parts.dome.parts.shutter.statuses.apertureStatus.closed ,
                                                  parts.u1.parts.dome.parts.shutter.statuses.apertureStatus.closed ,
                                                  parts.u1.parts.dome.parts.shutter.statuses.apertureStatus.closed ,
                                                  parts.u1.parts.dome.parts.shutter.statuses.apertureStatus.closed ] ]
          healthStatus:
              superState          : !NOT [ statuses.initializationStatus.shutdown ]
              isGood              : !MTCS_SUMMARIZE_GOOD [ parts.u1, parts.u2, parts.u3, parts.u4 ]
              hasWarning          : !MTCS_SUMMARIZE_WARN [ parts.u1, parts.u2, parts.u3, parts.u4 ]
          busyStatus:
              superState          : !NOT [ statuses.initializationStatus.shutdown ]
              isBusy              : !MTCS_SUMMARIZE_BUSY [ parts.u1, parts.u2, parts.u3, parts.u4 ]
          passwordHealthStatus:
              superState          : statuses.operatorStatus.observer