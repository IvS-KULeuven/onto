      htTopSE:       { type: HeaterControl, comment: "Heater control for shield top SE",     arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig }, operator_ref: { type: marvel_common.OperatorStatus } } }
      htTopSW:       { type: HeaterControl, comment: "Heater control for shield top SW",     arguments: { config_ref: { type: HeaterConfig }, sharedConfig_ref: { type: SharedHeaterConfig }, operator_ref: { type: marvel_common.OperatorStatus } } }
