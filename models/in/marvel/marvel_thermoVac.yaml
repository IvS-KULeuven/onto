        htSideSE:      { config_ref: config_ref.htSideSE, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htSideNW:      { config_ref: config_ref.htSideNW, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htSideSW:      { config_ref: config_ref.htSideSW, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htBotNE:       { config_ref: config_ref.htBotNE, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htBotNW:       { config_ref: config_ref.htBotNW, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
