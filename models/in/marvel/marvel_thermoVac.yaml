              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.cryo
              sharedConfig_ref    : config_ref.shared


  ############################
  ### state machine vacuum ###
  ############################
  !STATEMACHINE VacControl:
    references:
        config_ref              : { type: VacConfig, comment: "active configuration of the thermo control system"}
        activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
        services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
        operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }



  ### MAIN STATEMACHINE #################################### 

  ###############################
  ### state machine thermovac ###
  ###############################
  !STATEMACHINE ThermoVacControl:

      variables_input_rw:
        editableConfig            : { type: ThermoVacConfig                          , comment: "Editable configuration of the thermo vac system" , expand: false }

      variables_output:
        config            : { type: ThermoVacConfig                          , comment: "active configuration of the thermo vac system" }

      references:
        activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
        services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
        operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }

      stat:
        health          : { type: marvel_common.HealthStatus         , comment: "Is the vessel healthy?" }

      parts:
        thermo:
          type: ThermoControl
          expand: false
          comment: "statemachine of the thermal control system" 
          arguments:
            activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
            services_ref              : { type: marvel_services.Services              , expand: false }
            operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
            config_ref                : { type: ThermoConfig                           , expand: false }

        vac:
          type: VacControl
          expand: false
          comment: "statemachine of the vac control system"
          arguments:
            activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
            services_ref              : { type: marvel_services.Services              , expand: false }
            operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
            config_ref                : { type: VacConfig                           , expand: false }
        

        configManager:
          comment                     : "The config manager (to load/save/activate configuration data)"
          type                        : marvel_common.ConfigManager
        

      calls:
        thermo:
          activity_ref        : activity_ref
          services_ref        : services_ref
          operator_ref        : operator_ref
          config_ref          : config.thermo
        
        vac:
          activity_ref        : activity_ref
          services_ref        : services_ref
          operator_ref        : operator_ref
          config_ref          : config.vac     


        configManager:
          isEnabled            : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]  

