!LIBRARY marvel_common:
  

  ########################################################################################################################
  # PointAlphaDeltaProcess
  ########################################################################################################################
  !PROCESS PointAlphaDeltaProcess:
      extends: mtcs_common.BaseProcess
      arguments:
          alpha               : { type: t_double                            , comment: "Right ascention, in hours" }
          delta               : { type: t_double                            , comment: "Declination, in degrees" }
  