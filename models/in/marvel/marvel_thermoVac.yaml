        tSideS:       { config_ref: config_ref.tSideS, sharedConfig_ref: config_ref.shared.sensors }
        tSideNE:      { config_ref: config_ref.tSideNE, sharedConfig_ref: config_ref.shared.sensors }
        tSideSE:      { config_ref: config_ref.tSideSE, sharedConfig_ref: config_ref.shared.sensors }
