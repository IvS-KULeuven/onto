########################################################################################################################
#                                                                                                                      #
# Model of the Telescope software.                                                                                     #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_guiding:
  
  
  ########################################################################################################################
  # GuidingConfig
  ########################################################################################################################
  !CONFIG GuidingConfig:
      items:
          initExposureTime:
              type: t_double
              comment: "Initial exposure time (in seconds)"
          initAcquisitionFrameRate:
              type: t_double
              comment: "Initial acquisition frame rate"
          initGainDigital:
              type: t_double
              comment: "Initial digital gain"
          initGainAnalog:
              type: t_double
              comment: "Initial analog gain"
          initBinning:
              type: t_uint32
              comment: "Initial analog gain"
  
  ########################################################################################################################
  # GuidingAcquireTargetProcess
  ########################################################################################################################
  !PROCESS GuidingAcquireTargetProcess:
    extends: marvel_common.BaseProcess
    arguments:
        vMag     : { type: t_double, comment: "Visual magnitude of target" }
  

  ########################################################################################################################
  # GuidingStartGuiding
  ########################################################################################################################
  !PROCESS GuidingStartGuidingProcess:
    extends: marvel_common.BaseProcess
    arguments:
        vMag     : { type: t_double, comment: "Visual magnitude of target" }


  ########################################################################################################################
  # GuidingStates
  ########################################################################################################################
  !ENUMERATION GuidingStates:
    items:
        - IDLE
        - ACQUISITION
        - GUIDING

  ########################################################################################################################
  # GuidingCameraParamSets
  ########################################################################################################################
  !ENUMERATION GuidingCameraParamSets:
    items:
        - INIT
        - CONTINUOUS_IMAGING
        - TRIGGER_IMAGING

  ########################################################################################################################
  # GigECameraSetParamSetProcess
  ########################################################################################################################
  !PROCESS GuidingCameraParamSetProcess:
      extends: marvel_common.BaseProcess
      arguments:
          paramSet      : { type: GuidingCameraParamSets           , comment: "Parameter set"}
  

  ########################################################################################################################
  # Guiding
  ########################################################################################################################
  
  !STATEMACHINE Guiding:
      references:
          number                          : { type: t_uint8                                   , comment: "Number of the unit (1-4)" }
          operator_ref                    : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }
          activity_ref                    : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
          services_ref                    : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
          camera_ref                      : { type: marvel_common.GigECamera                  , comment: "Shared camera instance"}
          config_ref                      : { type: GuidingConfig                             , comment: "Active configuration of the guiding" }
      variables_output:
          state                           : { type: GuidingStates                             , comment: "Actual guiding state" }
          centroidXAbsCoo                 : { type: t_double                                  , comment: "Centroid X absolute coordinate" }
          centroidYAbsCoo                 : { type: t_double                                  , comment: "Centroid Y absolute coordinate" }
          centroidXRelCoo                 : { type: t_double                                  , comment: "Centroid X relative coordinate" }
          centroidYRelCoo                 : { type: t_double                                  , comment: "Centroid Y relative coordinate" }
      stat:
          init                            : { type: marvel_common.InitializationStatus }
          health                          : { type: marvel_common.HealthStatus }
          busy                            : { type: marvel_common.BusyStatus }
      proc:
          initialize                      : { type: marvel_common.Process                         , comment: "Start initializing" }
          reset                           : { type: marvel_common.Process                         , comment: "Reset any errors" }
          acquireTarget                   : { type: GuidingAcquireTargetProcess                   , comment: "Acquire the target"}
          startGuiding                    : { type: GuidingStartGuidingProcess                    , comment: "Start guiding"}
          stop                            : { type: marvel_common.Process                         , comment: "Stop guiding and acquisition" }
          setCameraParamSet               : { type: GuidingCameraParamSetProcess                  , comment: "Set a parameter set" }
      calls:
          initialize:
              isEnabled                   : !AND [ !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ],
                                                   !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                                         !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                                         !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ] ]
          reset:
              isEnabled                   : !BOOL TRUE
          startAcquisition:
              isEnabled                   : !BOOL TRUE
          acquireTarget:
              isEnabled                   : !BOOL TRUE
          stop:
              isEnabled                   : !BOOL TRUE
          setCameraParamSet:
              isEnabled                   : !BOOL TRUE
          # stat
          health:
              superState                  : !BOOL TRUE
              isGood                      : !EQ [ camera_ref.stat.health, marvel_common.HealthStatus.good ]
              hasWarning                  : !EQ [ camera_ref.stat.health, marvel_common.HealthStatus.warning ]
          busy:
              superState                  : !BOOL TRUE
              isBusy                      : !EQ [ camera_ref.stat.busy, marvel_common.BusyStatus.busy ]
  
  