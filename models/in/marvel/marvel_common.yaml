  ########################################################################################################################
  # BaseProcess
  ########################################################################################################################
  !STATEMACHINE BaseProcess:
    variables_hidden:
        isEnabled           : { type: t_bool, comment: "Should the trigger be enabled?" }
    stat:
        enabled             : { type: EnabledStatus    , comment: "Is the process enabled or not?" }
        busy                : { type: BusyStatus       , comment: "Is the process busy or not?" }
        health              : { type: HealthStatus     , comment: "Is the process in a healthy state or not?" }
        started             : { type: StartedStatus    , comment: "Is the process started or not?" }
    local_rw:
        do_request          : { type: t_bool           , comment: "Write TRUE to request the start of the process" }
    local:
        do_request_result   : { type: RequestResults   , comment: "Result of the request" }
    calls:
        enabled:
            superState  : !BOOL TRUE
            isEnabled   : isEnabled


  ########################################################################################################################
  # BaseMcProcess
  ########################################################################################################################
  !STATEMACHINE BaseMcProcess:
    extends: BaseProcess
    variables_input:
        errorId: { type: t_uint32, comment: "Error ID according to Beckhoff/PlcOpen Motion Control" }


  ########################################################################################################################
  # ProcessStep
  ########################################################################################################################
  !STATEMACHINE ProcessStep:
    variables_hidden:
        isEnabled       : { type: t_bool        , comment: "Is the step enabled?" }
    references:
        process         : { type: BaseProcess   , comment: "The process corresponding to the step", expand: false }
    stat:
        enabled         : { type: EnabledStatus , comment: "Is the process step enabled or not?"  }
    calls:
        enabled:
            superState  : !BOOL TRUE
            isEnabled   : isEnabled


  ########################################################################################################################
  # BaseXmlIOProcess
  ########################################################################################################################
  !STATEMACHINE BaseXmlDataSrvProcess:
    extends: BaseProcess
    variables_input:
        errorId: { type: t_uint32, comment: "Error ID according to Beckhoff XML Data Server library" }

  ########################################################################################################################
  # Process
  ########################################################################################################################
  !PROCESS Process: # default process
    extends: BaseProcess

  ########################################################################################################################
  # IdProcess
  ########################################################################################################################
  !PROCESS IdProcess:
    extends: BaseProcess
    arguments:
        id: { type: t_string }

  ########################################################################################################################
  # McProcess
  ########################################################################################################################
  !PROCESS McProcess:
    extends: BaseMcProcess


  ########################################################################################################################
  # ChangeSetpointProcess
  ########################################################################################################################
  !PROCESS ChangeSetpointProcess:
    extends: BaseProcess
    arguments:
        setpoint     : { type: t_double, comment: "New setpoint value" }

  ########################################################################################################################
  # ChangeParameterProcess
  ########################################################################################################################
  !PROCESS ChangeParameterProcess:
    extends: BaseProcess
    arguments:
        parameter     : { type: t_double, comment: "New parameter value" }


  ########################################################################################################################
  # McMoveAbsoluteProcess
  ########################################################################################################################
  !PROCESS McMoveAbsoluteProcess:
    extends: BaseMcProcess
    arguments:
        position    : { type: t_double, comment: "New position setpoint" }
        maxVelocity : { type: t_double, comment: "Maximum velocity" }

  ########################################################################################################################
  # McMoveRelativeProcess
  ########################################################################################################################
  !PROCESS McMoveRelativeProcess:
    extends: BaseMcProcess
    arguments:
        distance    : { type: t_double, comment: "Distance to move" }
        maxVelocity : { type: t_double, comment: "Maximum velocity" }

  ########################################################################################################################
  # McPowerProcess
  ########################################################################################################################
  !PROCESS McPowerProcess:
    extends: BaseMcProcess
    arguments:
        enable    : { type: t_bool, comment: "Enable the power or not" }

  ########################################################################################################################
  # McSetPositionProcess
  ########################################################################################################################
  !PROCESS McSetPositionProcess:
    extends: BaseMcProcess
    arguments:
        value   : { type: t_double, comment: "New position to be taken over by the encoder" }

  ########################################################################################################################
  # McStopProcess
  ########################################################################################################################
  !PROCESS McStopProcess:
    extends: BaseMcProcess
    arguments:
        deceleration    : { type: t_double, comment: "Deceleration (use 0 for default). If non zero, then also jerk must be non zero!" }
        jerk            : { type: t_double, comment: "Jerk (use 0 for default). If non zero, then also deceleration must be non zero!" }

  ########################################################################################################################
  # McMoveVelocityProcess
  ########################################################################################################################
  !PROCESS McMoveVelocityProcess:
    extends: BaseMcProcess
    arguments:
        value   : { type: t_double, comment: "New velocity" }

  ########################################################################################################################
  # SwitchProcess
  ########################################################################################################################
  !PROCESS SetEnabledProcess:
    extends: BaseProcess
    arguments:
        enabled : { type: t_bool, comment: "True to enable, false to disable" }

  ########################################################################################################################
  # McWriteParameter
  ########################################################################################################################
  !PROCESS McWriteParameter:
    extends: BaseMcProcess
    arguments:
        parameterNumber : { type: t_int16   , comment: "Number of the parameter" }
        value           : { type: t_double  , comment: "Value to write"}


  ########################################################################################################################
  # McReadParameter
  ########################################################################################################################
  !PROCESS McReadParameter:
    extends: BaseMcProcess
    arguments:
        parameterNumber : { type: t_int16   , comment: "Number of the parameter" }
    variables_input:
        value           : { type: t_double  , comment: "Value that was read"}

  ########################################################################################################################
  # McWriteBoolParameter
  ########################################################################################################################
  !PROCESS McWriteBoolParameter:
    extends: BaseMcProcess
    arguments:
        parameterNumber : { type: t_int16   , comment: "Number of the parameter" }
        value           : { type: t_bool    , comment: "Value to write"}


  ########################################################################################################################
  # McReadParameter
  ########################################################################################################################
  !PROCESS McReadBoolParameter:
    extends: BaseMcProcess
    arguments:
        parameterNumber : { type: t_int16   , comment: "Number of the parameter" }
    variables_input:
        value           : { type: t_bool  , comment: "Value that was read"}
        
        
  ########################################################################################################################
  # McStartProbing
  ########################################################################################################################
  !PROCESS McProbe:
    extends: BaseMcProcess
    arguments:
        risingEdge       : { type: t_bool    , comment: "True to probe the rising edge, false to probe the falling edge" }
        timeout          : { type: t_double  , comment: "Timeout, in seconds. After this timeout, probing is aborted. timeout <= 0 means endless probing." }
    variables_input:
        recordedPosition : { type: t_double  , comment: "Value that was probed"}


#   ########################################################################################################################
#   # HomingTypes
#   ########################################################################################################################
#   !ENUMERATION HomingTypes:
#     items:
#         - homingSwitch
#         - homingSwitchIsNegLimitSwitch


  ########################################################################################################################
  # BaseAxis
  ########################################################################################################################
  !STATEMACHINE BaseAxis:
    variables_hidden:
        isEnabled           : { type: t_bool                        , comment: "Is control enabled?" }
        standstillTolerance : { type: t_double                      , comment: "Tolerance in [main units] per second: if < ABS(this value), then the axis is considered to be standing still" }
        _axis_ref           : { type: Tc2_MC2.AXIS_REF, isRef: TRUE , comment: "The AXIS_REF to be linked to the NC I/O" }
        usePosLimitSwitch   : { type: t_bool , initial: !BOOL FALSE , comment: "TRUE to use a hardware forward limit switch" }
        useNegLimitSwitch   : { type: t_bool , initial: !BOOL FALSE , comment: "TRUE to use a hardware reverse limit switch" }
        # homingType          : { type: HomingTypes                   , comment: "Type of homing (e.g. using homing switch, using limit switch, ...)" }
        posLimitSwitchSig   : { type: t_bool, address: "%I*"        , comment: "Limit switch raw signal in forward direction (e.g. at +105 mm for a stage of 100 mm travel range" }
        negLimitSwitchSig   : { type: t_bool, address: "%I*"        , comment: "Limit switch raw signal in negative direction (e.g. at or a little bit below 0 mm)" }
        # homingSwitch        : { type: t_bool, address: "%I*"        , comment: "Homing switch" }
        invertPosLimitSwitch: { type: t_bool                        , comment: "Invert positive limit switch raw signal" }
        invertNegLimitSwitch: { type: t_bool                        , comment: "Invert positive limit switch raw signal" }
        # invertHomingSwitch:   { type: t_bool                        , comment: "Invert positive limit switch" }
    variables_input:
        isGearingSupported  : { type: t_bool , initial: !BOOL FALSE , comment: "Is gearIn/gearOut supported?" }
        axis_ref            : { type: Tc2_MC2.AXIS_REF              , comment: "The AXIS_REF to be linked to the NC I/O", 
                                                                      qualifiers: [{ symbol: "TcHmiSymbol.Hide", value: "" }] }
    variables_output:
        isJogEnabled        : { type: t_bool                        , comment: "True if jog is enabled" }
        errorId             : { type: t_uint32                      , comment: "Axis error ID" }
        posLimitSwitch      : { type: t_bool                        , comment: "Limit switch in forward direction (e.g. at +105 mm for a stage of 100 mm travel range" }
        negLimitSwitch      : { type: t_bool                        , comment: "Limit switch in negative direction (e.g. at or a little bit below 0 mm)" }
    stat:
        busy                : { type: BusyStatus            , comment: "Is the NcAxis in a busy state?" }
        health              : { type: HealthStatus          , comment: "Is the NcAxis in a healthy state?" }
        powered             : { type: PoweredStatus         , comment: "Is the NcAxis powered?" }
        extSetGen           : { type: EnabledStatus         , comment: "Is the NcAxis its external setpoint generator enabled?" }
        motion              : { type: MotionStatus          , comment: "Is the NcAxis moving forward or backward or standing still?" }
    proc:
        moveAbsolute        : { type: McMoveAbsoluteProcess , comment: "Move absolute" }
        moveRelative        : { type: McMoveRelativeProcess , comment: "Move relative" }
        moveVelocity        : { type: McMoveVelocityProcess , comment: "Move at a constant velocity" }
        reset               : { type: McProcess             , comment: "Reset any errors" }
        stop                : { type: McProcess             , comment: "Stop any movement" }
        stopParametrized    : { type: McStopProcess         , comment: "Stop any movement" }
        power               : { type: McPowerProcess        , comment: "Power on/off the axis" }
        home                : { type: McProcess             , comment: "Peform a homing" }
        #gearIn              : { type: McProcess             , comment: "Couple to master axis" }
        #gearOut             : { type: McProcess             , comment: "Decouple from master axis" }
        initialize          : { type: Process               , comment: "Start initializing the axis" }
        setPosition         : { type: McSetPositionProcess  , comment: "Set the axis position" }
        #enableExtSetGen     : { type: McProcess             , comment: "Enable the external setpoint generator" }
        #disableExtSetGen    : { type: McProcess             , comment: "Disable the external setpoint generator" }
        #forceCalibration    : { type: McProcess             , comment: "Force the calibration (homing) flag to TRUE" }
        #resetCalibration    : { type: McProcess             , comment: "Reset the calibration (homing) flag to FALSE" }
        readParameter       : { type: McReadParameter       , comment: "Read a numerical parameter" }
        readBoolParameter   : { type: McReadBoolParameter   , comment: "Read a boolean parameter" }
        writeParameter      : { type: McWriteParameter      , comment: "Write a numerical parameter" }
        writeBoolParameter  : { type: McWriteBoolParameter  , comment: "Write a boolean parameter" }
        #probeStart          : { type: McProbe               , comment: "Start probing a hardware pulse, until a pulse is found" }
        #probeAbort          : { type: McProcess             , comment: "Stop probing even though the probe position is not found (yet)" }
    calls:
        busy:
            superState                  : !BOOL TRUE
            isBusy                      : !MTCS_SUMMARIZE_BUSY [ 
                                                proc.moveAbsolute,
                                                proc.moveRelative,
                                                proc.reset,
                                                proc.power,
                                                #proc.gearIn,
                                                #proc.gearOut,
                                                proc.initialize,
                                                proc.setPosition,
                                                #proc.enableExtSetGen,
                                                #proc.disableExtSetGen,
                                                #proc.forceCalibration,
                                                #proc.resetCalibration,
                                                proc.readParameter,
                                                proc.readBoolParameter,
                                                proc.writeParameter,
                                                proc.writeBoolParameter,
                                                #proc.probeAbort,
                                                proc.home ]
        health:
            superState                  : !BOOL TRUE
            isGood                      : !NOT [_axis_ref.Status.Error]
            hasWarning                  : !BOOL FALSE
        powered:
            superState                  : !BOOL TRUE
            isEnabled                   : !NOT [_axis_ref.Status.Disabled]
        motion:
            superState                  : !BOOL TRUE
            actVel                      : _axis_ref.NcToPlc.ActVelo
            tolerance                   : standstillTolerance
        extSetGen:
            superState                  : !BOOL TRUE
            isEnabled                   : _axis_ref.Status.ExtSetPointGenEnabled
        # proc
        power:
            isEnabled                   : !AND [ isEnabled, !EQ [ proc.power.stat.busy, BusyStatus.idle ] ]
        initialize:
            isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        moveAbsolute:
            isEnabled                   : isEnabled
        moveRelative:
            isEnabled                   : isEnabled
        moveVelocity:
            isEnabled                   : !AND [ isEnabled, !EQ [ proc.moveVelocity.stat.busy, BusyStatus.idle ] ]
        reset:
            isEnabled                   : !AND [ isEnabled, !EQ [ proc.reset.stat.busy, BusyStatus.idle ] ]
        # gearIn:
        #     isEnabled                   : !AND [ isEnabled, 
        #                                          !EQ [ proc.gearIn.stat.busy, BusyStatus.idle ],
        #                                          isGearingSupported ]
        # gearOut:
        #     isEnabled                   : !AND [ isEnabled, 
        #                                          !EQ [ proc.gearOut.stat.busy, BusyStatus.idle ],
        #                                          isGearingSupported ]
        stop:
            isEnabled                   : !AND [ isEnabled, !EQ [ proc.stop.stat.busy, BusyStatus.idle ] ]
        setPosition:
            isEnabled                   : !AND [ isEnabled, !EQ [ proc.setPosition.stat.busy, BusyStatus.idle ] ]
        # enableExtSetGen:
        #     isEnabled                   : !AND [ isEnabled, !EQ [ proc.enableExtSetGen.stat.busy, BusyStatus.idle ] ]
        # disableExtSetGen:
        #     isEnabled                   : !AND [ isEnabled, !EQ [ proc.disableExtSetGen.stat.busy, BusyStatus.idle ] ]
        # forceCalibration:
        #     isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        # resetCalibration:
        #     isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        readParameter:
            isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        readBoolParameter:
            isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        writeParameter:
            isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        writeBoolParameter:
            isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        # probeStart:
        #     isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        # probeAbort:
        #     isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]
        home:
            isEnabled                   : !AND [ isEnabled, !EQ [ stat.busy, BusyStatus.idle ] ]



