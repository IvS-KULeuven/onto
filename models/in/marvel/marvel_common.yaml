  ########################################################################################################################
  # Ell114CmdProcess
  ########################################################################################################################
  !PROCESS Ell114SendProcess:
    extends: BaseProcess
    arguments:
        cmd : { type: ELL14Command, comment: "The command to be sent" }
        arg : { type: t_string,     comment: "The payload of the command to be sent (excluding '0gs' or similar header, excluding $R$N suffix). Custom commands must include the header!" }
    variables_input:
        reply: { type: t_string,     comment: "Raw reply by the stage" }


  ########################################################################################################################
  # ELL14StatusCode
  ########################################################################################################################
  !ENUMERATION ELL14StatusCode:
    items:
        - OK                    # 0
        - COMM_TIMEOUT          # 1
        - MECH_TIMEOUT          # 2
        - CMD_ERROR             # 3
        - VALUE_OUT_OF_RANGE    # 4
        - MOD_ISOLATED          # 5
        - MOD_OUT_OF_ISOLATION  # 6
        - INIT_ERROR            # 7
        - THERMAL_ERROR         # 8
        - BUSY                  # 9
        - SENSOR_ERROR          # 10
        - MOTOR_ERROR           # 11
        - OUT_OF_RANGE          # 12
        - OVERCURRENT_ERROR     # 13
        - UNKNOWN               # 14, custom

  ########################################################################################################################
  # ELL14Stage
  ########################################################################################################################
  !STATEMACHINE ELL14Stage:
    variables_hidden:
        isEnabled           : { type: t_bool                        , comment: "Is control enabled?" }
    variables_input:
        simulated           : { type: t_bool                        , comment: "True if the device must be simulated" }
    variables_output:
        commError           : { type: t_bool                        , comment: "True if the communication is in error" }
        homed               : { type: t_bool                        , comment: "True if the stage was homed" }
        position            : { type: t_double                      , comment: "Actual position in °"  }
        statusCode          : { type: ELL14StatusCode               , comment: "Actual status"  }
    stat:
        health              : { type: HealthStatus                  , comment: "Is the device in a healthy state?" }
        busy                : { type: BusyStatus                    , comment: "Is the device in a busy state?" }
    proc:
        moveAbs             : { type: Arg1LrealProcess              , comment: "Move absolute to the specified position in °" }
        moveRel             : { type: Arg1LrealProcess              , comment: "Move relative with the specified offset in °" }
        send                : { type: Ell114SendProcess             , comment: "Send raw command" }
    calls:
        health:
            superState      : !BOOL TRUE
            hasWarning      : !BOOL FALSE
            isGood          : !AND [ !NOT [ commError ],
                                     !OR [ !EQ [ statusCode, ELL14StatusCode.OK ],
                                           !EQ [ statusCode, ELL14StatusCode.BUSY ] ] ]
        busy:
            superState      : !BOOL TRUE
            isBusy          : !EQ [ statusCode, ELL14StatusCode.BUSY ]
        moveAbs:
            isEnabled       : !AND [ isEnabled, homed ]
        moveRel:
            isEnabled       : !AND [ isEnabled, homed ]
        send:
            isEnabled       : isEnabled

