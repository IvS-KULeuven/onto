          isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                                !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ,
                                !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.unknown ], !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ] ]
        unlock:
          isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                                !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
        reset:
          isEnabled : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]
        
        resetPtp:
          isEnabled : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
      ##stat##
        enabled:
          superState   : !BOOL TRUE
          isEnabled     : config_ref.enabled 
        busy:
          superState   : !BOOL TRUE
          isBusy       : !OR [ !EQ [ stat.control, TempControlStatus.warming_up ], !EQ [ stat.init, marvel_common.InitializationStatus.initializing ] ]

    ###parts###
        #sensors
        tRearOut:     { config_ref: config_ref.tRearOut, sharedConfig_ref: config_ref.shared.sensors }
        tRearIn:      { config_ref: config_ref.tRearIn, sharedConfig_ref: config_ref.shared.sensors }
        tFront:       { config_ref: config_ref.tFront, sharedConfig_ref: config_ref.shared.sensors }

        #heaters
        htRearOut:     { config_ref: config_ref.htRearOut, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htRearIn:      { config_ref: config_ref.htRearIn, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htRearFront:   { config_ref: config_ref.htRearFront, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
    

  ###################################
  ### state machine thermo system ###
  ###################################
  !STATEMACHINE ThermoControl:

    variables_output:
      roomsStatHealth       : { type: marvel_common.HealthStatus, comment: "Summerization of health states rooms, used for hmi" }
      roomsStatBusy         : { type: marvel_common.BusyStatus, comment: "Summerization of busy states rooms, used for hmi" }

    references:
      config_ref              : { type: ThermoConfig, comment: "active configuration of the thermo control system"}
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
      operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }
    

    parts:
      outerRoom:
        type: OuterRoomControl
        expand: false
        comment: "State machine for the outer room temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                config_ref                : { type: OuterRoomConfig                      , expand: false }
                sharedConfig_ref          : { type: ThermoSharedConfig                   , expand: false }      
      innerRoom:
        type: InnerRoomControl
        expand: false
        comment: "State machine for the inner room temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                config_ref                : { type: InnerRoomConfig                     , expand: false }
                sharedConfig_ref          : { type: ThermoSharedConfig                   , expand: false }
      vessel:
        type: VesselControl
        expand: false
        comment: "State machine for the vessel temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                config_ref                : { type: VesselConfig                     , expand: false }
                sharedConfig_ref          : { type: ThermoSharedConfig                   , expand: false }
      shield:
        type: ShieldControl
        expand: false
        comment: "State machine for the shield temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                config_ref                : { type: ShieldConfig                         , expand: false }
                sharedConfig_ref          : { type: ThermoSharedConfig                   , expand: false }
      bench:
        type: BenchControl
        expand: false
        comment: "State machine for the bench temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                config_ref                : { type: BenchConfig                          , expand: false }
                sharedConfig_ref          : { type: ThermoSharedConfig                   , expand: false }
      cryo:
        type: CryoControl
        expand: false
        comment: "State machine for the cryo temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
                config_ref                : { type: CryoConfig                           , expand: false }
                sharedConfig_ref          : { type: ThermoSharedConfig                   , expand: false }

    stat:
      enabled         : { type: marvel_common.EnabledStatus        , comment: "Is the thermo control system enabled?" }
      init                        : { type: marvel_common.InitializationStatus }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the vessel healthy?" }
      control           : { type: TempControlStatus                   , comment: "Actual state of the vessel" }
      busy            : { type: marvel_common.BusyStatus           , comment: "Is the vessel busy with a procedure?" }


    proc:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
      start                       : { type: marvel_common.Process                     , comment: "Start warming up" }
      stop                        : { type: marvel_common.Process                     , comment: "Stop heating" }
      resetPtp                    : { type: marvel_common.Process                     , comment: "Reset the ptp values" }
      reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   
      lock                        : { type: marvel_common.Process                     , comment: "Lock the vessel control (e.g. when the vessel is opened)" }
      unlock                      : { type: marvel_common.Process                     , comment: "Unlock the vessel control (e.g. when the vessel is closed)" }



    calls:
      # health:
      #     superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
      #     isGood :  !AND [!MTCS_SUMMARIZE_GOOD [ parts.outerRoom, parts.innerRoom, parts.vessel, parts.shield, parts.bench, parts.cryo ], !NOT [error]]
      #     hasWarning: !MTCS_SUMMARIZE_WARN [ parts.outerRoom, parts.innerRoom, parts.vessel, parts.shield, parts.bench, parts.cryo ]
      enabled:
        superState: !BOOL TRUE
        isEnabled: config_ref.enabled
      busy:
          superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
          isBusy : !MTCS_SUMMARIZE_BUSY [ parts.outerRoom, parts.innerRoom, parts.vessel, parts.shield, parts.bench, parts.cryo ]

      control:
          superState          : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]    

          isWarmingUp         : !OR [ !EQ [parts.outerRoom.stat.control, TempControlStatus.warming_up ],
                                      !EQ [parts.innerRoom.stat.control, TempControlStatus.warming_up],
                                      !EQ [parts.vessel.stat.control, TempControlStatus.warming_up ],
                                      !EQ [parts.shield.stat.control, TempControlStatus.warming_up ],
                                      !EQ [parts.bench.stat.control, TempControlStatus.warming_up ],
                                      !EQ [parts.cryo.stat.control, TempControlStatus.warming_up ] ] 

          isActive            : !OR [ !EQ [parts.outerRoom.stat.control, TempControlStatus.active ],
                                      !EQ [parts.innerRoom.stat.control, TempControlStatus.active],
                                      !EQ [parts.vessel.stat.control, TempControlStatus.active ],
                                      !EQ [parts.shield.stat.control, TempControlStatus.active ],
                                      !EQ [parts.bench.stat.control, TempControlStatus.active ],
                                      !EQ [parts.cryo.stat.control, TempControlStatus.active ], ] 

        
    ##proc##
      start:
        isEnabled    : !AND [ !EQ [ stat.control, TempControlStatus.idle ], !EQ [ stat.init, marvel_common.InitializationStatus.initialized ],!NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ]
      stop:
        isEnabled    : !AND [ !NOT [!EQ [ stat.control, TempControlStatus.idle ] ], !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ]

      initialize:
        isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ,
                                    !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ] ,
                                    !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ,
                                    !EQ [ stat.enabled, marvel_common.EnabledStatus.disabled ] ] ]
      lock:
        isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                              !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ,
                              !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.unknown ], !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ] ]
      unlock:
        isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                              !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
      reset:
        isEnabled : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]
      
      resetPtp:
        isEnabled : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
      
    ###parts###
      outerRoom:
              activity_ref        : activity_ref
              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.outerRoom
              sharedConfig_ref    : config_ref.shared
      innerRoom:
              activity_ref        : activity_ref
              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.innerRoom
              sharedConfig_ref    : config_ref.shared

      vessel:
              activity_ref        : activity_ref
              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.vessel
              sharedConfig_ref    : config_ref.shared
    
      shield:
              activity_ref        : activity_ref
              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.shield
              sharedConfig_ref    : config_ref.shared
 
      bench:
              activity_ref        : activity_ref
              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.bench
              sharedConfig_ref    : config_ref.shared
 
      cryo:
              activity_ref        : activity_ref
              services_ref        : services_ref
              operator_ref        : operator_ref
              config_ref          : config_ref.cryo
              sharedConfig_ref    : config_ref.shared


  ############################
  ### state machine vacuum ###
  ############################
  !STATEMACHINE VacControl:
    references:
        config_ref              : { type: VacConfig, comment: "active configuration of the thermo control system"}
        activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
        services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
        operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }

    stat:
        enabled         : { type: marvel_common.EnabledStatus        , comment: "Is the vac system enabled?" }
        init                        : { type: marvel_common.InitializationStatus }
        health          : { type: marvel_common.HealthStatus         , comment: "Is the vessel healthy?" }
        busy :           { type: marvel_common.BusyStatus           , comment: "Is the vessel busy with a procedure?" }

    proc:
        initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
        reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   
        lock                        : { type: marvel_common.Process                     , comment: "Lock the vessel control (e.g. when the vessel is opened)" }
        unlock                      : { type: marvel_common.Process                     , comment: "Unlock the vessel control (e.g. when the vessel is closed)" }
    
    calls:
        enabled:
          superState   : !BOOL TRUE
          isEnabled     : config_ref.enabled
        ##proc##
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ,
                            !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ] ,
                            !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ,
                            !EQ [ stat.enabled, marvel_common.EnabledStatus.disabled ] ] ]
        lock:
          isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                                !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ,
                                !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.unknown ], !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ] ]
        unlock:
          isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                                !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
        reset:
          isEnabled : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]

  ### MAIN STATEMACHINE #################################### 

  ###############################
  ### state machine thermovac ###
  ###############################
  !STATEMACHINE ThermoVacControl:

      variables_input_rw:
        editableConfig            : { type: ThermoVacConfig                          , comment: "Editable configuration of the thermo vac system" , expand: false }

      variables_output:
        config            : { type: ThermoVacConfig                          , comment: "active configuration of the thermo vac system" }
        error:           { type: t_bool, comment: "Indicates if thermo vac itself has an error" }

      references:
        activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
        services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
        operator_ref            : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }

      stat:
        init                        : { type: marvel_common.InitializationStatus }
        health          : { type: marvel_common.HealthStatus         , comment: "Is the vessel healthy?" }
        busy :           { type: marvel_common.BusyStatus           , comment: "Is the vessel busy with a procedure?" }

      proc:
        initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
        reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   
        lock                        : { type: marvel_common.Process                     , comment: "Lock the vessel control (e.g. when the vessel is opened)" }
        unlock                      : { type: marvel_common.Process                     , comment: "Unlock the vessel control (e.g. when the vessel is closed)" }

      parts:
        thermo:
          type: ThermoControl
          expand: false
          comment: "statemachine of the thermal control system" 
          arguments:
            activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
            services_ref              : { type: marvel_services.Services              , expand: false }
            operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
            config_ref                : { type: ThermoConfig                           , expand: false }

        vac:
          type: VacControl
          expand: false
          comment: "statemachine of the vac control system"
          arguments:
            activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
            services_ref              : { type: marvel_services.Services              , expand: false }
            operator_ref              : { type: marvel_common.OperatorStatus          , expand: false }
            config_ref                : { type: VacConfig                           , expand: false }
        

        configManager:
          comment                     : "The config manager (to load/save/activate configuration data)"
          type                        : marvel_common.ConfigManager
        

      calls:
        busy:
          superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
          isBusy : !MTCS_SUMMARIZE_BUSY [ parts.thermo, parts.vac ]
      ##proc##
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ,
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ] ,
                                      !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ]
        lock:
          isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                                !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ] ,
                                !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.unknown ], !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ] ]
        unlock:
          isEnabled    : !AND [  !EQ [ operator_ref, marvel_common.OperatorStatus.tech ] ,
                                !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
        reset:
          isEnabled : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]

      ###parts##
        thermo:
          activity_ref        : activity_ref
          services_ref        : services_ref
          operator_ref        : operator_ref
          config_ref          : config.thermo
        
        vac:
          activity_ref        : activity_ref
          services_ref        : services_ref
          operator_ref        : operator_ref
          config_ref          : config.vac     


        configManager:
          isEnabled            : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]  


