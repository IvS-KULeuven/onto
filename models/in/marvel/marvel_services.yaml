########################################################################################################################
#                                                                                                                      #
# Model of the Services software.                                                                                        #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_services:


  ########################################################################################################################
  # ServicesM
  ########################################################################################################################
  
  !ENUMERATION ServicesMeteoAlert:
      items:
       - DISABLED
       - NONE
       - YELLOW  # in mildly alerted state, e.g. because the meteo service is down
       - ORANGE
       - RED

  ########################################################################################################################
  # ServicesTimingTimeSource
  ########################################################################################################################
  
  !ENUMERATION ServicesTimingTimeSource:
      items:
       - SYSTEM_CLOCK
       - NTP_CLOCK

  ########################################################################################################################
  # ServicesTimingConfig
  ########################################################################################################################
  
  !CONFIG ServicesTimingConfig:
      items:
          alwaysUseLocalClock:
              type: t_bool
              comment: "If TRUE, then the local clock (source=LOCAL_CLOCK) will be used even if an external (more accurate!) clock is available"
          autoCloseAtSunrise:
              type: t_bool
              comment: "If TRUE, then the domes will auto close at sunrise (at the angle set by autoCloseSunriseAltitude)"
          autoCloseSunriseAltitude:
              type: t_double
              comment: "Angle in degrees: e.g. -4 means that the domes will close automatically when the sun goes from -4.00001° to -3.999999° altitude"

  ##########################################################################
  # ServicesMeteoSimulation
  ##########################################################################
  
  !ENUMERATION ServicesMeteoSimulation:
    comment: "The types of weather that can be simulated"
    type: t_byte
    items: [
      PHOTOMETRIC,
      DRY_WINDY,
      DRY_TOO_WINDY,
      WET_WINDY,
    ]

  ########################################################################################################################
  # ServicesMeteoConfig
  ########################################################################################################################
  
  !CONFIG ServicesMercatorMeteoConfig:
      items:
          simulated:
              type: t_bool
              comment: "TRUE to simulate the Mercator weather station data"
          enableWeatherMonitoring:
              type: t_bool
              comment: "Enable weather monitoring and emergency closing via alerts"
          meteoUnknownYellowAlertTime:
              type: t_int16
              comment: "Time in seconds, after which unknown meteo data will cause a yellow alert. -1 = disable"
          meteoUnknownOrangeAlertTime:
              type: t_int16
              comment: "Time in seconds, after which unknown meteo data will cause an orange alert. -1 = disable"
          meteoUnknownRedAlertTime:
              type: t_int16
              comment: "Time in seconds, after which unknown meteo data will cause a red alert. -1 = disable"
          windSpeedMinimum:
              type: marvel_common.MeasurementConfig
              comment: "Config for the wind speed minimum"
              expand: false
          windSpeedAverage:
              type: marvel_common.MeasurementConfig
              comment: "Config for the wind speed average"
              expand: false
          windSpeedMaximum:
              type: marvel_common.MeasurementConfig
              comment: "Config for the wind speed maximum"
              expand: false
          windDirectionMinimum:
              type: marvel_common.MeasurementConfig
              comment: "Config for the wind direction minimum"
              expand: false
          windDirectionAverage:
              type: marvel_common.MeasurementConfig
              comment: "Config for the wind direction average"
              expand: false
          windDirectionMaximum:
              type: marvel_common.MeasurementConfig
              comment: "Config for the wind direction maximum"
              expand: false
          airPressure:
              type: marvel_common.MeasurementConfig
              comment: "Config for the air pressure"
              expand: false
          airTemperature:
              type: marvel_common.MeasurementConfig
              comment: "Config for the air temperature"
              expand: false
          internalTemperature:
              type: marvel_common.MeasurementConfig
              comment: "Config for the internal temperature"
              expand: false
          relativeHumidity:
              type: marvel_common.MeasurementConfig
              comment: "Config for the relative humidity"
              expand: false
          rainAccumulation:
              type: marvel_common.MeasurementConfig
              comment: "Config for the rain accumulation"
              expand: false
          rainDuration:
              type: marvel_common.MeasurementConfig
              comment: "Config for the rain duration"
              expand: false
          rainIntensity:
              type: marvel_common.MeasurementConfig
              comment: "Config for the rain intensity"
              expand: false
          rainPeakIntensity:
              type: marvel_common.MeasurementConfig
              comment: "Config for the rain peak intensity"
              expand: false
          hailAccumulation:
              type: marvel_common.MeasurementConfig
              comment: "Config for the hail accumulation"
              expand: false
          hailDuration:
              type: marvel_common.MeasurementConfig
              comment: "Config for the hail duration"
              expand: false
          hailIntensity:
              type: marvel_common.MeasurementConfig
              comment: "Config for the hail intensity"
              expand: false
          hailPeakIntensity:
              type: marvel_common.MeasurementConfig
              comment: "Config for the hail peak intensity"
              expand: false
          heatingTemperature:
              type: marvel_common.MeasurementConfig
              comment: "Config for the heating temperature"
              expand: false
          heatingVoltage:
              type: marvel_common.MeasurementConfig
              comment: "Config for the heating voltage"
              expand: false
          supplyVoltage:
              type: marvel_common.MeasurementConfig
              comment: "Config for the supply voltage"
              expand: false
          referenceVoltage:
              type: marvel_common.MeasurementConfig
              comment: "Config for the 3.5 V reference voltage"
              expand: false
          dewpoint:
              type: marvel_common.MeasurementConfig
              comment: "Config for the dew point"
              expand: false
  
  ########################################################################################################################
  # ServicesConfig
  ########################################################################################################################
  
  !CONFIG ServicesConfig:
      items:
          longitude:  { type: t_double                            , comment: "Location: longitude [degrees, positive = E, negative = W]" }
          latitude:   { type: t_double                            , comment: "Location: latitude [degrees, positive = N, negative = S]" }
          height:     { type: t_double                            , comment: "Location: height above sea-level [m]" }
          timing:
              type: ServicesTimingConfig
              comment: "Timing config"
              expand: false
          mercatorMeteo:
              type: ServicesMercatorMeteoConfig
              comment: "Mercator meteo config"



  ########################################################################################################################
  # Services
  ########################################################################################################################
  
  !STATEMACHINE Services:
      variables_input_rw:
          editableConfig                  : { type: ServicesConfig              , comment: "Editable configuration of the Services subsystem", expand: false }
      references:
          operator_ref                    : { type: marvel_common.OperatorStatus  , comment: "Shared operator status" }
      variables_output:
          config                          : { type: ServicesConfig              , comment: "Active configuration of the Services subsystem" }
      parts:
          timing:
              comment                     : "Timing service"
              arguments:
                  operator_ref            : {}
                  config_ref              : {}
                  longitude_ref           : {}
                  latitude_ref            : {}
                  height_ref              : {}
              attributes:
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
          mercatorMeteo:
              comment                     : "Mercator meteo service"
              arguments:
                  config_ref              : {}
              attributes:
                  airTemperature          : {}
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
          configManager:
              comment                     : "The config manager (to load/save/activate configuration data)"
              type                        : marvel_common.ConfigManager
      stat:
          init                            : { type: marvel_common.InitializationStatus }
          health                          : { type: marvel_common.HealthStatus }
          busy                            : { type: marvel_common.BusyStatus }
          operating                       : { type: marvel_common.OperatingStatus }
      proc:
          initialize                      : { type: marvel_common.Process                       , comment: "Start initializing" }
          lock                            : { type: marvel_common.Process                       , comment: "Lock the system" }
          unlock                          : { type: marvel_common.Process                       , comment: "Unlock the system" }
          changeOperatingState            : { type: marvel_common.ChangeOperatingStateProcess   , comment: "Change the operating state (e.g. AUTO, MANUAL, ...)" }
      calls:
          initialize:
              isEnabled                   : !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                                  !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                                  !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ]
          lock:
              isEnabled                   : !AND [ !EQ [ operator_ref,  marvel_common.OperatorStatus.tech ],
                                                   !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ]
          unlock:
              isEnabled                   : !AND [ !EQ [ operator_ref,  marvel_common.OperatorStatus.tech ], 
                                                   !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
          changeOperatingState:
              isEnabled                   : !BOOL FALSE # there is no MANUAL mode
        #   operating:
        #       superState                  : !EQ [ stat.init, marvel_common.InitializationStatus.initialized ]
          health:
              superState                  : !BOOL TRUE
              isGood                      : !MTCS_SUMMARIZE_GOOD [ parts.timing, 
                                                                   parts.mercatorMeteo ]
              hasWarning                  : !MTCS_SUMMARIZE_WARN [ parts.timing,
                                                                   parts.mercatorMeteo ]
          busy:
              superState                  : !BOOL TRUE
              isBusy                      : !EQ [ stat.init, marvel_common.InitializationStatus.initializing ]
          configManager:
              isEnabled                   : !EQ [ operator_ref, marvel_common.OperatorStatus.tech ]
          timing:
              operator_ref                : operator_ref
              config_ref                  : config.timing
              longitude_ref               : config.longitude
              latitude_ref                : config.latitude
              height_ref                  : config.height
          mercatorMeteo:
              config_ref                  : config.mercatorMeteo


  ########################################################################################################################
  # ServicesTiming
  ########################################################################################################################
  
  !STATEMACHINE ServicesTiming:
      typeOf                            : [ ServicesParts.timing ]
      references:
          operator_ref                  : { type: marvel_common.OperatorStatus     , comment: "Shared operator status"}
          config_ref                    : { type: ServicesTimingConfig            , comment: "The config" }
          longitude_ref                 : { type: t_double                        , comment: "Longitude as a reference"}
          latitude_ref                  : { type: t_double                        , comment: "Latitude as a reference"}
          height_ref                    : { type: t_double                        , comment: "Height as a reference"}
      variables_output:
          # I/O
          sysTime                       : { type: t_int64 , address: "%I*"        , comment: "TcCOM object nSysTime variable" }
          ntpExtTime                    : { type: t_int64 , address: "%I*"        , comment: "TcCOM object nExtTime variable" }
          ntpLastUpdated                : { type: t_int64 , address: "%I*"        , comment: "TcCOM object nLastUpdated variable" }
          sysToNtpExtTimeOffset         : { type: t_int64 , address: "%I*"        , comment: "TcCOM object nSysToExtTimeOffset variable" }
          isNtpConnected                : { type: t_bool  , address: "%I*"        , comment: "TRUE if NTP is connected" }
          isNtpSynchronized             : { type: t_bool  , address: "%I*"        , comment: "TRUE if NTP is synchronized" }
          # actual source
          source                        : { type: ServicesTimingTimeSource        , comment: "Actually used source"}
          utcFractionOfDay              : { type: t_double                        , comment: "UTC as a fraction of a day" }
          utcDateString                 : { type: t_string, len: 12               , comment: "Actual UTC date as a string of format YYYY-MM-DD" }
          utcTimeString                 : { type: t_string, len: 14               , comment: "Actual UTC time as a string of format HH-MM-SS.SSS" }
          lastUpdatedString             : { type: t_string, len: 20               , comment: "Time of the last NTP update" }
          # System to NTP offset
          sysToNtpOffset                : { type: t_double                        , comment: "Offset in seconds: system time - NTP time" }
          # JD, GMST
          jd                            : { type: t_double                        , comment: "Julian date" }
          jdSinceJ2000                  : { type: t_double                        , comment: "Julian date since J2000" }
          gmst                          : { type: t_double                        , comment: "Greenwich Mean Sidereal Time" }
          lst                           : { type: t_double                        , comment: "Local sidereal time in hours" }
          # sun position
          sunAlpha                      : { type: t_double                        , comment: "Sun Right Ascension" }
          sunDelta                      : { type: t_double                        , comment: "Sun Declination" }
          sunAzi                        : { type: t_double                        , comment: "Sun Azimuth" }
          sunEle                        : { type: t_double                        , comment: "Sun Elevation" }
          sunAutoClose                  : { type: t_bool                          , comment: "Pulse (during some seconds) which is TRUE while the sun is rising through autoCloseSunriseAltitude"}
      stat:
          health                        : { type: marvel_common.HealthStatus }
      proc:
          {}
      calls:
          health:
              superState                : !BOOL TRUE
              hasWarning                : !BOOL FALSE
              isGood                    : !OR [ config_ref.alwaysUseLocalClock, !AND [ isNtpConnected, isNtpSynchronized ] ]
  
  

  ########################################################################################################################
  # ServicesMercatorMeteoMeasurement
  ########################################################################################################################
  !STATEMACHINE ServicesMercatorMeteoMeasurement:
      references:
          config_ref      : { type: marvel_common.MeasurementConfig   , comment: "Reference to the config" }
      variables_input:
          data            : { type: t_double                        , comment: "The measured data" }
          valid           : { type: t_bool                          , comment: "TRUE if the data is valid" }
          disconnected    : { type: t_bool                          , comment: "TRUE if the data provider is disconnected" }
      stat:
          enabled         : { type: marvel_common.EnabledStatus       , comment: "Is the temperature being measured?" }
          health          : { type: marvel_common.HealthStatus        , comment: "Is the data valid and within range?" }
          alarm           : { type: marvel_common.HiHiLoLoAlarmStatus , comment: "Alarm status"}
      calls:
          enabled:
              superState   : !BOOL TRUE
              isEnabled    : config_ref.enabled
          alarm:
              superState   : !EQ [ stat.enabled, marvel_common.EnabledStatus.enabled ]
              config       : config_ref.alarms
              value        : data
          health:
              superState   : !EQ [ stat.enabled, marvel_common.EnabledStatus.enabled ]
              isGood       : !NOT [ !OR [ !NOT [ valid ],
                                          disconnected,
                                          !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.hiHi ],
                                          !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.loLo ] ] ]
              hasWarning   : !OR [ !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.hi ],
                                   !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.lo ] ]
  
  ########################################################################################################################
  # ServicesMercatorMeteo
  ########################################################################################################################
  
  !STATEMACHINE ServicesMercatorMeteo:
      typeOf                          : [ ServicesParts.mercatorMeteo ]
      variables_hidden:
          fromMercator                : { type: marvel_common.MercatorMeteoExchange , address: "%I*" , comment: "The data exchanged by the Mercator telescope" }
          mercatorDisconnected        : { type: t_bool                            , address: "%I*" , comment: "The data exchanged by the Mercator telescope is invalid" }
      variables_output:
          alertActive                 : { type: ServicesMeteoAlert                , comment: "The currently active alert" }
          unknownDataYellowTimeout    : { type: t_bool                            , comment: "True if the data is unknown longer than the yellow alert timeout" }
          unknownDataOrangeTimeout    : { type: t_bool                            , comment: "True if the data is unknown longer than the orange alert timeout" }
          unknownDataRedTimeout       : { type: t_bool                            , comment: "True if the data is unknown longer than the red alert timeout" }
      local:
          weatherStatus               : { type: t_string, len: 30                 , comment: "Weather status as a string" }
          mercatorConnected           : { type: t_bool                            , comment: "True if MTCS is connected" }
          # other
          durationOK                  : { type: marvel_common.Duration              , comment: "Duration that the meteo is OK" }
          heating                     : { type: t_bool                            , comment: "Heating or not?"}
          windDirectionMinimumString  : { type: t_string, len: 6                  , comment: "Average direction of the wind as a string"}
          windDirectionAverageString  : { type: t_string, len: 6                  , comment: "Average direction of the wind as a string"}
          windDirectionMaximumString  : { type: t_string, len: 6                  , comment: "Average direction of the wind as a string"}
          # simulation
          fromSimulation              : { type: marvel_common.MercatorMeteoExchange , comment: "The simulated data (if config.simulated is TRUE)", expand: false }
      parts:
          windSpeedMinimum            : { type: ServicesMercatorMeteoMeasurement  , comment: "Wind speed minimum" }
          windSpeedAverage            : { type: ServicesMercatorMeteoMeasurement  , comment: "Wind speed average" }
          windSpeedMaximum            : { type: ServicesMercatorMeteoMeasurement  , comment: "Wind speed maximum" }
          windDirectionMinimum        : { type: ServicesMercatorMeteoMeasurement  , comment: "Wind direction minimum" }
          windDirectionAverage        : { type: ServicesMercatorMeteoMeasurement  , comment: "Wind direction average" }
          windDirectionMaximum        : { type: ServicesMercatorMeteoMeasurement  , comment: "Wind direction maximum" }
          airPressure                 : { type: ServicesMercatorMeteoMeasurement  , comment: "Air pressure" }
          airTemperature              : { type: ServicesMercatorMeteoMeasurement  , comment: "Air temperature" }
          internalTemperature         : { type: ServicesMercatorMeteoMeasurement  , comment: "Internal temperature" }
          relativeHumidity            : { type: ServicesMercatorMeteoMeasurement  , comment: "Relative humidity" }
          rainAccumulation            : { type: ServicesMercatorMeteoMeasurement  , comment: "Rain accumulation" }
          rainDuration                : { type: ServicesMercatorMeteoMeasurement  , comment: "Rain duration" }
          rainIntensity               : { type: ServicesMercatorMeteoMeasurement  , comment: "Rain intensity" }
          rainPeakIntensity           : { type: ServicesMercatorMeteoMeasurement  , comment: "Rain peak intensity" }
          hailAccumulation            : { type: ServicesMercatorMeteoMeasurement  , comment: "Hail accumulation" }
          hailDuration                : { type: ServicesMercatorMeteoMeasurement  , comment: "Hail duration" }
          hailIntensity               : { type: ServicesMercatorMeteoMeasurement  , comment: "Hail intensity" }
          hailPeakIntensity           : { type: ServicesMercatorMeteoMeasurement  , comment: "Hail peak intensity" }
          heatingTemperature          : { type: ServicesMercatorMeteoMeasurement  , comment: "Heating temperature" }
          heatingVoltage              : { type: ServicesMercatorMeteoMeasurement  , comment: "Heating voltage" }
          supplyVoltage               : { type: ServicesMercatorMeteoMeasurement  , comment: "Supply voltage" }
          referenceVoltage            : { type: ServicesMercatorMeteoMeasurement  , comment: "Reference voltage" }
          dewpoint                    : { type: ServicesMercatorMeteoMeasurement  , comment: "Calculated dew point temperature" }
      references:
          config_ref                  : { type: ServicesMercatorMeteoConfig       , comment: "The config" }
      stat:
          meteoHealthStatus           : { type: marvel_common.HealthStatus }
          health                      : { type: marvel_common.HealthStatus }
      proc:
          {}
      calls:
          windSpeedMinimum:
              config_ref              : config_ref.windSpeedMinimum
              data                    : fromMercator.windSpeedMinimum
              valid                   : fromMercator.windSpeedMinimumValid
              disconnected            : mercatorDisconnected
          windSpeedAverage:
              config_ref              : config_ref.windSpeedAverage
              data                    : fromMercator.windSpeedAverage
              valid                   : fromMercator.windSpeedAverageValid
              disconnected            : mercatorDisconnected
          windSpeedMaximum:
              config_ref              : config_ref.windSpeedMaximum
              data                    : fromMercator.windSpeedMaximum
              valid                   : fromMercator.windSpeedMaximumValid
              disconnected            : mercatorDisconnected
          windDirectionMinimum:
              config_ref              : config_ref.windDirectionMinimum
              data                    : fromMercator.windDirectionMinimum
              valid                   : fromMercator.windDirectionMinimumValid
              disconnected            : mercatorDisconnected
          windDirectionAverage:
              config_ref              : config_ref.windDirectionAverage
              data                    : fromMercator.windDirectionAverage
              valid                   : fromMercator.windDirectionAverageValid
              disconnected            : mercatorDisconnected
          windDirectionMaximum:
              config_ref              : config_ref.windDirectionMaximum
              data                    : fromMercator.windDirectionMaximum
              valid                   : fromMercator.windDirectionMaximumValid
              disconnected            : mercatorDisconnected
          airPressure:
              config_ref              : config_ref.airPressure
              data                    : fromMercator.airPressure
              valid                   : fromMercator.airPressureValid
              disconnected            : mercatorDisconnected
          airTemperature:
              config_ref              : config_ref.airTemperature
              data                    : fromMercator.airTemperature
              valid                   : fromMercator.airTemperatureValid
              disconnected            : mercatorDisconnected
          internalTemperature:
              config_ref              : config_ref.internalTemperature
              data                    : fromMercator.internalTemperature
              valid                   : fromMercator.internalTemperatureValid
              disconnected            : mercatorDisconnected
          relativeHumidity:
              config_ref              : config_ref.relativeHumidity
              data                    : fromMercator.relativeHumidity
              valid                   : fromMercator.relativeHumidityValid
              disconnected            : mercatorDisconnected
          rainAccumulation:
              config_ref              : config_ref.rainAccumulation
              data                    : fromMercator.rainAccumulation
              valid                   : fromMercator.rainAccumulationValid
              disconnected            : mercatorDisconnected
          rainDuration:
              config_ref              : config_ref.rainDuration
              data                    : fromMercator.rainDuration
              valid                   : fromMercator.rainDurationValid
              disconnected            : mercatorDisconnected
          rainIntensity:
              config_ref              : config_ref.rainIntensity
              data                    : fromMercator.rainIntensity
              valid                   : fromMercator.rainIntensityValid
              disconnected            : mercatorDisconnected
          rainPeakIntensity:
              config_ref              : config_ref.rainPeakIntensity
              data                    : fromMercator.rainPeakIntensity
              valid                   : fromMercator.rainPeakIntensityValid
              disconnected            : mercatorDisconnected
          hailAccumulation:
              config_ref              : config_ref.hailAccumulation
              data                    : fromMercator.hailAccumulation
              valid                   : fromMercator.hailAccumulationValid
              disconnected            : mercatorDisconnected
          hailDuration:
              config_ref              : config_ref.hailDuration
              data                    : fromMercator.hailDuration
              valid                   : fromMercator.hailDurationValid
              disconnected            : mercatorDisconnected
          hailIntensity:
              config_ref              : config_ref.hailIntensity
              data                    : fromMercator.hailIntensity
              valid                   : fromMercator.hailIntensityValid
              disconnected            : mercatorDisconnected
          hailPeakIntensity:
              config_ref              : config_ref.hailPeakIntensity
              data                    : fromMercator.hailPeakIntensity
              valid                   : fromMercator.hailPeakIntensityValid
              disconnected            : mercatorDisconnected
          heatingTemperature:
              config_ref              : config_ref.heatingTemperature
              data                    : fromMercator.heatingTemperature
              valid                   : fromMercator.heatingTemperatureValid
              disconnected            : mercatorDisconnected
          heatingVoltage:
              config_ref              : config_ref.heatingVoltage
              data                    : fromMercator.heatingVoltage
              valid                   : fromMercator.heatingVoltageValid
              disconnected            : mercatorDisconnected
          supplyVoltage:
              config_ref              : config_ref.supplyVoltage
              data                    : fromMercator.supplyVoltage
              valid                   : fromMercator.supplyVoltageValid
              disconnected            : mercatorDisconnected
          referenceVoltage:
              config_ref              : config_ref.referenceVoltage
              data                    : fromMercator.referenceVoltage
              valid                   : fromMercator.referenceVoltageValid
              disconnected            : mercatorDisconnected
          dewpoint:
              config_ref              : config_ref.dewpoint
              data                    : fromMercator.dewpoint
              valid                   : fromMercator.dewpointValid
              disconnected            : mercatorDisconnected
          health:
              superState              : !BOOL TRUE
              hasWarning              : !BOOL FALSE
              isGood                  : !AND [ fromMercator.mercatorServiceHealthy,
                                               !NOT [ mercatorDisconnected ] ]
          meteoHealthStatus:
              superState              : !OR [ 
                                            !EQ [ stat.health, marvel_common.HealthStatus.good ],
                                            unknownDataRedTimeout,
                                            unknownDataOrangeTimeout,
                                            unknownDataYellowTimeout ]
              isGood                  : !AND [
                                              !NOT [ unknownDataRedTimeout ],
                                              !MTCS_SUMMARIZE_GOOD_OR_DISABLED [
                                                  parts.windSpeedMinimum,
                                                  parts.windSpeedAverage,
                                                  parts.windSpeedMaximum,
                                                  parts.windDirectionMinimum,
                                                  parts.windDirectionAverage,
                                                  parts.windDirectionMaximum,
                                                  parts.airPressure,
                                                  parts.airTemperature,
                                                  parts.internalTemperature,
                                                  parts.relativeHumidity,
                                                  parts.rainAccumulation,
                                                  parts.rainDuration,
                                                  parts.rainIntensity,
                                                  parts.rainPeakIntensity,
                                                  parts.hailAccumulation,
                                                  parts.hailDuration,
                                                  parts.hailIntensity,
                                                  parts.hailPeakIntensity,
                                                  parts.heatingTemperature,
                                                  parts.heatingVoltage,
                                                  parts.supplyVoltage,
                                                  parts.referenceVoltage,
                                                  parts.dewpoint ]
                                            ]
              hasWarning               : !OR [ 
                                                unknownDataYellowTimeout,
                                                unknownDataOrangeTimeout,
                                                !MTCS_SUMMARIZE_WARN [
                                                  parts.windSpeedMinimum,
                                                  parts.windSpeedAverage,
                                                  parts.windSpeedMaximum,
                                                  parts.windDirectionMinimum,
                                                  parts.windDirectionAverage,
                                                  parts.windDirectionMaximum,
                                                  parts.airPressure,
                                                  parts.airTemperature,
                                                  parts.internalTemperature,
                                                  parts.relativeHumidity,
                                                  parts.rainAccumulation,
                                                  parts.rainDuration,
                                                  parts.rainIntensity,
                                                  parts.rainPeakIntensity,
                                                  parts.hailAccumulation,
                                                  parts.hailDuration,
                                                  parts.hailIntensity,
                                                  parts.hailPeakIntensity,
                                                  parts.heatingTemperature,
                                                  parts.heatingVoltage,
                                                  parts.supplyVoltage,
                                                  parts.referenceVoltage,
                                                  parts.dewpoint ]
                                        ]
  