########################################################################################################################
#                                                                                                                      #
# Model containing the unit-level software design of the Marvel TCS.                                                   #
#                                                                                                                      #
########################################################################################################################


!IMPORT models/in/marvel/marvel_dome.yaml:
!IMPORT models/in/marvel/marvel_telescope.yaml:
!IMPORT models/in/marvel/marvel_common.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_unit:


  ########################################################################################################################
  # UnitConfig
  ########################################################################################################################
  !CONFIG UnitConfig:
      items:
        dome:       { type: marvel_dome.DomeConfig              , comment: "Dome config of a Marvel unit", expand: false }
        telescope:  { type: marvel_telescope.TelescopeConfig    , comment: "Telescope config of a Marvel unit", expand: false }
        longitude:  { type: t_double                            , comment: "Unit location: longitude [degrees, positive = E, negative = W]" }
        latitude:   { type: t_double                            , comment: "Unit location: latitude [degrees, positive = N, negative = S]" }
        height:     { type: t_float                             , comment: "Unit location: height above sea-level [m]" }


  ########################################################################################################################
  # Unit
  ########################################################################################################################
  !STATEMACHINE Unit:
      variables:
          number                    : { type: t_uint8                           , comment: "Number of the unit (1-4)" }
          editableConfig            : { type: UnitConfig                        , comment: "Editable configuration of the unit" , expand: false }
      variables_read_only:
          config                    : { type: UnitConfig                        , comment: "Active configuration of the unit" }
          targetAlpha               : { type: mtcs_common.AngularPosition       , comment: "The target alpha coordinate (Right Ascention)" , expand: false}
          targetDelta               : { type: mtcs_common.AngularPosition       , comment: "The target delta coordinate (Declination)" , expand: false }
      references:
        operatorStatus              : { type: mtcs_common.OperatorStatus        , comment: "Reference to the operator (observer/tech)"}
        activityStatus              : { type: mtcs_common.ActivityStatus        , comment: "Shared activity status"}
      parts:
          dome:
              type : marvel_dome.Dome
              comment: "The dome"
              expand: false
              arguments:
                  operatorStatus          : { type: mtcs_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: mtcs_common.ActivityStatus          , expand: false }
                  config                  : { type: marvel_dome.DomeConfig              , expand: false }
                  telescopeAzi            : { type: mtcs_common.AngularPosition         , expand: false }
              attributes:
                  # isTracking              : { type: t_bool }
                  statuses:
                      attributes:
                          healthStatus    : { type: mtcs_common.HealthStatus }
                          busyStatus      : { type: mtcs_common.BusyStatus }
                  processes:
                      attributes:
                        syncWithAxes:
                            attributes:
                                isEnabled : { type: t_bool }
                        stop:
                            attributes:
                                isEnabled : { type: t_bool }
          telescope:
              type : marvel_telescope.Telescope
              comment: "The telescope"
              expand: false
              arguments:
                  operatorStatus          : { type: mtcs_common.OperatorStatus          , expand: false }
                  activityStatus          : { type: mtcs_common.ActivityStatus          , expand: false }
                  config                  : { type: marvel_telescope.TelescopeConfig    , expand: false }
              attributes:
                  # isTracking              : { type: t_bool }
                  actAzi                  : { type: mtcs_common.AngularPosition         , expand: false }
                  statuses:
                      attributes:
                          healthStatus    : { type: mtcs_common.HealthStatus }
                          busyStatus      : { type: mtcs_common.BusyStatus }
                  processes:
                      attributes:
                        slewToCoordinates:
                            attributes:
                                isEnabled : { type: t_bool }
                        abortSlew:
                            attributes:
                                isEnabled : { type: t_bool }
          configManager:
              comment                     : "The config manager (to load/save/activate configuration data)"
              type                        : mtcs_common.ConfigManager
      statuses:
          initializationStatus        : { type: mtcs_common.InitializationStatus }
          healthStatus                : { type: mtcs_common.HealthStatus }
          busyStatus                  : { type: mtcs_common.BusyStatus }
      processes:
          initialize                  : { type: mtcs_common.Process                     , comment: "Start initializing the unit" }   
          point                       : { type: marvel_common.PointAlphaDeltaProcess    , comment: "Point the telescope and dome"}     
          stop                        : { type: mtcs_common.Process                     , comment: "Stop the rotation movement and/or tracking" }
      calls:
          initialize:
              isEnabled           : !NOT [ statuses.initializationStatus.initializing ]
          point:
              isEnabled           : !AND [ parts.telescope.processes.slewToCoordinates.isEnabled,
                                           parts.dome.processes.syncWithAxes.isEnabled ]
          stop:
              isEnabled           : !OR  [ parts.telescope.processes.abortSlew.isEnabled,
                                           parts.dome.processes.stop.isEnabled ]
          dome:
              operatorStatus      : operatorStatus
              activityStatus      : activityStatus
              config              : config.dome
              telescopeAzi        : parts.telescope.actAzi
          telescope:
              operatorStatus      : operatorStatus
              activityStatus      : activityStatus
              config              : config.telescope
          configManager:
             isEnabled            : operatorStatus.tech
          healthStatus:
              superState          : !NOT [ statuses.initializationStatus.shutdown ]
              isGood              : !MTCS_SUMMARIZE_GOOD [ parts.dome, parts.telescope, parts.configManager ]
              hasWarning          : !MTCS_SUMMARIZE_WARN [ parts.dome, parts.telescope, parts.configManager ]
          busyStatus:
              superState          : !NOT [ statuses.initializationStatus.shutdown ]
              isBusy              : !MTCS_SUMMARIZE_BUSY [ parts.dome, parts.telescope, parts.configManager ]

