  #   processes:
  #     reset                   : { type: marvel_common.Process                 , comment: "Reset errors" }
  #     switchLightOn           : { type: marvel_common.Process                 , comment: "Turn On the light in the dome" }
  #     switchLightOff          : { type: marvel_common.Process                 , comment: "Turn Off the light in the dome" }
  #   calls:
  #     # processes
  #     reset:
