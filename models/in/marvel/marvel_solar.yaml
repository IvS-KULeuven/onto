#######################################################################################################################
#                                                                                                                      #
# Model containing the solar telescope plc software design                                           #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:

########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_solar:

  !CONFIG SolarConfig:
    items:
      defPowerFan: {type: t_float, comment: "Default power of the cooling fan in percent", initial: !DOUBLE 30.0}
      highTemp: {type: t_float, comment: "Fan turned up to max power at this temperature to prevent damage", initial: !DOUBLE 35.0}
      maxTemp: {type: t_float, comment: "Maximum allowed temperature before the solar telescope is shut down to prevent damage", initial: !DOUBLE 40.0}
      fanEnabled: {type: t_bool, comment: "True if the cooling fan is enabled", initial: !BOOL TRUE}



  !STATEMACHINE Solar:
    references:
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
      operator_ref           : { type: marvel_common.OperatorStatus               , comment: "Shared operation status"}
     

    variables_input:
      temp              : { type: t_float           , comment: "The measured temperature"}

    #sensors azimuth
      lsAz1        : { type: t_bool                                                , comment: "limit switch azi 1 (soft) (west) (B1)"  }
      lsAz2          : { type: t_bool                                                , comment: "limit switch azi 2 (hard) (nord) (B2)" }
      lsAz3           : { type: t_bool                                                , comment: "limit switch azi 3 (soft) (east) (B3)"  }
      hsAz            : { type: t_bool                                                , comment: "State of home sensor azi (south) (B4)"  }
    
    #sensors altiude 
      lsAl1           : { type: t_bool                                                , comment: "limit switch alti 1 (soft) (top) (B5)"}
      lsAl2           : { type: t_bool                                                , comment: "limit switch alti 2 (hard) (mid) (B6)"}
      hsAl            : { type: t_bool                                                , comment: "State of home sensor alti + limit (bottom) (B7)" }
    
    
    variables_input_rw:
      editableConfig            : { type: SolarConfig                          , comment: "Editable configuration of the solar telescope" , expand: false }     

    variables_output:
      config       :   { type: SolarConfig, comment: "Configuration of the solar telescope" }
      fanOk        : { type: t_bool                                                , comment: "True if the cooling fan is working" }
      powerPC      : { type: t_bool                   , comment: "True if the solar pc is enabled", address: "%Q*"  }
      powerMount   : { type: t_bool                   , comment: "True if the solar mount is enabled", address: "%Q*"  }
      powerFan     : { type: t_float                 , comment: "Power of the cooling fan in percent"}
      forced   : { type: t_bool                   , comment: "True if power of the mount is forced" }

    parts:
        configManager:
          comment                     : "The config manager (to load/save/activate configuration data)"
          type                        : marvel_common.ConfigManager

    stat:
      health                      : { type: marvel_common.HealthStatus }
      busy                        : { type: marvel_common.BusyStatus                   , comment: "True if the solar telescope is busy" }
      init                : { type: marvel_common.InitializationStatus              , comment: "True if the solar telescope is initialized" }

    proc:
      initialize                        : { type: marvel_common.Process                         , comment: "Initialize the solar telescope" }
      powerOnPc                    : { type: marvel_common.Process                         , comment: "enable power to to solar pc and mount" }
      powerOffPc                   : { type: marvel_common.Process                         , comment: "Stop power to solar pc and mount" }
      powerOnMount                     : { type: marvel_common.Process                         , comment: "enable power to to solar mount and mount" }
      powerOffMount                    : { type: marvel_common.Process                         , comment: "Stop power to solar mount and mount" }
      manualPowerOn                     : { type: marvel_common.Process                         , comment: "overwrite hard limits" }
      manualPowerOff                   : { type: marvel_common.Process                         , comment: "Stop overwriting hard limits" }
      lock                 : { type: marvel_common.Process                         , comment: "Lock the solar telescope"}
      unlock               : { type: marvel_common.Process                         , comment: "Unlock the solar telescope"}
      reset                : { type: marvel_common.Process                         , comment: "Reset the solar telescope"}
    
    calls:
        powerOnMount:
          isEnabled: !AND [ !EQ [stat.init, marvel_common.InitializationStatus.initialized],!NOT [powerMount],  !NOT [!EQ [ stat.health, marvel_common.HealthStatus.bad]], !NOT [forced]]
        powerOffMount:
          isEnabled: !AND [ powerMount, !NOT [ forced ] ]

        powerOnPc:
           isEnabled: !AND [ !EQ [stat.init, marvel_common.InitializationStatus.initialized], !NOT [powerPC]]

        powerOffPc:
           isEnabled: powerPC

        manualPowerOn:
          isEnabled: !AND [!EQ [operator_ref, marvel_common.OperatorStatus.tech], !NOT [forced] ]

        manualPowerOff:
          isEnabled: !AND [ forced, !EQ [operator_ref, marvel_common.OperatorStatus.tech] ]

        initialize:
          isEnabled: !AND [ !NOT [!EQ [stat.init, marvel_common.InitializationStatus.initialized]], !NOT [!EQ [ stat.init, marvel_common.InitializationStatus.initializing]], !NOT [!EQ [ stat.init, marvel_common.InitializationStatus.locked]] ]

        configManager:
          isEnabled: !EQ [operator_ref, marvel_common.OperatorStatus.tech]

        lock:
          isEnabled: !AND [!EQ [operator_ref, marvel_common.OperatorStatus.tech], !NOT [!EQ [ stat.init, marvel_common.InitializationStatus.locked]]]   

        unlock:
          isEnabled: !AND [!EQ [operator_ref, marvel_common.OperatorStatus.tech], !EQ [ stat.init, marvel_common.InitializationStatus.locked]]    
        
        reset:
          isEnabled: !BOOL TRUE