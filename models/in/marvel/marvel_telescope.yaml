########################################################################################################################
#                                                                                                                      #
# Model of the Telescope software.                                                                                     #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel_telescope:
  
  
  ########################################################################################################################
  # TelescopeKnownPositionConfig
  ########################################################################################################################
  !CONFIG TelescopeKnownPositionConfig:
      items:
          name:
              type: t_string
              comment: "The name of the position (e.g. 'PARK')"
          allowObserver:
              type: t_bool
              comment: "Can an observer switch to this position?"
          azi:
              type: t_double
              comment: "Azimuth in degrees"
          ele:
              type: t_double
              comment: "Elevation in degrees"
          rot:
              type: t_double
              comment: "Nasmyth rotation in degrees"
          doAzi:
              type: t_bool
              comment: "Change the azimuth axis to the 'azi' position"
          doEle:
              type: t_bool
              comment: "Change the elevation axis to the 'ele' position"
          doRot:
              type: t_bool
              comment: "Change the nasmyth rotation axis to the 'rot' position"
  
  
  ########################################################################################################################
  # TelescopeKnownPositionsConfig
  ########################################################################################################################
  !CONFIG TelescopeKnownPositionsConfig:
      items:
          position0     : { type: TelescopeKnownPositionConfig, comment : "Known position 0"   , expand: false }
          position1     : { type: TelescopeKnownPositionConfig, comment : "Known position 1"   , expand: false }
          position2     : { type: TelescopeKnownPositionConfig, comment : "Known position 2"   , expand: false }
          position3     : { type: TelescopeKnownPositionConfig, comment : "Known position 3"   , expand: false }
          position4     : { type: TelescopeKnownPositionConfig, comment : "Known position 4"   , expand: false }
          position5     : { type: TelescopeKnownPositionConfig, comment : "Known position 5"   , expand: false }
          position6     : { type: TelescopeKnownPositionConfig, comment : "Known position 6"   , expand: false }
          position7     : { type: TelescopeKnownPositionConfig, comment : "Known position 7"   , expand: false }
          position8     : { type: TelescopeKnownPositionConfig, comment : "Known position 8"   , expand: false }
          position9     : { type: TelescopeKnownPositionConfig, comment : "Known position 9"   , expand: false }
  
  
  ########################################################################################################################
  # TelescopeConfig
  ########################################################################################################################
  
  !CONFIG TelescopeConfig:
      items:
          simulated                   : { type: t_bool                    , comment: "TRUE if the telescope is simulated, FALSE if not"}
          alpacaTelHost               : { type: t_string                  , comment: "ASA TEL alpaca server IP address or hostname" }
          alpacaTelPort               : { type: t_uint16                  , comment: "ASA TEL alpaca server port number" }
          alpacaAccHost               : { type: t_string                  , comment: "ASA ACC alpaca server IP address or hostname" }
          alpacaAccPort               : { type: t_uint16                  , comment: "ASA ACC alpaca server port number" }
          alpacaLoopTime              : { type: t_uint16                  , comment: "Alpaca loop time in ms" }
          knownPositions              : { type: TelescopeKnownPositionsConfig  , comment: "Known (predefined) positions (e.g. could be Park, Cover, Park winter, Mirror washing, ...)", expand: false }
          knownPositionToleranceAzi   : { type: t_double                  , comment: "Tolerance (in degrees) to determine if the telescope is at a known position in azi direction" }
          knownPositionToleranceEle   : { type: t_double                  , comment: "Tolerance (in degrees) to determine if the telescope is at a known position in ele direction" }
          knownPositionToleranceRot   : { type: t_double                  , comment: "Tolerance (in degrees) to determine if the telescope is at a known position in rot direction" }


  ########################################################################################################################
  # TelescopeSlewToAziEleProcess
  ########################################################################################################################
  !PROCESS TelescopeSlewToAziEleProcess:
      extends: marvel_common.BaseProcess
      arguments:
          azimuth               : { type: t_double                            , comment: "Azimuth, in degrees" }
          elevation             : { type: t_double                            , comment: "Elevation, in degrees" }
  

  ########################################################################################################################
  # TelescopeSetTrackingProcess
  ########################################################################################################################
  !PROCESS TelescopeSetTrackingProcess:
      extends: marvel_common.BaseProcess
      arguments:
          tracking              : { type: t_bool                              , comment: "Switch tracking on (TRUE) or off (FALSE)" }
  
  
  ########################################################################################################################
  # TelescopeMoveKnownPositionProcess
  ########################################################################################################################
  !PROCESS TelescopeMoveKnownPositionProcess:
      extends: marvel_common.BaseProcess
      arguments:
          name        : { type: t_string                        , comment: "Name of the position to move to"}
  

  ########################################################################################################################
  # TelescopeMoveProcess
  ########################################################################################################################
  !PROCESS TelescopeMoveProcess:
      extends: marvel_common.BaseProcess
      arguments:
          position               : { type: t_double                            , comment: "New position" }

  ########################################################################################################################
  # Telescope
  ########################################################################################################################
  
  !STATEMACHINE Telescope:
      references:
          operatorStatus_ref              : { type: marvel_common.OperatorStatus              , comment: "Shared operator status" }
          activityStatus_ref              : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
          config_ref                      : { type: TelescopeConfig                         , comment: "Active configuration of the telescope" }
          longitude_ref                   : { type: t_double }
          latitude_ref                    : { type: t_double }
      variables_read_only:
          isTelConnected                  : { type: t_bool                                  , comment: "True if the TEL server is connected" }
          isAccConnected                  : { type: t_bool                                  , comment: "True if the ACC server is connected" }
          isSlewing                       : { type: t_bool                                  , comment: "True if the telescope is slewing" }
          isTracking                      : { type: t_bool                                  , comment: "True if the telescope is tracking" }
          # actual position
          actAlpha                        : { type: marvel_common.AngularPosition             , comment: "The actual alpha coordinate (Right Ascention)" , expand: false}
          actDelta                        : { type: marvel_common.AngularPosition             , comment: "The actual delta coordinate (Declination)" , expand: false }
          actAzi                          : { type: marvel_common.AngularPosition             , comment: "The actual azimuth" , expand: false}
          actEle                          : { type: marvel_common.AngularPosition             , comment: "The actual elevation" , expand: false }
          targetAlpha                     : { type: marvel_common.AngularPosition             , comment: "The target alpha coordinate (Right Ascention)" , expand: false}
          targetDelta                     : { type: marvel_common.AngularPosition             , comment: "The target delta coordinate (Declination)" , expand: false }
          isAtKnownPosition               : { type: t_bool                                  , comment: "True if the telescope is at a known position" }
          actualKnownPositionName         : { type: t_string                                , comment: "Name of the known position if isAtKnownPosition is True" }
      statuses:
          initializationStatus            : { type: marvel_common.InitializationStatus }
          healthStatus                    : { type: marvel_common.HealthStatus }
          busyStatus                      : { type: marvel_common.BusyStatus }
          operatingStatus                 : { type: marvel_common.OperatingStatus }
          poweredStatus                   : { type: marvel_common.PoweredStatus }
      processes:
          initialize                      : { type: marvel_common.Process                         , comment: "Start initializing" }
          lock                            : { type: marvel_common.Process                         , comment: "Lock the cover" }
          unlock                          : { type: marvel_common.Process                         , comment: "Unlock the cover" }
          changeOperatingState            : { type: marvel_common.ChangeOperatingStateProcess     , comment: "Change the operating state (e.g. AUTO, MANUAL, ...)" }
          slewToCoordinates               : { type: marvel_common.PointAlphaDeltaProcess        , comment: "Slew to the given equatorial coordinates" }
          slewToAziEle                    : { type: TelescopeSlewToAziEleProcess                , comment: "Slew to the given horizontal coordinates" }
          abortSlew                       : { type: marvel_common.Process                         , comment: "Stop the slewing" }
          reset                           : { type: marvel_common.Process                         , comment: "Reset any errors" }
          powerOn                         : { type: marvel_common.Process                         , comment: "Power on the axes" }
          powerOff                        : { type: marvel_common.Process                         , comment: "Power off the axes" }
          moveKnownPosition               : { type: TelescopeMoveKnownPositionProcess           , comment: "Move the telescope to the given known position" }
          setTracking                     : { type: TelescopeSetTrackingProcess                 , comment: "Power on the axes" }
          moveM2                          : { type: TelescopeMoveProcess                        , comment: "Move M2 to the given position in mm"}
          openCover                       : { type: marvel_common.Process                         , comment: "Open the telescope cover" }
          closeCover                      : { type: marvel_common.Process                         , comment: "Close the telescope cover" }
      calls:
          # processes
          initialize:
              isEnabled                   : !AND [ !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ],
                                                   !OR [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.shutdown ],
                                                         !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initializingFailed ],
                                                         !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ] ] ]
          lock:
              isEnabled                   : !EQ [ operatorStatus_ref, marvel_common.OperatorStatus.tech ]
          unlock:
              isEnabled                   : !AND [ !EQ [ operatorStatus_ref, marvel_common.OperatorStatus.tech ],
                                                   !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked ] ]
          changeOperatingState:
              isEnabled                   : !AND [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle], 
                                                   !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized], 
                                                   !EQ [ operatorStatus_ref, marvel_common.OperatorStatus.tech ] ]
          reset:
              isEnabled                   : !AND [ !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle],
                                                   !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ] ]
          slewToCoordinates:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle],
                                                   !EQ [ statuses.poweredStatus, marvel_common.PoweredStatus.enabled ] ]
          slewToAziEle:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle],
                                                   !EQ [ statuses.poweredStatus, marvel_common.PoweredStatus.enabled ] ]
          abortSlew:
              isEnabled                   : !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ]
          powerOn:
              isEnabled                   : !AND [  !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.locked] ],
                                                    !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                    !EQ [ processes.powerOn.statuses.busyStatus, marvel_common.BusyStatus.idle] ]
          powerOff:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ processes.powerOff.statuses.busyStatus, marvel_common.BusyStatus.idle] ]
          moveKnownPosition:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ statuses.busyStatus, marvel_common.BusyStatus.idle],
                                                   !EQ [ statuses.poweredStatus, marvel_common.PoweredStatus.enabled ] ]
          setTracking:
              isEnabled                   : !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ]
          openCover:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ processes.openCover.statuses.busyStatus, marvel_common.BusyStatus.idle] ]
          closeCover:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ processes.closeCover.statuses.busyStatus, marvel_common.BusyStatus.idle] ]
          moveM2:
              isEnabled                   : !AND [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ],
                                                   !EQ [ processes.moveM2.statuses.busyStatus, marvel_common.BusyStatus.idle] ]
          # statuses
          healthStatus:
              superState                  : !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.shutdown] ]
              isGood                      : !AND [  !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initializingFailed] ],
                                                    isTelConnected,
                                                    isAccConnected,
                                                    !MTCS_SUMMARIZE_GOOD [
                                                       processes.initialize,
                                                       processes.changeOperatingState,
                                                       processes.slewToCoordinates,
                                                       processes.slewToAziEle,
                                                       processes.abortSlew,
                                                       processes.powerOn,
                                                       processes.powerOff,
                                                       processes.moveKnownPosition,
                                                       processes.setTracking,
                                                       processes.moveM2,
                                                       processes.openCover,
                                                       processes.closeCover ]
                                            ]
              hasWarning                  : !MTCS_SUMMARIZE_WARN [
                                                       processes.initialize,
                                                       processes.changeOperatingState,
                                                       processes.slewToCoordinates,
                                                       processes.slewToAziEle,
                                                       processes.abortSlew,
                                                       processes.powerOn,
                                                       processes.powerOff,
                                                       processes.moveKnownPosition,
                                                       processes.setTracking,
                                                       processes.moveM2,
                                                       processes.openCover,
                                                       processes.closeCover ]
          busyStatus:
              superState                  : !NOT [ !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.shutdown] ]
              isBusy                      : !MTCS_SUMMARIZE_BUSY [
                                                       processes.initialize,
                                                       processes.changeOperatingState,
                                                       processes.slewToCoordinates,
                                                       processes.slewToAziEle,
                                                       processes.abortSlew,
                                                       processes.powerOn,
                                                       processes.powerOff,
                                                       processes.moveKnownPosition,
                                                       processes.setTracking,
                                                       processes.moveM2,
                                                       processes.openCover,
                                                       processes.closeCover ]
        #   operatingStatus:
        #       superState                  : !EQ [ statuses.initializationStatus, marvel_common.InitializationStatus.initialized ]
  
  