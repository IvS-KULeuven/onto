        tpLegSE:       { config_ref: config_ref.tpLegSE, sharedConfig_ref: config_ref.shared.sensors }
        tpLegSW:       { config_ref: config_ref.tpLegSW, sharedConfig_ref: config_ref.shared.sensors }

        tpLegTopNE:    { config_ref: config_ref.tpLegTopNE, sharedConfig_ref: config_ref.shared.sensors }
        tpLegTopNW:    { config_ref: config_ref.tpLegTopNW, sharedConfig_ref: config_ref.shared.sensors }
        tpLegTopSE:    { config_ref: config_ref.tpLegTopSE, sharedConfig_ref: config_ref.shared.sensors }
        tpLegTopSW:    { config_ref: config_ref.tpLegTopSW, sharedConfig_ref: config_ref.shared.sensors }

        tpVesBotNE:    { config_ref: config_ref.tpVesBotNE, sharedConfig_ref: config_ref.shared.sensors }
        tpVesBotNW:    { config_ref: config_ref.tpVesBotNW, sharedConfig_ref: config_ref.shared.sensors }
        tpVesBotSE:    { config_ref: config_ref.tpVesBotSE, sharedConfig_ref: config_ref.shared.sensors }
        tpVesBotSW:    { config_ref: config_ref.tpVesBotSW, sharedConfig_ref: config_ref.shared.sensors }

        tpCentre:      { config_ref: config_ref.tpCentre, sharedConfig_ref: config_ref.shared.sensors }
        tpCentreTH10K: { config_ref: config_ref.tpCentreTH10K, sharedConfig_ref: config_ref.shared.sensors }

        tpVesSideN:    { config_ref: config_ref.tpVesSideN, sharedConfig_ref: config_ref.shared.sensors }
        tpVesSideS:    { config_ref: config_ref.tpVesSideS, sharedConfig_ref: config_ref.shared.sensors }
        tpVesSideE:    { config_ref: config_ref.tpVesSideE, sharedConfig_ref: config_ref.shared.sensors }
        tpVesSideW:    { config_ref: config_ref.tpVesSideW, sharedConfig_ref: config_ref.shared.sensors }

        tpVesLidN:     { config_ref: config_ref.tpVesLidN, sharedConfig_ref: config_ref.shared.sensors }
        tpVesLidS:     { config_ref: config_ref.tpVesLidS, sharedConfig_ref: config_ref.shared.sensors }

        tpCryoRear:    { config_ref: config_ref.tpCryoRear, sharedConfig_ref: config_ref.shared.sensors }

        #heaeters
        htLegNE:       { config_ref: config_ref.htLegNE, sharedConfig_ref: config_ref.shared.heaters}
        htLegNW:       { config_ref: config_ref.htLegNW, sharedConfig_ref: config_ref.shared.heaters}
