########################################################################################################################
#                                                                                                                      #
# Model containing the spectro temperature control unit software design                                              #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:

!IMPORT models/in/marvel/marvel_common.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:

!LIBRARY marvel_STCU:

########################################################################################################################
# stuses
########################################################################################################################
  !ENUMERATION TempControlStatus:
    items: [idle, warming_up, controlling ]


########################################################################################################################
# configs
########################################################################################################################



  ### single heater config ####
  !CONFIG HeaterConfig:
    items:
      name : { type: t_string, comment: "Name of the heater" }
      enabled : { type: t_bool, comment: "True if the heater is enabled" }
      maxPower : { type: t_float, comment: "Maximum power of the heater" }
      Kp : { type: t_float, comment: proportional gain }
      Tn : { type: t_float, comment: integral gain (in seconds) }
      Tv : { type: t_float, comment: derivative gain D-T1 (in seconds) }
      Td : { type: t_float, comment: derivative damping time D-T1 (in seconds) }
      maxDeviation : { type: t_float, comment: "Maximum allowed deviation from the set point for the associated temperature sensors in kelvin" }


  ### single temperature sensor config (small variation of version found in marvel_common) ###
  !CONFIG MeasurementConfig:
    items:
      name : { type: t_string, comment: "Name of the temperature sensor" }
      enabled:
          type: t_bool
          comment: "Is the quantity being measured? (Can be false e.g. if the sensor is deliberately not connected (yet).)"
      gain:
          type: t_double
          comment: "Gain to be applied to the measured value (default: 1 = no gain)"
          initial: !DOUBLE 1.0
      offset:
          type: t_double
          comment: "Offset to be added to the measured value (default: 0 = no offset)"
      alarms:
          type: marvel_common.HiHiLoLoAlarmConfig
          comment: "Config"

  ### simulation config ###
  !CONFIG SimulationConfig:
    items:
      isSimulated                : {type: t_bool}
      ambient: { type: marvel_common.Temperature, comment: starting temp of sensors}
      heating: {type: t_float, comment: heating gain/factor (0-1)}
      cooling: {type: t_float, comment: cooling factor (0-1)}
      weights : { type: !ARRAY [0, 25, !ARRAY [0, 19, t_float]], comment: "value between 0-1 representing the effect each heater has on each temperature sensor" }



  #########################################
  ### vessel temperature control config ###
  #########################################
  !CONFIG TempControlConfig:
    items:
      simulation                 : {type: SimulationConfig}
      setPointTarget             : { type: marvel_common.Temperature  , comment: "set point temperature in kelvin" }
      rampVPos                   : { type: t_float  , comment: "velocity of temperature change in K/s while ramping up" }
      rampVNeg                   : { type: t_float  , comment: "velocity of temperature change in K/s while ramping down" }
      rampStart                  : { type: t_float  , comment: "temperature in kelvin at which the ramp starts (e.g. to avoid overshoot)" }
      maxDeviation               : { type: marvel_common.Temperature  , comment: "Maximum allowed deviation from other temp sensors in the vessel in kelvin" }
      warnDeviation              : { type: marvel_common.Temperature  , comment: "Deviation from the set point at which a warning is issued in kelvin" }
      weights : { type: !ARRAY [0, 19, !ARRAY [0, 25, t_float]], comment: "value between 0-1 representing the weight of each temperature sensor for each heater" }

      #sensors
      tpT1:          { type: MeasurementConfig, comment: "Config for temp sensor T1" }
      tpT2:          { type: MeasurementConfig, comment: "Config for temp sensor T2" }
      tpT3:          { type: MeasurementConfig, comment: "Config for temp sensor T3" }
      tpT4:          { type: MeasurementConfig, comment: "Config for temp sensor T4" }

      tpLegNE:       { type: MeasurementConfig, comment: "Config for Leg NE" }
      tpLegNW:       { type: MeasurementConfig, comment: "Config for Leg NW" }
      tpLegSE:       { type: MeasurementConfig, comment: "Config for Leg SE" }
      tpLegSW:       { type: MeasurementConfig, comment: "Config for Leg SW" }

      tpLegTopNE:    { type: MeasurementConfig, comment: "Config for Leg Top NE" }
      tpLegTopNW:    { type: MeasurementConfig, comment: "Config for Leg Top NW" }
      tpLegTopSE:    { type: MeasurementConfig, comment: "Config for Leg Top SE" }
      tpLegTopSW:    { type: MeasurementConfig, comment: "Config for Leg Top SW" }

      tpVesBotNE:    { type: MeasurementConfig, comment: "Config for Vessel Bottom NE" }
      tpVesBotNW:    { type: MeasurementConfig, comment: "Config for Vessel Bottom NW" }
      tpVesBotSE:    { type: MeasurementConfig, comment: "Config for Vessel Bottom SE" }
      tpVesBotSW:    { type: MeasurementConfig, comment: "Config for Vessel Bottom SW" }

      tpCentre:      { type: MeasurementConfig, comment: "Config for Centre" }
      tpCentreTH10K: { type: MeasurementConfig, comment: "Config for Centre TH10K" }

      tpVesSideN:    { type: MeasurementConfig, comment: "Config for Vessel Side N" }
      tpVesSideS:    { type: MeasurementConfig, comment: "Config for Vessel Side S" }
      tpVesSideE:    { type: MeasurementConfig, comment: "Config for Vessel Side E" }
      tpVesSideW:    { type: MeasurementConfig, comment: "Config for Vessel Side W" }

      tpVesLidN:     { type: MeasurementConfig, comment: "Config for Vessel Lid N" }
      tpVesLidS:     { type: MeasurementConfig, comment: "Config for Vessel Lid S" }

      tpCryoRear:    { type: MeasurementConfig, comment: "config for sensor cryo rear outside"}

      #heaters
      htLegNE:       { type: HeaterConfig, comment: "Config for heater Leg NE" }
      htLegNW:       { type: HeaterConfig, comment: "Config for heater Leg NW" }
      htLegSE:       { type: HeaterConfig, comment: "Config for heater Leg SE" }
      htLegSW:       { type: HeaterConfig, comment: "Config for heater Leg  SW" }

      htLegTopNE:    { type: HeaterConfig, comment: "Config for heater Leg Top NE" }
      htLegTopNW:    { type: HeaterConfig, comment: "Config for heater Leg Top NW" }
      htLegTopSE:    { type: HeaterConfig, comment: "Config for heater  Leg Top SE" }
      htLegTopSW:    { type: HeaterConfig, comment: "Config for heater  Leg Top SW" }

      htVesBotNE:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom NE" }
      htVesBotNW:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom NW" }
      htVesBotSE:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom SE" }
      htVesBotSW:    { type: HeaterConfig, comment: "Config for heater Vessel Bottom SW" }

      htVesSideNE:    { type: HeaterConfig, comment: "Config for heater Vessel Side NE" }
      htVesSideNW:    { type: HeaterConfig, comment: "Config for heater Vessel Side NW" }
      htVesSideSE:    { type: HeaterConfig, comment: "Config for heater Vessel Side SE" }
      htVesSideSW:    { type: HeaterConfig, comment: "Config for heater Vessel Side SW" }

      htVesLidN:     { type: HeaterConfig, comment: "Config for heater Vessel Lid N" }
      htVesLidS:     { type: HeaterConfig, comment: "Config for heater Vessel Lid S" }

      htCryoRear:    { type: HeaterConfig, comment: "config for heater cryo rear outside"}


  ###################
  ### STCU config ###
  ###################
  !CONFIG STCUConfig:
    items:
      vesselTempControl: { type: TempControlConfig, comment: "Config for the vessel temperature control" }
      tempCabinet: { type: MeasurementConfig, comment: "Config for the temperature measurement in the electrical cabinet" }
      

########################################################################################################################
# state machine's vessel
########################################################################################################################

### state machine single temp measurement ###
  !STATEMACHINE TempMeasurement:
    variables_hidden:
        rawValue        : { type: t_float              , comment: "Measured raw value"                                        , address: "%I*" }
        conversionFactor: { type: t_double             , comment: "rawValue * conversionFactor = temperature.degrees.value"  }

    variables_output:
        actual          : { type: marvel_common.Temperature          , comment: "Actual value" }
        average         : { type: marvel_common.Temperature          , comment: "Moving average value" }

    variables_input:
      isSimulated : {type: t_bool}
      simulatedVal: {type: marvel_common.Temperature}

    references:
        config_ref          : { type: MeasurementConfig, comment: "Reference to the config (alarms in degrees celsius)" }


    stat:
        enabled         : { type: marvel_common.EnabledStatus        , comment: "Is the measurement enabled?" }
        health          : { type: marvel_common.HealthStatus         , comment: "Is the measurement OK?" }
        alarm           : { type: marvel_common.HiHiLoLoAlarmStatus  , comment: "Alarm status"}

    calls:
        enabled:
            superState   : !BOOL TRUE
            isEnabled    : config_ref.enabled

        alarm:
            superState   : !EQ [ stat.enabled, marvel_common.EnabledStatus.enabled ]
            config       : config_ref.alarms 
            value        : average.celsius.value

        health:
            superState   : !EQ [ stat.enabled, marvel_common.EnabledStatus.enabled ]
            isGood       : !NOT [ !OR [
                                       !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.hiHi ],
                                       !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.loLo ]
                                     ] ]
            hasWarning   : !OR [
                                !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.hi ],
                                !EQ [ stat.alarm, marvel_common.HiHiLoLoAlarmStatus.lo ]
                               ]


### state machine single heater ###
  !STATEMACHINE HeaterControl:
    variables_output:
        power                   : { type: t_float, comment: "Current power of the heater in percentage" } 
        active                  : { type: t_bool, comment: "True if the heater is active" }
        deviation               : { type: t_float, comment: "Current error between set point and associated temperature" }
        isControlled            : { type: t_bool, comment: "True if the heater is in controlled state" }

    variables_input:     
        setPoint                : { type: t_float, comment: "Current set point of the heater in kelvin" }
        zoneTemp                : { type: marvel_common.Temperature, comment: "Associated temperature of the heater in kelvin" }
        isSimulated : {type: t_bool}


    references:
      config_ref                  : { type: HeaterConfig    , comment: "Reference to the heater config" }

    stat:
      init                        : { type: marvel_common.InitializationStatus }
      enabled         : { type: marvel_common.EnabledStatus        , comment: "Is the heater enabled?" }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the heater healthy?" }
    proc:
      initialize      : { type: marvel_common.Process                     , comment: "Initialize the heater" }
      reset           : { type: marvel_common.Process                     , comment: "Reset the heater" }

    calls:
        enabled:
            superState   : !BOOL TRUE
            isEnabled    : config_ref.enabled
      #proc
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ] ] 

        reset:
          isEnabled    : !BOOL TRUE

################################################
### state machine vessel temperature control ###
################################################
  !STATEMACHINE TempControl:
    variables_output:
      avgTemperature          : { type: marvel_common.Temperature                                              , comment: "Average temperature of the vessel in kelvin" }
      maxTemperatureDeviation : { type: marvel_common.Temperature                                               , comment: "Maximum deviation of the temperature sensors in kelvin" }
      isControlled            : { type: t_bool                                                , comment: "True if the vessel is in controlled state" }
      setPointRamped          : { type: t_float                                               , comment: "Set point temperature in kelvin after ramping" }
      badHealthSensors   : { type: t_bool               , comment: "True if there are temperature sensors in bad health" }
      badHealthHeaters   : { type: t_bool               , comment: "True if there are heaters in bad health" }

      #thermostat switch enabled
      enableTstatBottom        :    { type: t_bool, comment: "Thermostat switch vessel bottom enabled ", address: "%Q*" } 
      enableTstatCryoRear     :    { type: t_bool, comment: "Thermostat switch cryo rear enabled ", address: "%Q*" }
      enableTstatLid       :    { type: t_bool, comment: "Thermostat switch lid top enabled ", address: "%Q*" }
      enableK6                 :    { type: t_bool, comment: "relay k6 enabled (place holder for future tstat's)", address: "%Q*" }
      enableK7                 :    { type: t_bool, comment: "relay k7 enabled (place holder for future tstat's)", address: "%Q*" }
      enableK8                 :    { type: t_bool, comment: "relay k8 enabled (place holder for future tstat's)", address: "%Q*" }
      enableK9                 :    { type: t_bool, comment: "relay k9 enabled (place holder for future tstat's)", address: "%Q*" }

    variables_input:
      #thermostat switch states
      stateTstatBottom              :    { type: t_bool, comment: "State of the thermostat switch at the vessel bottom", address: "%I*" }
      stateTstatCryoRear             :    { type: t_bool, comment: "State of the thermostat switch at the cryo rear", address: "%I*" }
      stateTstatLid                 :    { type: t_bool, comment: "State of the thermostat switch at the lid top", address: "%I*" }
      stateK6                       :    { type: t_bool, comment: "State of relay k6 (place holder for future tstat's)", address: "%I*" }
      stateK7                       :    { type: t_bool, comment: "State of relay k7 (place holder for future tstat's)", address: "%I*" }
      stateK8                       :    { type: t_bool, comment: "State of relay k8 (place holder for future tstat's)", address: "%I*" }
      stateK9                       :    { type: t_bool, comment: "State of relay k9 (place holder for future tstat's)", address: "%I*" }

    parts:
      #sensors
      tpT1:          { type: TempMeasurement, comment: "1st temp sensor",           arguments: { config_ref: { type: MeasurementConfig } } }
      tpT2:          { type: TempMeasurement, comment: "2nd temp sensor",           arguments: { config_ref: { type: MeasurementConfig } } }
      tpT3:          { type: TempMeasurement, comment: "3rd temp sensor",           arguments: { config_ref: { type: MeasurementConfig } } }
      tpT4:          { type: TempMeasurement, comment: "4th temp sensor",           arguments: { config_ref: { type: MeasurementConfig } } }

      tpLegNE:       { type: TempMeasurement, comment: "Leg NE",                    arguments: { config_ref: { type: MeasurementConfig } } }
      tpLegNW:       { type: TempMeasurement, comment: "Leg NW",                    arguments: { config_ref: { type: MeasurementConfig } } }
      tpLegSE:       { type: TempMeasurement, comment: "Leg SE",                    arguments: { config_ref: { type: MeasurementConfig } } }
      tpLegSW:       { type: TempMeasurement, comment: "Leg SW",                    arguments: { config_ref: { type: MeasurementConfig } } }

      tpLegTopNE:    { type: TempMeasurement, comment: "Leg Top NE",                arguments: { config_ref: { type: MeasurementConfig } } }
      tpLegTopNW:    { type: TempMeasurement, comment: "Leg Top NW",                arguments: { config_ref: { type: MeasurementConfig } } }
      tpLegTopSE:    { type: TempMeasurement, comment: "Leg Top SE",                arguments: { config_ref: { type: MeasurementConfig } } }
      tpLegTopSW:    { type: TempMeasurement, comment: "Leg Top SW",                arguments: { config_ref: { type: MeasurementConfig } } }

      tpVesBotNE:    { type: TempMeasurement, comment: "Vessel Bottom NE",          arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesBotNW:    { type: TempMeasurement, comment: "Vessel Bottom NW",          arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesBotSE:    { type: TempMeasurement, comment: "Vessel Bottom SE",          arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesBotSW:    { type: TempMeasurement, comment: "Vessel Bottom SW",          arguments: { config_ref: { type: MeasurementConfig } } }

      tpCentre:      { type: TempMeasurement, comment: "Centre",                    arguments: { config_ref: { type: MeasurementConfig } } }
      tpCentreTH10K: { type: TempMeasurement, comment: "Centre TH10K",              arguments: { config_ref: { type: MeasurementConfig } } }

      tpVesSideN:    { type: TempMeasurement, comment: "Vessel Side N",             arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesSideS:    { type: TempMeasurement, comment: "Vessel Side S",             arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesSideE:    { type: TempMeasurement, comment: "Vessel Side E",             arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesSideW:    { type: TempMeasurement, comment: "Vessel Side W",             arguments: { config_ref: { type: MeasurementConfig } } }

      tpVesLidN:     { type: TempMeasurement, comment: "Vessel Lid N",              arguments: { config_ref: { type: MeasurementConfig } } }
      tpVesLidS:     { type: TempMeasurement, comment: "Vessel Lid S",              arguments: { config_ref: { type: MeasurementConfig } } }

      tpCryoRear:     { type: TempMeasurement, comment: "Cryo Rear",                arguments: { config_ref: { type: MeasurementConfig } } }

      #heaters
      htLegNE:       { type: HeaterControl, comment: "Heater control for Leg NE",              arguments: { config_ref: { type: HeaterConfig } } }
      htLegNW:       { type: HeaterControl, comment: "Heater control for Leg NW",              arguments: { config_ref: { type: HeaterConfig } } }
      htLegSE:       { type: HeaterControl, comment: "Heater control for Leg SE",              arguments: { config_ref: { type: HeaterConfig } } }
      htLegSW:       { type: HeaterControl, comment: "Heater control for Leg SW",              arguments: { config_ref: { type: HeaterConfig } } }

      htLegTopNE:    { type: HeaterControl, comment: "Heater control for Leg Top NE",          arguments: { config_ref: { type: HeaterConfig } } }
      htLegTopNW:    { type: HeaterControl, comment: "Heater control for Leg Top NW",          arguments: { config_ref: { type: HeaterConfig } } }
      htLegTopSE:    { type: HeaterControl, comment: "Heater control for Leg Top SE",          arguments: { config_ref: { type: HeaterConfig } } }
      htLegTopSW:    { type: HeaterControl, comment: "Heater control for Leg Top SW",          arguments: { config_ref: { type: HeaterConfig } } }

      htVesBotNE:    { type: HeaterControl, comment: "Heater control for Vessel Bottom NE",    arguments: { config_ref: { type: HeaterConfig } } }
      htVesBotNW:    { type: HeaterControl, comment: "Heater control for Vessel Bottom NW",    arguments: { config_ref: { type: HeaterConfig } } }
      htVesBotSE:    { type: HeaterControl, comment: "Heater control for Vessel Bottom SE",    arguments: { config_ref: { type: HeaterConfig } } }
      htVesBotSW:    { type: HeaterControl, comment: "Heater control for Vessel Bottom SW",    arguments: { config_ref: { type: HeaterConfig } } }

      htVesSideNE:   { type: HeaterControl, comment: "Heater control for Vessel Side NE",      arguments: { config_ref: { type: HeaterConfig } } }
      htVesSideNW:   { type: HeaterControl, comment: "Heater control for Vessel Side NW",      arguments: { config_ref: { type: HeaterConfig } } }
      htVesSideSE:   { type: HeaterControl, comment: "Heater control for Vessel Side SE",      arguments: { config_ref: { type: HeaterConfig } } }
      htVesSideSW:   { type: HeaterControl, comment: "Heater control for Vessel Side SW",      arguments: { config_ref: { type: HeaterConfig } } }

      htVesLidN:     { type: HeaterControl, comment: "Heater control for Vessel Lid N",        arguments: { config_ref: { type: HeaterConfig } } }
      htVesLidS:     { type: HeaterControl, comment: "Heater control for Vessel Lid S",        arguments: { config_ref: { type: HeaterConfig } } }

      htCryoRear:     { type: HeaterControl, comment: "Heater control for Cryo Rear",           arguments: { config_ref: { type: HeaterConfig } } }
          
          
    references:
      config_ref              : { type: TempControlConfig                              , comment: "Active configuration of the vessel" }
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}

    stat:
      init                        : { type: marvel_common.InitializationStatus }
      health          : { type: marvel_common.HealthStatus         , comment: "Is the tempcontrol healthy?" }
      state           : { type: TempControlStatus                   , comment: "Actual state of the tempcontrol" }

    proc:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }
      warm_up                     : { type: marvel_common.Process                     , comment: "Start warming up" }
      stop                        : { type: marvel_common.Process                     , comment: "Stop heating" }
      reset                       : { type: marvel_common.Process                     , comment: "Reset complete" }   

    calls:
      #proc's
        initialize:
          isEnabled    : !NOT [ !OR [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ],
                                      !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ] ] 
        warm_up:                                  
          isEnabled    : !AND [ !EQ [ stat.state, TempControlStatus.idle ], !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ]
        stop:
          isEnabled    : !OR [ !EQ [ stat.state, TempControlStatus.warming_up ], !EQ [ stat.state, TempControlStatus.controlling ] ]
        reset:
          isEnabled    : !BOOL TRUE

      #parts
        #sensors
        tpT1:          { config_ref: config_ref.tpT1 }
        tpT2:          { config_ref: config_ref.tpT2 }
        tpT3:          { config_ref: config_ref.tpT3 }
        tpT4:          { config_ref: config_ref.tpT4 }

        tpLegNE:       { config_ref: config_ref.tpLegNE }
        tpLegNW:       { config_ref: config_ref.tpLegNW }
        tpLegSE:       { config_ref: config_ref.tpLegSE }
        tpLegSW:       { config_ref: config_ref.tpLegSW }

        tpLegTopNE:    { config_ref: config_ref.tpLegTopNE }
        tpLegTopNW:    { config_ref: config_ref.tpLegTopNW }
        tpLegTopSE:    { config_ref: config_ref.tpLegTopSE }
        tpLegTopSW:    { config_ref: config_ref.tpLegTopSW }

        tpVesBotNE:    { config_ref: config_ref.tpVesBotNE }
        tpVesBotNW:    { config_ref: config_ref.tpVesBotNW }
        tpVesBotSE:    { config_ref: config_ref.tpVesBotSE }
        tpVesBotSW:    { config_ref: config_ref.tpVesBotSW }

        tpCentre:      { config_ref: config_ref.tpCentre }
        tpCentreTH10K: { config_ref: config_ref.tpCentreTH10K }

        tpVesSideN:    { config_ref: config_ref.tpVesSideN }
        tpVesSideS:    { config_ref: config_ref.tpVesSideS }
        tpVesSideE:    { config_ref: config_ref.tpVesSideE }
        tpVesSideW:    { config_ref: config_ref.tpVesSideW }

        tpVesLidN:     { config_ref: config_ref.tpVesLidN }
        tpVesLidS:     { config_ref: config_ref.tpVesLidS }

        tpCryoRear:    { config_ref: config_ref.tpCryoRear}

        #heaeters
        htLegNE:       { config_ref: config_ref.htLegNE }
        htLegNW:       { config_ref: config_ref.htLegNW }
        htLegSE:       { config_ref: config_ref.htLegSE }
        htLegSW:       { config_ref: config_ref.htLegSW }

        htLegTopNE:    { config_ref: config_ref.htLegTopNE }
        htLegTopNW:    { config_ref: config_ref.htLegTopNW }
        htLegTopSE:    { config_ref: config_ref.htLegTopSE }
        htLegTopSW:    { config_ref: config_ref.htLegTopSW }

        htVesBotNE:    { config_ref: config_ref.htVesBotNE }
        htVesBotNW:    { config_ref: config_ref.htVesBotNW }
        htVesBotSE:    { config_ref: config_ref.htVesBotSE }
        htVesBotSW:    { config_ref: config_ref.htVesBotSW }

        htVesSideNE:   { config_ref: config_ref.htVesSideNE }
        htVesSideNW:   { config_ref: config_ref.htVesSideNW }
        htVesSideSE:   { config_ref: config_ref.htVesSideSE }
        htVesSideSW:   { config_ref: config_ref.htVesSideSW }

        htVesLidN:     { config_ref: config_ref.htVesLidN }
        htVesLidS:     { config_ref: config_ref.htVesLidS }

        htCryoRear:    { config_ref: config_ref.htCryoRear}


########################################################################################################################
# state machine's STCU
########################################################################################################################
  !STATEMACHINE STCU:
    references:
      activity_ref            : { type: marvel_common.ActivityStatus              , comment: "Shared activity status"}
      services_ref            : { type: marvel_services.Services                  , comment: "Shared services", expand: false}
    
    variables_output:
      config                  : { type: STCUConfig, comment: "Active configuration of the STCU" }
      
    parts:
      tempCabinet:     { type: TempMeasurement, comment: "temp measurement in electrical cabinet",              arguments: { config_ref: { type: MeasurementConfig } } }

      VesselTempControl:
        type: TempControl
        expand: false
        comment: "State machine for the vessel temperature control" 
        arguments:
                activity_ref              : { type: marvel_common.ActivityStatus          , expand: false }
                services_ref              : { type: marvel_services.Services              , expand: false }
                config_ref                : { type: TempControlConfig                     , expand: false }
      configManager:
        comment                     : "The config manager (to load/save/activate configuration data)"
        type                        : marvel_common.ConfigManager
    stat:
      health                      : { type: marvel_common.HealthStatus }
      busy                        : { type: marvel_common.BusyStatus }

    proc:
      initialize                  : { type: marvel_common.Process                     , comment: "Start initializing" }



    calls:
      health:
        superState   : !BOOL TRUE
        isGood      :  !EQ [ parts.VesselTempControl.stat.health, marvel_common.HealthStatus.good ]
                                
                              
        hasWarning  : !EQ [ parts.VesselTempControl.stat.health, marvel_common.HealthStatus.warning ]

    #parts
      tempCabinet:     { config_ref: config.tempCabinet }
      VesselTempControl:
              activity_ref        : activity_ref
