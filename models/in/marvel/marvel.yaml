########################################################################################################################
#                                                                                                                      #
# Model containing the upper-level software design of the Marvel TCS.                                                  #
#                                                                                                                      #
########################################################################################################################

!VERSION marvel:


!IMPORT models/in/marvel/marvel_unit.yaml:
!IMPORT models/in/marvel/marvel_services.yaml:
!IMPORT models/in/marvel/marvel_solar.yaml:
!IMPORT models/in/marvel/marvel_thermovac.yaml:


########################################################################################################################
# Define the containing PLC library
########################################################################################################################

!LIBRARY marvel:


  ########################################################################################################################
  # MarvelConfig
  ########################################################################################################################
  !CONFIG MarvelConfig:
      items:
        endOfNightId         : { type: t_string, len: 30                              , comment: "ID of the EndOfNight procedure0 "}

        # seqs               : { type: !ARRAY [0, 5, marvel_common.SequenceConfig_M ]  , comment: "Sequences"}

        # endOfNight          : { type: !ARRAY [0, 10, marvel_common.ActionConfig]    , comment: "End of night actions"}
        # endOfNightName      : { type: t_string  , initial: "'EndOfNight'"           , comment: "End of night actions name"}
        # # free-to-choose actions
        # actions0            : { type: !ARRAY [0, 10, marvel_common.ActionConfig]    , comment: "Free-to-choose actions set 0"}
        # actions1            : { type: !ARRAY [0, 10, marvel_common.ActionConfig]    , comment: "Free-to-choose actions set 1"}
        # actions2            : { type: !ARRAY [0, 10, marvel_common.ActionConfig]    , comment: "Free-to-choose actions set 2"}
        # actions3            : { type: !ARRAY [0, 10, marvel_common.ActionConfig]    , comment: "Free-to-choose actions set 3"}
        # actions4            : { type: !ARRAY [0, 10, marvel_common.ActionConfig]    , comment: "Free-to-choose actions set 4"}
        # actions0Name        : { type: t_string                                      , comment: "Free-to-choose actions set 0 name"}
        # actions1Name        : { type: t_string                                      , comment: "Free-to-choose actions set 1 name"}
        # actions2Name        : { type: t_string                                      , comment: "Free-to-choose actions set 2 name"}
        # actions3Name        : { type: t_string                                      , comment: "Free-to-choose actions set 3 name"}
        # actions4Name        : { type: t_string                                      , comment: "Free-to-choose actions set 4 name"}


  ########################################################################################################################
  # MarvelPointProcess
  ########################################################################################################################
  !PROCESS MarvelPointProcess:
      extends: marvel_common.BaseProcess
      arguments:
          alpha               : { type: t_double                            , comment: "Right ascention, in hours" }
          delta               : { type: t_double                            , comment: "Declination, in degrees" }
          u1                  : { type: t_bool                              , comment: "True to point Unit 1" }
          u2                  : { type: t_bool                              , comment: "True to point Unit 2" }
          u3                  : { type: t_bool                              , comment: "True to point Unit 3" }
          u4                  : { type: t_bool                              , comment: "True to point Unit 4" }
  

  ########################################################################################################################
  # MarvelMultiUnitProcess
  ########################################################################################################################
  !PROCESS MarvelMultiUnitProcess:
      extends: marvel_common.BaseProcess
      arguments:
          u1                  : { type: t_bool                              , comment: "True to use Unit 1" }
          u2                  : { type: t_bool                              , comment: "True to use Unit 2" }
          u3                  : { type: t_bool                              , comment: "True to use Unit 3" }
          u4                  : { type: t_bool                              , comment: "True to use Unit 4" }
  
  ########################################################################################################################
  # MarvelStatus
  ########################################################################################################################

  !STRUCT MarvelStatus:
    items:
        noOfFailedOperatorChanges     : { type: t_uint16                    , comment: "How many times has a wrong password been entered?"}
        shuttersStatus                : { type: t_string, len: 16           , comment: "Summary of the domes open/closed state" }
        noOfRaisedUnconfirmedAlarms   : { type: t_uint16                    , comment: "Number of raised unconfirmed alarms" }
        noOfRaisedConfirmedAlarms     : { type: t_uint16                    , comment: "Number of raised confirmed alarms" }
        noOfClearedUnconfirmedAlarms : { type: t_uint16                     , comment: "Number of cleared unconfirmed alarms" }


  ########################################################################################################################
  # Marvel
  ########################################################################################################################
  !STATEMACHINE Marvel:
      variables_input_rw:
          editableConfig              : { type: MarvelConfig                  , comment: "Editable configuration" , expand: false }
    #   variables_input:
          # remoteOperationEnable       : { type: t_bool                      , comment: "True to Remote operation enabled" }
          # mocsObservationStatus       : { type: t_bool                      , comment: "True to notify that there is an observation running" }
          # remoteConnectionStatus      : { type: t_bool                      , comment: "True to notify that there is a remote connection" }
          # remoteconnectionPortStatus  : { type: t_bool                      , comment: "True to notify that there is a connection port established" }
          
      variables_output:
          config                        : { type: MarvelConfig                , comment: "Active configuration" }
          status                        : { type: MarvelStatus                , comment: "Summary status", expand: false }
      parts:
          u1:
              type : marvel_unit.Unit
              comment: "Unit 1"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
                  activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                  services_ref            : { type: marvel_services.Services              , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        stat:
                                            attributes:
                                                aperture: { type: marvel_common.ApertureStatus }
                                                health:   { type: marvel_common.HealthStatus }
                                                busy:     { type: marvel_common.BusyStatus }
                                        proc:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
                  proc:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u2:
              type : marvel_unit.Unit
              comment: "Unit 2"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
                  activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                  services_ref            : { type: marvel_services.Services              , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        stat:
                                            attributes:
                                                aperture: { type: marvel_common.ApertureStatus }
                                                health:   { type: marvel_common.HealthStatus }
                                                busy:     { type: marvel_common.BusyStatus }
                                        proc:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
                  proc:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u3:
              type : marvel_unit.Unit
              comment: "Unit 3"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
                  activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                  services_ref            : { type: marvel_services.Services              , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        stat:
                                            attributes:
                                                aperture: { type: marvel_common.ApertureStatus }
                                                health:   { type: marvel_common.HealthStatus }
                                                busy:     { type: marvel_common.BusyStatus }
                                        proc:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
                  proc:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          u4:
              type : marvel_unit.Unit
              comment: "Unit 4"
              expand: false
              arguments:
                  number                  : { type: t_uint8 }
                  operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
                  activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                  services_ref            : { type: marvel_services.Services              , expand: false }
              attributes:
                  parts:
                    attributes:
                        dome:
                            attributes:
                                shutter:
                                    attributes:
                                        stat:
                                            attributes:
                                                aperture: { type: marvel_common.ApertureStatus }
                                                health:   { type: marvel_common.HealthStatus }
                                                busy:     { type: marvel_common.BusyStatus }
                                        proc:
                                            attributes:
                                                open:   { attributes: { isEnabled: { type: t_bool } } }
                                                close:  { attributes: { isEnabled: { type: t_bool } } }
                                                stop:   { attributes: { isEnabled: { type: t_bool } } }
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
                  proc:
                      attributes:
                        point:
                            attributes:
                                isEnabled : { type: t_bool }
          tv:
                type : marvel_thermovac.ThermoVac
                comment: "The thermo vac system"
                expand: false
                arguments:
                    activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                    services_ref            : { type: marvel_services.Services              , expand: false }
                    operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
          solar:
                type : marvel_solar.Solar
                comment: "The solar telescope"
                expand: false
                arguments:
                    activity_ref            : { type: marvel_common.ActivityStatus          , expand: false }
                    services_ref            : { type: marvel_services.Services              , expand: false }
                    operator_ref            : { type: marvel_common.OperatorStatus          , expand: false }
          services:
              type : marvel_services.Services
              comment: "Services"
              expand: false
              arguments:
                  operator_ref            : { type: marvel_common.OperatorStatus, expand: false }
              attributes:
                  stat:
                      attributes:
                          health          : { type: marvel_common.HealthStatus }
                          busy            : { type: marvel_common.BusyStatus }
          sequencer:
              comment                     : "The main sequencer of Marvel"
              type                        : marvel_common.Sequencer
          configManager:
              comment                     : "The config manager (to load/save/activate configuration data)"
              type                        : marvel_common.ConfigManager
      stat:
          init                        : { type: marvel_common.InitializationStatus }
          health                      : { type: marvel_common.HealthStatus }
          busy                        : { type: marvel_common.BusyStatus }
          operator                    : { type: marvel_common.OperatorStatus }
          passwordHealth              : { type: marvel_common.HealthStatus }
          activity                    : { type: marvel_common.ActivityStatus }
          shuttersHealth              : { type: marvel_common.HealthStatus }
          shuttersBusy                : { type: marvel_common.BusyStatus }
          shuttersAperture            : { type: marvel_common.ApertureStatus }
          eventsHealth                : { type: marvel_common.HealthStatus }
      proc:
          initialize                  : { type: marvel_common.Process                         , comment: "Start initializing the whole MTCS" }      
          lock                        : { type: marvel_common.Process                         , comment: "Lock the whole MTCS" }
          unlock                      : { type: marvel_common.Process                         , comment: "Unlock the whole MTCS" }
          changeOperator              : { type: marvel_common.ChangeOperatorStateProcess      , comment: "Change the operator (e.g. OBSERVER, TECH, ...)" }
          verifyPassword              : { type: marvel_common.ChangeOperatorStateProcess      , comment: "Only verify the operator password" }
          wakeUp                      : { type: marvel_common.Process                         , comment: "Wake up the whole Marvel TCS" }
          goToSleep                   : { type: marvel_common.Process                         , comment: "Let the whole Marvel TCS go to sleep" }
          emergencyClose              : { type: marvel_common.Process                         , comment: "Close all domes asap" }
          point                       : { type: MarvelPointProcess                          , comment: "Point multiple units at once"}
          openDomes                   : { type: MarvelMultiUnitProcess                      , comment: "Open the dome of multiple units at once"}
          closeDomes                  : { type: MarvelMultiUnitProcess                      , comment: "Close the dome of multiple units at once"}
          stopDomes                   : { type: MarvelMultiUnitProcess                      , comment: "Stop the dome of multiple units at once"}
      calls:
          initialize:
              isEnabled           : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.initializing ] ]
          lock:
              isEnabled           : !AND [ !EQ [ stat.operator, marvel_common.OperatorStatus.tech ],
                                           !EQ [ stat.init, marvel_common.InitializationStatus.initialized ] ]
          unlock:
              isEnabled           : !AND [ !EQ [ stat.operator, marvel_common.OperatorStatus.tech ], 
                                           !EQ [ stat.init, marvel_common.InitializationStatus.locked ] ]
          changeOperator:
              isEnabled           : !BOOL TRUE
          verifyPassword:
              isEnabled           : !BOOL TRUE
          wakeUp:
              isEnabled           : !BOOL TRUE
          goToSleep:
              isEnabled           : !BOOL TRUE # !OR [ stat.activity.awake, stat.health.bad ]
          point:
              isEnabled           : !OR [ parts.u1.proc.point.isEnabled,
                                          parts.u2.proc.point.isEnabled,
                                          parts.u3.proc.point.isEnabled,
                                          parts.u4.proc.point.isEnabled ]
          openDomes:
              isEnabled           : !OR [ parts.u1.parts.dome.parts.shutter.proc.open.isEnabled,
                                          parts.u2.parts.dome.parts.shutter.proc.open.isEnabled,
                                          parts.u3.parts.dome.parts.shutter.proc.open.isEnabled,
                                          parts.u4.parts.dome.parts.shutter.proc.open.isEnabled ]
          closeDomes:
              isEnabled           : !OR [ parts.u1.parts.dome.parts.shutter.proc.close.isEnabled,
                                          parts.u2.parts.dome.parts.shutter.proc.close.isEnabled,
                                          parts.u3.parts.dome.parts.shutter.proc.close.isEnabled,
                                          parts.u4.parts.dome.parts.shutter.proc.close.isEnabled ]
          stopDomes:
              isEnabled           : !OR [ parts.u1.parts.dome.parts.shutter.proc.stop.isEnabled,
                                          parts.u2.parts.dome.parts.shutter.proc.stop.isEnabled,
                                          parts.u3.parts.dome.parts.shutter.proc.stop.isEnabled,
                                          parts.u4.parts.dome.parts.shutter.proc.stop.isEnabled ]
          services:
              operator_ref        : stat.operator
          u1:
              number              : !UINT8 1
              operator_ref        : stat.operator
              activity_ref        : stat.activity
              services_ref        : parts.services
          u2:
              number              : !UINT8 2
              operator_ref        : stat.operator
              activity_ref        : stat.activity
              services_ref        : parts.services
          u3:
              number              : !UINT8 3
              operator_ref        : stat.operator
              activity_ref        : stat.activity
              services_ref        : parts.services
          u4:
              number              : !UINT8 4
              operator_ref        : stat.operator
              activity_ref        : stat.activity
              services_ref        : parts.services
          tv:
              activity_ref        : stat.activity
              services_ref        : parts.services
              operator_ref        : stat.operator
          solar:
              activity_ref        : stat.activity
              services_ref        : parts.services
              operator_ref        : stat.operator
          configManager:
             isEnabled            : !EQ [ stat.operator, marvel_common.OperatorStatus.tech ]
          sequencer:
             isEnabled            : !BOOL TRUE
          emergencyClose:
              isEnabled           : !NOT [ !AND [ !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ],
                                                  !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ] ,
                                                  !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ] ,
                                                  !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ] ] ]
          health:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isGood              : !AND [ !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.initializingFailed ] ],
                                           !MTCS_SUMMARIZE_GOOD [ parts.u1, parts.u2, parts.u3, parts.u4, parts.services, parts.configManager, parts.sequencer, parts.solar, parts.tv ] ]
              hasWarning          : !MTCS_SUMMARIZE_WARN [ parts.u1, parts.u2, parts.u3, parts.u4, parts.services, parts.configManager, parts.sequencer, parts.solar, parts.tv ]
          busy:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isBusy              : !MTCS_SUMMARIZE_BUSY [ parts.u1, parts.u2, parts.u3, parts.u4, parts.services, parts.configManager, parts.sequencer, parts.solar, parts.tv ]
          shuttersHealth:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isGood              : !MTCS_SUMMARIZE_GOOD [ parts.u1.parts.dome.parts.shutter, 
                                                           parts.u2.parts.dome.parts.shutter, 
                                                           parts.u3.parts.dome.parts.shutter, 
                                                           parts.u4.parts.dome.parts.shutter ]
              hasWarning          : !MTCS_SUMMARIZE_WARN [ parts.u1.parts.dome.parts.shutter, 
                                                           parts.u2.parts.dome.parts.shutter, 
                                                           parts.u3.parts.dome.parts.shutter, 
                                                           parts.u4.parts.dome.parts.shutter ]
          shuttersBusy:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isBusy              : !MTCS_SUMMARIZE_BUSY [ parts.u1.parts.dome.parts.shutter, 
                                                           parts.u2.parts.dome.parts.shutter, 
                                                           parts.u3.parts.dome.parts.shutter, 
                                                           parts.u4.parts.dome.parts.shutter ]
          shuttersAperture:
              superState          : !NOT [ !EQ [ stat.init, marvel_common.InitializationStatus.shutdown ] ]
              isOpen              : !OR [ !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.open ],
                                          !EQ [ parts.u2.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.open ],
                                          !EQ [ parts.u3.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.open ],
                                          !EQ [ parts.u4.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.open ],
                                          !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.partiallyOpen ],
                                          !EQ [ parts.u2.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.partiallyOpen ],
                                          !EQ [ parts.u3.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.partiallyOpen ],
                                          !EQ [ parts.u4.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.partiallyOpen ] ]
              isClosed            : !AND [ !EQ [ parts.u1.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ],
                                           !EQ [ parts.u2.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ],
                                           !EQ [ parts.u3.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ],
                                           !EQ [ parts.u4.parts.dome.parts.shutter.stat.aperture, marvel_common.ApertureStatus.closed ] ]
