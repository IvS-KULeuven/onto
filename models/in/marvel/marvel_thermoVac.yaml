        tBotNE:       { config_ref: config_ref.tBotNE, sharedConfig_ref: config_ref.shared.sensors }
        tBotNW:       { config_ref: config_ref.tBotNW, sharedConfig_ref: config_ref.shared.sensors }
        tBotS:        { config_ref: config_ref.tBotS, sharedConfig_ref: config_ref.shared.sensors }
        tCentre:      { config_ref: config_ref.tCentre, sharedConfig_ref: config_ref.shared.sensors }
        tCentreTh10k: { config_ref: config_ref.tCentreTh10k, sharedConfig_ref: config_ref.shared.sensors }

        #heaters
        htTopNE:       { config_ref: config_ref.htTopNE, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htTopNW:       { config_ref: config_ref.htTopNW, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htTopSE:       { config_ref: config_ref.htTopSE, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
        htTopSW:       { config_ref: config_ref.htTopSW, sharedConfig_ref: config_ref.shared.heaters, operator_ref: operator_ref }
